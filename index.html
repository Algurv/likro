// Runs: kept on this device, and copied to shared storage so the parent sees them on the phone.
function runsOf(kidId, storyId) {
  const local = K(kidId).runs[storyId] || [];
  const dates = new Set(local.map(r => r.date));
  const extra = remote.runs.filter(r => r.kid === kidId && r.storyId === storyId && !dates.has(r.date));
  return [...local, ...extra].sort((a, b) => a.date - b.date);
}
const isDone = (kidId, storyId) => runsOf(kidId, storyId).length > 0;

async function startRemote() {
  // The host may add window.claude a little after the page starts, so wait for it (up to 15 s).
  for (let i = 0; i < 60 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 250));
  remote.why = !(window.claude && window.claude.use) ? "no-claude" : "";
  if (remote.why) { refresh && refresh(); return; }
  let db = null, sample = null;
  try { [db, sample] = await Promise.all([claude.use("db"), claude.use("sample")]); } catch (e) { remote.why = "use-error: " + (e && e.message || e); }
  remote.sample = sample;
  if (!remote.why) remote.why = (db ? "" : "no-db ") + (sample ? "" : "no-sample");
  refresh && refresh();
  if (!db) return;
  remote.db = db;
  const timer = setTimeout(() => { remote.slow = true; refresh && refresh(); }, 10000);
  const watch = (name, key) => db.collection(name).onSnapshot(snap => {
    remote[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!snap.metadata.fromCache) { remote.loaded = true; remote.slow = false; clearTimeout(timer); if (key === "runs") backfillRuns(); }
    refresh && refresh();
  }, () => { clearTimeout(timer); remote.slow = true; refresh && refresh(); });
  watch("items", "items"); watch("drafts", "drafts"); watch("runs", "runs"); watch("kids", "kids");
  registerKid();
}

// Readings done before runs were shared live only on this device: copy them up once, so the parent sees them too.
let backfilled = false;
async function backfillRuns() {
  if (backfilled || !remote.db || !state.me || !state.kids[state.me]) return;
  backfilled = true;
  const kidId = state.me, have = new Set(remote.runs.filter(r => r.kid === kidId).map(r => r.storyId + "@" + r.date));
  const titles = {}; try { allStories(kidId).forEach(x => titles[x.id] = x.title); } catch (e) {}
  for (const [storyId, runs] of Object.entries(state.kids[kidId].runs)) {
    if (storyId === "preview") continue;
    for (const run of runs) {
      if (have.has(storyId + "@" + run.date)) continue;
      try { await remote.db.collection("runs").add({ kid: kidId, storyId, title: titles[storyId] || storyId, ...run, reads: (run.reads || []).map(r => ({ ms: r.ms, words: r.words })) }); } catch (e) { return; }
    }
  }
}

function shuffle(n) { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function read(kidId, story, back, nextStory) {
  const kid = state.kids[kidId];
  const run = { date: Date.now(), reads: [], qs: [] };
  let stepIdx = 0, shown = [], segStart = 0;  // segStart: first sentence read since the last question
  app.innerHTML = `<div class="screen">
    <div class="topbar"><button class="icon-btn" id="back">→ יציאה</button><span class="spacer"></span>${candyBar(kid)}</div>
    <div class="page" id="page"></div>
    <div id="controls" class="actions"></div>
    ${trackHtml(kid.color)}
  </div>`;
  $("#back").onclick = back;
  resetScene();

  function renderPage(extra = "") {
    $("#page").innerHTML = shown.map((t, i) => `<p class="sent ${i < shown.length - 1 || extra ? "old" : ""}">${esc(t)}</p>`).join("") + extra;
    const p = $("#page"); p.scrollTop = p.scrollHeight;
  }

  function next() {
    if (stepIdx >= story.steps.length) return finish();
    const st = story.steps[stepIdx++];
    if (st.text) {
      shown.push(st.text); renderPage();
      const t0 = performance.now();
      $("#controls").innerHTML = `<button class="big-btn" id="ok">קָרָאתִי ✓</button>`;
      $("#ok").onclick = () => { run.reads.push({ text: st.text, ms: Math.round(performance.now() - t0), words: st.text.split(/\s+/).length }); next(); };
    } else ask(st);
  }

  // While a question is up, the text is hidden (no scrolling back to find the answer).
  // "Read again" shows the part read since the last question, then returns to the same question.
  function ask(st) {
    const order = shuffle(st.options.length);
    const seg = shown.slice(segStart).length ? shown.slice(segStart) : shown;
    $("#page").innerHTML = `<div id="qa"><p class="q">${esc(st.question)}</p><div class="opts">${order.map(k => `<button class="opt" data-k="${k}">${esc(st.options[k])}</button>`).join("")}</div></div>
      <div id="again" hidden>${seg.map(t => `<p class="sent re">${esc(t)}</p>`).join("")}</div>`;
    $("#page").scrollTop = 0;
    const askControls = () => {
      $("#controls").innerHTML = `<button class="icon-btn" id="reread">📖 לִקְרֹא שׁוּב</button>`;
      $("#reread").onclick = () => {
        rec.rereads++;
        $("#qa").hidden = true; $("#again").hidden = false; $("#page").scrollTop = 0;
        $("#controls").innerHTML = `<button class="big-btn" id="backq">קָרָאתִי, לַשְּׁאֵלָה ✓</button>`;
        $("#backq").onclick = () => {
          $("#again").hidden = true; $("#qa").hidden = false; $("#page").scrollTop = 0;
          if (!rec.attempts) t0 = performance.now();
          askControls();
        };
      };
    };
    askControls();
    let t0 = performance.now();
    const rec = { question: st.question, attempts: 0, ms: 0, wrong: [], rereads: 0 };
    let busy = false;
    $("#page").querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (busy) return;
      busy = true;
      rec.attempts++;
      if (rec.attempts === 1) rec.ms = Math.round(performance.now() - t0);
      if (+b.dataset.k === st.answer) {
        b.classList.add("right"); beep("good"); addCandy(kid, 1, b);
        $("#page").querySelectorAll(".opt").forEach(o => o.disabled = true);
        $("#controls").innerHTML = "";
        segStart = shown.length;
        animateCorrect(() => { run.qs.push(rec); next(); });
      } else {
        b.classList.add("wrong"); b.disabled = true; beep("bad"); addCandy(kid, -1, b);
        rec.wrong.push(st.options[+b.dataset.k]);
        animateWrong(() => { busy = false; });
      }
    });
  }

  function finish() {
    const firstTry = run.qs.filter(q => q.attempts === 1).length;
    Object.assign(run, { firstTry, questions: run.qs.length });
    const preview = story.id === "preview";  // the parent trying a draft: not counted
    if (!preview) {
      (kid.runs[story.id] = kid.runs[story.id] || []).push(run);
      if (kid.runs[story.id].length > 20) kid.runs[story.id].shift();
      save();
    }
    // copy to shared storage (without the sentence texts) so the parent sees it on the phone
    if (remote.db && !preview) remote.db.collection("runs").add({ kid: kidId, storyId: story.id, title: story.title, ...run,
      reads: run.reads.map(r => ({ ms: r.ms, words: r.words })) }).catch(() => {});
    app.innerHTML = `<div class="screen"><div class="topbar"><span class="spacer"></span>${candyBar(kid)}</div>
      <div class="center"><div class="huge">${firstTry === run.qs.length ? "🏆" : "⭐"}</div>
        <h1>סִיַּמְתָּ!</h1>
        <p class="muted" style="font-size:22px">${firstTry} מתוך ${run.qs.length} שאלות נכון בפעם הראשונה</p>
        <div class="row">${nextStory ? `<button class="big-btn" id="nextStory">לפרק הבא</button>` : ""}
          <button class="icon-btn" id="list">חזרה לרשימה</button></div></div></div>`;
    nextStory && ($("#nextStory").onclick = nextStory);
    $("#list").onclick = back;
  }
  next();
}

const sec = ms => (ms / 1000).toFixed(1) + " ש׳";
function allStories(kidId) {
  const lib = library(kidId);
  return [...lib.lessons, ...lib.books].flatMap(storiesOf);
}
function kidStats(kidId) {
  const ids = new Set([...Object.keys(K(kidId).runs), ...remote.runs.filter(r => r.kid === kidId).map(r => r.storyId)]);
  const runs = [...ids].flatMap(id => runsOf(kidId, id));
  const qs = runs.flatMap(r => r.qs), reads = runs.flatMap(r => r.reads);
  const first = qs.filter(q => q.attempts === 1).length;
  const guesses = qs.filter(q => q.ms < FAST_MS || q.attempts >= 3).length;
  const words = reads.reduce((s, r) => s + r.words, 0), ms = reads.reduce((s, r) => s + r.ms, 0);
  const skims = reads.filter(r => r.ms < r.words * SKIM_MS_PER_WORD).length;
  return { ids: [...ids], qs: qs.length, first, guesses, readMs: reads.length ? ms / reads.length : 0, skims, reads: reads.length };
}

let pdfjsReady = null;
function loadPdfJs() {
  const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  return pdfjsReady = pdfjsReady || new Promise((ok, bad) => {
    const s = document.createElement("script");
    s.src = base + "pdf.min.js";
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js"; ok(window.pdfjsLib); };
    s.onerror = () => { pdfjsReady = null; bad(new Error("pdf.js")); };
    document.head.appendChild(s);
  });
}
async function pdfPages(file) {
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const out = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n), v0 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: 2000 / v0.width });
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    out.push(await new Promise(r => c.toBlob(r, "image/jpeg", .9)));
  }
  return out;
}

// Claude sees each image at about 1.2 megapixels, too small for niqqud on a whole page,
// so each page goes as overlapping horizontal strips.
async function pageStrips(blob, count) {
  const img = await createImageBitmap(blob, { imageOrientation: "from-image" });
  const w = img.width, h = img.height, ov = h * .04, out = [];
  const scale = Math.min(1, 2200 / w);
  for (let k = 0; k < count; k++) {
    const y0 = Math.max(0, k * h / count - ov), y1 = Math.min(h, (k + 1) * h / count + ov);
    const c = document.createElement("canvas");
    c.width = Math.round(w * scale); c.height = Math.round((y1 - y0) * scale);
    c.getContext("2d").drawImage(img, 0, y0, w, y1 - y0, 0, 0, c.width, c.height);
    out.push(await new Promise(r => c.toBlob(r, "image/jpeg", .9)));
  }
  img.close && img.close();
  return out;
}

const PROMPT_PAGE = (kind, n) => `The ${n} images are horizontal strips of ONE photographed page of a Hebrew ${kind === "book" ? "children's book" : "school homework sheet"}, in order from top to bottom. Neighbouring strips overlap a little: do not repeat the lines that appear in two strips.

Copy the Hebrew text of the page exactly, word for word, in reading order.
- Keep the niqqud exactly as printed. Where the printed text has no niqqud or only partial niqqud, add full correct niqqud, the way a grade 1-2 reader is printed.
- Skip page numbers, running headers and footers, and text inside illustrations.${kind === "book" ? "" : "\n- This is homework: copy only the reading passage(s) and their titles. Skip the teacher's exercises, questions, instructions and answer lines."}
- Put each paragraph on its own line. Put a chapter title or heading on its own line starting with "## ".
- If you cannot read a word for sure, write your best guess followed by [?].
Reply with only the page text, no comments. If the page has no text to read, reply with exactly: (אין טקסט)`;

const PROMPT_STEPS = (kidId, text) => `You are preparing a reading-comprehension lesson for ${K(kidId).name}, an Israeli boy in grade ${K(kidId).grade || 2} (about ${(K(kidId).grade || 2) + 5} years old). He can sound out words but often does not understand what he read. He reads one sentence at a time and answers a question every few sentences.

Below is a Hebrew text with niqqud.
1. Split it into sentences. Keep every word exactly as given, with the same niqqud. Do not rewrite, shorten, explain or add anything. Remove a [?] mark only if you are sure of the word. Drop lines starting with "## " from the sentences (they are titles).
2. After every 2 to 4 sentences add one comprehension question about what was just read. At the end add 1 or 2 questions about the whole text (main idea, a character's feelings, why something happened).
   Each question: short, natural spoken Israeli Hebrew (say "מְכוֹנִית אֲדֻמָּה", avoid stiff or translated phrasing), with full niqqud. Give exactly 1 right answer and 3 wrong answers, all with full niqqud, of similar length and plausible, so the question cannot be answered without reading the text. Mix kinds: who, what, where, why, the order of events, and the meaning of a word from context.
3. Give a short title with niqqud (use the text's own heading if it has one).

Reply with JSON only, in this shape:
{"title": "...", "steps": [{"t": "a sentence"}, {"q": "a question", "right": "...", "wrong": ["...", "...", "..."]}]}

The text:
${text}`;

function splitChapters(d) {
  const text = d.pages.filter(p => p.trim() !== "(אין טקסט)").join("\n").trim();
  const words = s => s.split(/\s+/).filter(Boolean).length;
  if (d.kind === "lesson") return [text];
  // split at headings; with no headings, cut every ~350 words at a paragraph end
  let parts = [], cur = [];
  for (const line of text.split("\n")) {
    if (line.startsWith("## ") && cur.some(l => !l.startsWith("## "))) { parts.push(cur.join("\n")); cur = []; }
    cur.push(line);
  }
  if (cur.length) parts.push(cur.join("\n"));
  if (parts.length > 1 && !parts[0].startsWith("## ") && words(parts[0]) < 30) { parts[1] = parts[0] + "\n" + parts[1]; parts.shift(); }
  const out = [];
  for (const p of parts) {
    if (words(p) <= 900 && (parts.length > 1 || words(p) <= 450)) { out.push(p); continue; }
    let chunk = [];
    for (const para of p.split("\n")) {
      chunk.push(para);
      if (words(chunk.join(" ")) >= 350) { out.push(chunk.join("\n")); chunk = []; }
    }
    if (chunk.length) words(chunk.join(" ")) < 80 && out.length ? out[out.length - 1] += "\n" + chunk.join("\n") : out.push(chunk.join("\n"));
  }
  return out.filter(p => p.trim());
}

const SAMPLE_ERR = {
  not_granted: "לא אישרת ל-Claude לעבוד מתוך האפליקציה. אפשר לאשר בפעם הבאה שתנסה.",
  rate_limited: "Claude עמוס כרגע או שנגמרה מכסת השימוש. נסה שוב עוד קצת.",
  session_expired: "צריך להתחבר שוב ל-Claude.",
  image_rejected: "אחת התמונות לא מתאימה. נסה לצלם אותה שוב.",
  refused: "Claude לא הסכים לעבד את הטקסט הזה.",
  invalid_json: "התשובה של Claude הגיעה לא שלמה. נסה שוב.",
};
const errText = e => SAMPLE_ERR[e && e.code] || "משהו נכשל בדרך. בדוק שיש אינטרנט ונסה שוב.";

async function uploadWork(d) {
  refresh = null;
  let ctl = new AbortController(), stopped = false;
  const lim = await remote.sample.limits().catch(() => null);
  const strips = Math.max(1, Math.min(3, (lim && lim.images && lim.images.maxCount) || 1));
  const totalPages = d.pages.length + pending.length;
  app.innerHTML = `<div class="screen parent">
    <div class="topbar"><h2>Claude עובד על זה...</h2></div>
    <section class="panel"><div class="bar"><i id="bar" style="width:0"></i></div><p id="now"></p><ul class="log" id="log"></ul>
      <p class="help">זה לוקח בערך חצי דקה לכל דף. אפשר להשאיר את הטלפון פתוח על המסך הזה. אם נעצר באמצע, הדפים שכבר הועתקו נשמרים בטיוטה.</p></section>
    <div class="actions"><button class="icon-btn" id="stop">עצור</button></div></div>`;
  const now = t => $("#now") && ($("#now").textContent = t);
  const log = t => $("#log") && $("#log").insertAdjacentHTML("beforeend", `<li>${esc(t)}</li>`);
  const bar = f => $("#bar") && ($("#bar").style.width = Math.round(f * 100) + "%");
  $("#stop").onclick = () => { stopped = true; ctl.abort(); };
  const fail = async (msg) => {
    await saveDraft(d);
    app.innerHTML = `<div class="screen parent"><div class="center"><p>${esc(msg)}</p>
      <p class="help">מה שכבר הועתק נשמר בטיוטה (${d.pages.length} דפים). אפשר להמשיך אותה ממסך ההורים.</p>
      <button class="big-btn" id="b">למסך ההורים</button></div></div>`;
    $("#b").onclick = parent;
  };
  try {
    // 1. copy each new page
    while (pending.length) {
      const p = pending[0], n = d.pages.length + 1;
      now(`מעתיק דף ${n} מתוך ${totalPages}...`);
      const imgs = await pageStrips(p.blob, strips);
      const { text } = await remote.sample(PROMPT_PAGE(d.kind, imgs.length), { images: imgs, signal: ctl.signal });
      d.pages.push(text.trim());
      URL.revokeObjectURL(p.url); pending.shift();
      log(`דף ${n} הועתק (${text.split(/\s+/).length} מילים)`);
      bar(.6 * d.pages.length / totalPages);
      await saveDraft(d);
    }
    // 2. split into chapters and write questions
    const parts = splitChapters(d);
    if (!parts.length) return fail("לא מצאתי טקסט בדפים האלה.");
    d.chapters = [];
    for (let i = 0; i < parts.length; i++) {
      now(parts.length > 1 ? `כותב שאלות לפרק ${i + 1} מתוך ${parts.length}...` : "כותב שאלות הבנה...");
      const out = await remote.sample.json(PROMPT_STEPS(d.kid, parts[i]), { signal: ctl.signal });
      const steps = (out.steps || []).map(s => s.q ? { question: s.q, options: [s.right, ...(s.wrong || [])].filter(Boolean), answer: 0 } : { text: s.t }).filter(s => s.text || s.options.length >= 2);
      d.chapters.push({ title: out.title || `פרק ${i + 1}`, steps });
      log(`${parts.length > 1 ? `פרק ${i + 1}` : "הטקסט"}: ${steps.filter(s => s.text).length} משפטים, ${steps.filter(s => s.question).length} שאלות`);
      bar(.6 + .4 * (i + 1) / parts.length);
      await saveDraft(d);
    }
    if (!d.title) d.title = d.kind === "book" ? (parts.length > 1 ? "ספר חדש" : d.chapters[0].title) : d.chapters[0].title;
    await saveDraft(d);
    uploadReview(d);
  } catch (e) {
    if (stopped || (e && e.code === "cancelled")) return fail("עצרת.");
    fail(errText(e));
  }
}

// The parent edits each chapter as plain lines: a sentence per line, ❓ a question, ✅ the right answer, ❌ a wrong one.
function stepsToEdit(steps) {
  return steps.map(s => s.text ? s.text : `\n❓ ${s.question}\n✅ ${s.options[s.answer]}\n${s.options.filter((_, k) => k !== s.answer).map(o => "❌ " + o).join("\n")}\n`).join("\n").replace(/\n{3,}/g, "\n\n").trim();
}
function editToSteps(text) {
  const steps = [], errors = [];
  let q = null;
  const close = () => {
    if (!q) return;
    const right = q.opts.filter(o => o.ok);
    if (right.length !== 1) errors.push(`בשאלה "${q.question}" צריכה להיות בדיוק תשובה נכונה אחת (✅).`);
    else if (q.opts.length < 2) errors.push(`בשאלה "${q.question}" צריך לפחות תשובה לא נכונה אחת (❌).`);
    else steps.push({ question: q.question, options: [right[0].t, ...q.opts.filter(o => !o.ok).map(o => o.t)], answer: 0 });
    q = null;
  };
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith("❓")) { close(); q = { question: line.slice(1).trim(), opts: [] }; }
    else if (/^(✅|❌)/.test(line)) {
      const ok = line.startsWith("✅"), t = line.replace(/^(✅|❌)️?/, "").trim();
      if (q) q.opts.push({ ok, t }); else errors.push(`התשובה "${t}" לא נמצאת מתחת לשאלה (❓).`);
    } else { close(); steps.push({ text: line }); }
  }
  close();
  if (!steps.some(s => s.text)) errors.push("אין משפטים לקריאה.");
  return { steps, errors };
}

function uploadReview(d) {
  refresh = null;
  const edits = d.chapters.map(c => ({ title: c.title, text: stepsToEdit(c.steps) }));
  const kid = K(d.kid);
  app.innerHTML = `<div class="screen parent">
    <div class="topbar"><button class="icon-btn" id="back">→ למסך ההורים</button><h2>בדיקה לפני שליחה</h2></div>
    <section class="panel">
      <p class="note">קרא ותקן אם צריך. כל שורה היא משפט שהילד יקרא. ❓ היא שאלה, ✅ התשובה הנכונה ו-❌ תשובה לא נכונה. באפליקציה התשובות מתערבבות.</p>
      <label for="ttl"><b>${d.kind === "book" ? "שם הספר" : "שם השיעור"}</b></label><input type="text" id="ttl" class="wide" value="${esc(d.title)}">
      <p class="help">${d.kind === "book" ? `📚 ספר` : "📝 שיעור"} בשביל ${esc(kid.name)}</p>
    </section>
    ${edits.map((c, i) => `<section class="panel">
      ${d.kind === "book" ? `<label for="ct-${i}"><b>פרק ${i + 1}</b></label><input type="text" id="ct-${i}" class="wide" value="${esc(c.title)}">` : ""}
      <textarea class="edit" id="tx-${i}" aria-label="הטקסט והשאלות">${esc(c.text)}</textarea>
      <div class="row"><button class="icon-btn" data-try="${i}">👀 לנסות כמו הילד</button></div>
    </section>`).join("")}
    <p id="errs" class="danger"></p>
    <div class="actions row"><button class="icon-btn" id="keep">לשמור טיוטה</button><button class="big-btn" id="send">✓ לשלוח ל${esc(kid.name)}</button></div>
  </div>`;
  const collect = () => {
    d.title = $("#ttl").value.trim() || d.title;
    const errs = [];
    d.chapters = edits.map((c, i) => {
      const { steps, errors } = editToSteps($("#tx-" + i).value);
      errors.forEach(e => errs.push((edits.length > 1 ? `פרק ${i + 1}: ` : "") + e));
      return { title: d.kind === "book" ? ($("#ct-" + i).value.trim() || `פרק ${i + 1}`) : d.title, steps };
    });
    $("#errs").innerHTML = errs.map(esc).join("<br>");
    return !errs.length;
  };
  $("#back").onclick = async () => { collect(); await saveDraft(d); parent(); };
  $("#keep").onclick = async () => { collect(); await saveDraft(d); parent(); };
  app.querySelectorAll("[data-try]").forEach(b => b.onclick = () => {
    if (!collect()) return;
    const c = d.chapters[+b.dataset.try];
    saveDraft(d).then(() => read(d.kid, { id: "preview", title: c.title, steps: c.steps }, () => uploadReview(d), null));
  });
  $("#send").onclick = async () => {
    if (!collect()) return;
    $("#send").disabled = true; $("#send").textContent = "שולח...";
    try { await publishItem(d); await remote.db.doc("drafts/" + d.id).delete().catch(() => {}); sent(d); }
    catch (e) { $("#send").disabled = false; $("#send").textContent = `✓ לשלוח ל${kid.name}`; $("#errs").textContent = e && e.code === "quota_exceeded" ? "האחסון מלא. מחק שיעורים ישנים ונסה שוב." : "השליחה נכשלה. בדוק שיש אינטרנט ונסה שוב."; }
  };
}

async function publishItem(d) {
  const old = remote.items.find(i => i.id === d.id);
  const version = (old ? old.version || 1 : 0) + 1;
  // chapters first, then the item, so the tablet never sees a half-written book
  for (let n = 0; n < d.chapters.length; n++) await remote.db.doc(`items/${d.id}/chapters/c${String(n).padStart(3, "0")}`).set({ n, steps: d.chapters[n].steps });
  if (old) for (let n = d.chapters.length; n < old.chapters.length; n++) await remote.db.doc(`items/${d.id}/chapters/c${String(n).padStart(3, "0")}`).delete();
  await remote.db.doc("items/" + d.id).set({
    kid: d.kid, kind: d.kind, title: d.title, version,
    createdAt: old ? old.createdAt : Date.now(), updatedAt: Date.now(),
    chapters: d.chapters.map(c => ({ title: c.title, sentences: c.steps.filter(s => s.text).length, questions: c.steps.filter(s => s.question).length })),
  });
}

function sent(d) {
  app.innerHTML = `<div class="screen parent"><div class="center"><div class="huge">✅</div>
    <h2>נשלח ל${esc(K(d.kid).name)}!</h2>
    <p>${d.kind === "book" ? `הספר "${esc(d.title)}" נמצא עכשיו על המדף בטאבלט.` : `השיעור "${esc(d.title)}" מופיע עכשיו ראשון ברשימת השיעורים.`}</p>
    <button class="big-btn" id="b">למסך ההורים</button></div></div>`;
  $("#b").onclick = parent;
}

async function editItem(it) {
  try {
    const snap = await remote.db.collection(`items/${it.id}/chapters`).get();
    const ch = snap.docs.map(x => x.data()).sort((a, b) => a.n - b.n);
    uploadReview({ id: it.id, kid: it.kid, kind: it.kind, title: it.title, pages: [], chapters: ch.map((c, n) => ({ title: it.chapters[n] ? it.chapters[n].title : `פרק ${n + 1}`, steps: c.steps })) });
  } catch (e) { dialog("לא הצלחתי לפתוח. בדוק שיש אינטרנט.", "אישור"); }
}

home();
startRemote();
</script>
