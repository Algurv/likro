<head>

<title>לקרוא ולהבין</title>

<style>
/* Layout: one-screen kids app on a sunny park path. Single bright look on purpose (a game world), so no dark theme.
   Top: candy bar. Middle: the page being read. Bottom: the running track with the banana. */
:root {
  color-scheme: light;
  --sky: #dff1ff;
  --grass: #7cc36b;
  --path: #e9d3a6;
  --paper: #fffdf7;
  --ink: #23324a;
  --soft: #6b7a92;
  --faded: #a9b4c5;
  --candy: #ff5c8a;
  --sun: #ffc93c;
  --good: #2e9e5b;
  --bad: #e2513c;
  --btn: #2f6fe4;
  --btn-ink: #ffffff;
  --line: #d7e3f1;
  --font-ui: "Varela Round", "Arial Rounded MT Bold", Arial, sans-serif;
  --font-read: "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
}
html, body { height: 100%; }
body { background: var(--sky); color: var(--ink); font-family: var(--font-ui); font-size: 18px; margin: 0; }
button { font-family: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--btn); outline-offset: 2px; }
.app { direction: rtl; height: 100%; display: flex; flex-direction: column; max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; box-sizing: border-box; gap: 12px; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
h1, h2 { margin: 0; font-weight: 400; text-wrap: balance; }
h1 { font-size: clamp(30px, 6vw, 44px); }
h2 { font-size: 26px; }
.muted { color: var(--soft); }
.big-btn { background: var(--btn); color: var(--btn-ink); border: 0; border-radius: 18px; padding: 14px 26px; font-size: 22px; box-shadow: 0 4px 0 #1c4fae; }
.big-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1c4fae; }
.link-btn { background: none; border: 0; color: var(--soft); font-size: 16px; text-decoration: underline; padding: 6px; }
.topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.topbar .spacer { flex: 1; }
.icon-btn { background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 8px 14px; font-size: 18px; color: var(--ink); }

/* Home */
.kids { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.kid-card { background: var(--paper); border: 3px solid var(--line); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 20px; color: var(--ink); }
.kid-card:hover { border-color: var(--btn); }
.kid-card svg { width: 110px; height: 110px; }
.kid-card .name { font-size: 30px; }

/* Candy bar */
.candy { display: flex; align-items: center; gap: 10px; background: var(--paper); border: 2px solid var(--line); border-radius: 18px; padding: 6px 12px; flex-wrap: wrap; }
.slots { display: flex; gap: 3px; direction: rtl; }
.slot { width: 24px; height: 24px; border-radius: 50%; background: #eef2f8; display: grid; place-items: center; font-size: 17px; }
.slot.on { background: #ffe3ec; }
.prizes { display: flex; gap: 8px; align-items: center; font-size: 22px; }
.prize-count { font-size: 16px; color: var(--soft); }
.goal { font-size: 14px; color: var(--soft); }
.pop { position: fixed; font-size: 30px; pointer-events: none; z-index: 20; transition: transform .9s ease-in, opacity .9s ease-in; }

/* Story list */
.stories { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; overflow-y: auto; padding-bottom: 8px; }
.story-btn { background: var(--paper); border: 3px solid var(--line); border-radius: 20px; padding: 14px; text-align: right; display: flex; flex-direction: column; gap: 6px; color: var(--ink); }
.story-btn .t { font-family: var(--font-read); font-size: 24px; font-weight: 700; }
.story-btn .s { font-size: 15px; color: var(--soft); }
.story-btn.done { border-color: var(--good); }
.story-btn:disabled { opacity: .45; cursor: not-allowed; }
.gate { background: #fff6d6; border: 2px dashed var(--sun); border-radius: 16px; padding: 10px 14px; }

/* Reading */
.page { flex: 1; min-height: 0; background: var(--paper); border: 2px solid var(--line); border-radius: 24px; padding: 18px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.sent { font-family: var(--font-read); font-size: clamp(26px, 5vw, 40px); line-height: 2; font-weight: 500; margin: 0; }
.sent.old { color: var(--faded); font-size: clamp(20px, 3.4vw, 28px); line-height: 1.9; }
.q { font-family: var(--font-read); font-size: clamp(24px, 4.4vw, 34px); line-height: 1.9; font-weight: 700; margin: 0; color: var(--btn); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .opts { grid-template-columns: 1fr; } }
.opt { font-family: var(--font-read); font-size: clamp(22px, 4vw, 30px); line-height: 1.8; background: var(--paper); border: 3px solid var(--line); border-radius: 18px; padding: 8px 14px; color: var(--ink); min-height: 64px; }
.opt:hover:not(:disabled) { border-color: var(--btn); }
.opt.wrong { border-color: var(--bad); color: var(--bad); text-decoration: line-through; opacity: .6; }
.opt.right { border-color: var(--good); background: #e4f6ea; color: var(--good); }
.actions { display: flex; justify-content: center; }

/* Track */
.track { position: relative; height: clamp(130px, min(28vh, 34vw), 240px); flex: none; border-radius: 20px; overflow: hidden; background: linear-gradient(var(--sky) 0 55%, var(--grass) 55% 100%); }
.track svg { width: 100%; height: 100%; transform: scaleX(-1); display: block; overflow: visible; }
.track .cloud { animation: drift 28s linear infinite alternate; }
.track .c2 { animation-duration: 40s; }
@keyframes drift { from { transform: translateX(-40px); } to { transform: translateX(60px); } }
.track .star { animation: twinkle .6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
@keyframes twinkle { from { transform: scale(.7) rotate(0); } to { transform: scale(1.2) rotate(30deg); } }
/* living scene: sun rays turn, trees and flowers sway, birds and a butterfly cross the sky */
.track .rays { animation: spin 24s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }
.track .sway { animation: sway 3.4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
.track .sway.s2 { animation-duration: 4.2s; animation-delay: -1.3s; }
.track .sway.s3 { animation-duration: 2.8s; animation-delay: -.6s; }
@keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
.track .flock { animation: fly 22s linear infinite; }
.track .flock.f2 { animation-duration: 31s; animation-delay: -12s; }
@keyframes fly { from { transform: translate(-120px, 0); } 50% { transform: translate(330px, -14px); } to { transform: translate(780px, 4px); } }
.track .wing { animation: flap .35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-.6); } }
.track .butterfly { animation: flutter 14s ease-in-out infinite; }
@keyframes flutter { 0% { transform: translate(0, 0); } 25% { transform: translate(-60px, -22px); } 50% { transform: translate(-110px, 6px); } 75% { transform: translate(-40px, -12px); } 100% { transform: translate(0, 0); } }
.track .bwing { animation: bflap .18s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 100% 50%; }
.track .bwing.r { transform-origin: 0% 50%; }
@keyframes bflap { from { transform: scaleX(1); } to { transform: scaleX(.25); } }
@media (prefers-reduced-motion: reduce) { .track .cloud, .track .star, .track .rays, .track .sway, .track .flock, .track .wing, .track .butterfly, .track .bwing { animation: none; } }
.bubble { position: absolute; top: 10px; right: 16px; background: var(--paper); border: 2px solid var(--ink); border-radius: 16px; padding: 2px 14px; font-size: 24px; font-family: var(--font-read); font-weight: 700; }
.bubble.good { color: var(--good); }
.bubble.bad { color: var(--bad); }

/* End of story */
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
.huge { font-size: 64px; }
/* Reading-room look (chosen design 4): wallpaper, bookshelves, window and desk behind the kid's menus. */
#roombg { position: fixed; inset: 0; z-index: 0; display: none; }
#roombg svg { width: 100%; height: 100%; display: block; }
body:has(.screen.room) #roombg { display: block; }
.app { position: relative; z-index: 1; }
.room { font-family: "Suez One", var(--font-ui); color: #3b2416; }
.room .topbar h1, .room .topbar h2 { background: #fffbe9; color: #3b2416; padding: 2px 18px; border-radius: 8px; box-shadow: 3px 4px 10px #0003; font-weight: 400; }
.room .icon-btn, .room .candy { background: #fffbe9; border: 2px solid #3b2416; border-radius: 8px; color: #3b2416; }
.room .story-btn { background: #fffbe9; border: 2px solid #3b2416; border-radius: 8px; box-shadow: 3px 5px 0 #3b241633; }
.room .link-btn { color: #3b2416; }
.note-card { margin: auto; position: relative; background: #fffbe9; background-image: repeating-linear-gradient(#fffbe9 0 33px, #bcd3f2 33px 35px); border-radius: 4px; transform: rotate(-1.2deg); box-shadow: 4px 8px 18px #0005; padding: 26px 30px 18px; width: min(560px, 100%); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.note-card::before { content: ""; position: absolute; top: -14px; left: 50%; width: 120px; height: 30px; margin-left: -60px; background: #f6d36f99; transform: rotate(3deg); }
.note-card h1 { margin: 0; font-size: 32px; font-weight: 400; } .note-card h2 { margin: 0; font-size: 22px; font-weight: 400; }
.note-card .name-in { border: 0 !important; border-bottom: 3px solid #3b2416 !important; background: transparent !important; border-radius: 0 !important; }
.note-card .grades button { background: #fff; border: 2px solid #3b2416; border-radius: 6px; min-width: 0; font-size: 19px; padding: 6px 10px; color: #3b2416; }
.note-card .name-in:focus { outline: none; border-bottom-color: #e63946 !important; }
.note-card .grades button.on { background: #e63946; color: #fff; border-color: #e63946; }
.room .big-btn { background: #e63946; color: #fff; border-radius: 10px; box-shadow: 0 5px 0 #9d1f2a; font-family: inherit; }
.room .hub { display: flex; justify-content: center; align-items: center; gap: clamp(20px, 7vw, 80px); flex-wrap: wrap; flex: 1; }
.room .hub-btn { background: none; border: 0; padding: 0; gap: 4px; font-family: inherit; color: #3b2416; }
.room .hub-btn svg { width: clamp(170px, 24vw, 250px); height: auto; aspect-ratio: 250 / 280; filter: drop-shadow(0 10px 10px #0004); transition: transform .2s; }
.room .hub-btn:hover svg, .room .hub-btn:active svg { transform: translateY(-6px) rotate(-2deg); }
.room .hub-btn .t { font-size: 30px; background: #fffbe9; padding: 0 18px; border-radius: 8px; box-shadow: 3px 4px 10px #0003; }
.room .hub-btn .s { color: #3b2416; background: #fffbe9; padding: 0 12px; border-radius: 8px; font-family: var(--font-ui); box-shadow: 3px 4px 10px #0003; }
@media (max-aspect-ratio: 4/5) { .room .hub { flex-direction: column; gap: 18px; } .room .hub-btn svg { width: auto !important; height: clamp(170px, 30vh, 260px) !important; } }


/* Parent */
.parent { overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-bottom: 20px; }
.panel { background: var(--paper); border: 2px solid var(--line); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.stat b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 14px; color: var(--soft); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; min-width: 560px; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { display: inline-block; border-radius: 99px; padding: 0 8px; font-size: 13px; border: 1px solid currentColor; }
.tag.good { color: var(--good); } .tag.bad { color: var(--bad); } .tag.warn { color: #b7791f; }
input[type=text], input[type=number] { font-family: inherit; font-size: 20px; padding: 6px 10px; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); width: 140px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.danger { color: var(--bad); }
@media (prefers-reduced-motion: reduce) { .pop { transition: none; } }

/* Kid hub: lessons or books */
.hub { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
.hub-btn { background: var(--paper); border: 3px solid var(--line); border-radius: 26px; padding: 26px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--ink); font-size: 30px; }
.hub-btn:hover { border-color: var(--btn); }
.hub-btn .e { font-size: 72px; line-height: 1; }
.hub-btn .s { font-size: 17px; color: var(--soft); }
.badge { display: inline-block; background: var(--candy); color: #fff; border-radius: 99px; padding: 0 10px; font-size: 15px; }
.book-btn .t { font-size: 26px; }

/* Parent upload */
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { background: var(--paper); border: 3px solid var(--line); border-radius: 14px; padding: 8px 16px; font-size: 20px; color: var(--ink); }
.seg button.on { border-color: var(--btn); background: #e8f0ff; }
.file-btn { position: relative; overflow: hidden; display: inline-block; }
.file-btn input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 200px; }
.pastebox { margin-top: 10px; padding: 14px; border: 2px dashed var(--line); border-radius: 12px; color: var(--soft); text-align: center; min-height: 48px; outline: none; }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumb { width: 84px; position: relative; font-size: 13px; color: var(--soft); text-align: center; }
.thumb img { width: 84px; height: 110px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; }
.thumb button { position: absolute; top: 2px; left: 2px; border: 0; border-radius: 99px; background: rgba(0,0,0,.6); color: #fff; width: 26px; height: 26px; font-size: 14px; }
.bar { height: 14px; background: #eef2f8; border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--btn); transition: width .3s; }
.log { font-size: 15px; color: var(--soft); margin: 0; padding-inline-start: 18px; }
textarea.edit { width: 100%; box-sizing: border-box; min-height: 340px; font-family: var(--font-read); font-size: 20px; line-height: 1.8; direction: rtl; padding: 10px; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); }
input.wide { width: 100%; box-sizing: border-box; }
.help { font-size: 15px; color: var(--soft); margin: 0; }
.items { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.item .t { font-family: var(--font-read); font-weight: 700; font-size: 18px; }
.item .spacer { flex: 1; }
.sent.re { font-size: clamp(22px, 3.8vw, 30px); line-height: 1.9; }
.name-in { width: min(420px, 100%) !important; font-size: 34px !important; text-align: center; padding: 10px !important; font-family: var(--font-read) !important; }
.grades { justify-content: center; }
.grades button { font-family: var(--font-read); font-size: 22px; min-width: 96px; }
.note { background: #fff6d6; border: 2px solid var(--sun); border-radius: 14px; padding: 8px 12px; font-size: 16px; }
.modal { position: fixed; inset: 0; background: rgba(20,30,50,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal .box { background: var(--paper); border-radius: 18px; padding: 18px; max-width: 420px; font-size: 20px; display: flex; flex-direction: column; gap: 12px; }
</style>

<div class="app" id="app" dir="rtl" lang="he"></div>
