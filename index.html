xt": "הֵם גַּם לֹא יָדְעוּ עַל כָּל הִשְׁתַּלְשְׁלוּת הַתּוֹרָה בְּאַלְפֵי הַשָּׁנִים הַלָּלוּ."}, {"text": "הֵם לֹא הִכִּירוּ אֶת חֲנֻכָּה וּפוּרִים."}, {"text": "כָּל מָה שֶׁהָיָה שָׁמוּר בִּידֵיהֶם, הֵם כִּתְבֵי הַקֹּדֶשׁ שֶׁל הַתּוֹרָה וְהַנְּבִיאִים, וּמִנְהָגִים מְאוֹד קְדוּמִים."}, {"question": "לָמָּה הֵם לֹא הִכִּירוּ אֶת הַהִיסְטוֹרְיָה הַיְּהוּדִית?", "options": ["כִּי הֵם הָיוּ מְנֻתָּקִים מִשְּׁאָר הַיְּהוּדִים", "כִּי לֹא הָיוּ לָהֶם סְפָרִים", "כִּי הֵם לֹא רָצוּ לִלְמֹד", "כִּי הֵם שָׁכְחוּ אֶת הַתּוֹרָה"], "answer": 0}, {"question": "אֵיזֶה חַג יְהוּדֵי אֶתְיוֹפְּיָה לֹא הִכִּירוּ?", "options": ["חֲנֻכָּה", "יוֹם הַכִּפּוּרִים", "חַג הַסִּיגְד", "שַׁבָּת"], "answer": 0}, {"text": "כְּדֵי לִשְׁמֹר עַל זֶהוּתָם, הֵם קָרְאוּ לְעַצְמָם בְּשֵׁם: \"בֵּיתָא יִשְׂרָאֵל\" (=בֵּית יִשְׂרָאֵל)."}, {"text": "הֵם הִתְמִידוּ לִלְמֹד אֶת הַתּוֹרָה שֶׁכָּלְלָה אֶת חֲמֵשֶׁת חֻמְשֵׁי תּוֹרָה וְאֶת הַנְּבִיאִים בִּלְבַד."}, {"question": "אֵיךְ קָרְאוּ יְהוּדֵי אֶתְיוֹפְּיָה לְעַצְמָם?", "options": ["בֵּיתָא יִשְׂרָאֵל", "שֵׁבֶט יְהוּדָה", "בְּנֵי אַפְרִיקָה", "מַלְכוּת דָּן"], "answer": 0}, {"text": "בְּכָל שָׁנָה בְּכ\"ט בְּחֹדֶשׁ חֶשְׁוָן (בַּיּוֹם הַחֲמִשִּׁים לְאַחַר יוֹם הַכִּפּוּרִים) מְצַיְּנִים יְהוּדֵי אֶתְיוֹפְּיָה אֶת 'חַג הַסִּיגְד'."}, {"text": "מַשְׁמָעוּת הַשֵּׁם – סִיגְד, מִלְּשׁוֹן סְגִידָה, הִשְׁתַּחֲוָיָה."}, {"question": "מָתַי חוֹגְגִים אֶת חַג הַסִּיגְד?", "options": ["חֲמִשִּׁים יוֹם אַחֲרֵי יוֹם הַכִּפּוּרִים", "בַּחֲנֻכָּה", "בְּיוֹם הָעַצְמָאוּת", "שָׁבוּעַ אַחֲרֵי פֶּסַח"], "answer": 0}, {"question": "מָה פֵּרוּשׁ הַמִּלָּה \"סִיגְד\"?", "options": ["הִשְׁתַּחֲוָיָה", "שִׂמְחָה", "צוֹם", "טִיּוּל"], "answer": 0}, {"text": "בְּמֶשֶׁךְ אַלְפֵי שָׁנִים חָלְמוּ יְהוּדֵי אֶתְיוֹפְּיָה לְהַגִּיעַ לְאֶרֶץ יִשְׂרָאֵל וְלִירוּשָׁלַיִם,"}, {"text": "אֶת גַּעְגּוּעֵיהֶם הֵם בִּטְּאוּ בְּ'חַג הַסִּיגְד' וְצִיְּנוּ זֹאת בְּצוֹם, בִּתְפִלָּה וּבְתַחֲנוּנִים."}, {"question": "עַל מָה חָלְמוּ יְהוּדֵי אֶתְיוֹפְּיָה?", "options": ["לְהַגִּיעַ לִירוּשָׁלַיִם", "לִבְנוֹת עִיר חֲדָשָׁה בְּאַפְרִיקָה", "לִהְיוֹת עֲשִׁירִים", "לִלְמֹד עַל פּוּרִים"], "answer": 0}, {"text": "בְּיוֹם הַסִּיגְד הָיוּ עוֹלִים בְּנֵי הַכְּפָרִים עַל הַר גָּבוֹהַּ,"}, {"text": "כְּדֵי לְהַמְחִישׁ אֶת מַעֲמַד מַתַּן תּוֹרָה בְּהַר סִינַי, וְגַם שֶׁמָּקוֹם גָּבוֹהַּ נֶחְשָׁב לְמָקוֹם טָהוֹר יוֹתֵר כְּשֶׁהָ'אוֹרִית' (הַתּוֹרָה) בִּידֵיהֶם."}, {"question": "לָמָּה עָלוּ בְּנֵי הַכְּפָרִים עַל הַר גָּבוֹהַּ?", "options": ["כְּדֵי לְהִזָּכֵר בְּמַתַּן תּוֹרָה בְּהַר סִינַי", "כְּדֵי לִרְאוֹת אֶת הַיָּם", "כְּדֵי לִבְרֹחַ מֵאוֹיְבִים", "כְּדֵי לִמְצֹא מַיִם"], "answer": 0}, {"question": "מָה זֹאת \"אוֹרִית\"?", "options": ["הַתּוֹרָה", "הַר גָּבוֹהַּ", "כֹּהֵן", "תְּפִלָּה"], "answer": 0}, {"text": "עַל פִּסְגַּת הָהָר הָיוּ הַקֶּיְסִים (הַכֹּהֲנִים) קוֹרְאִים בַּתּוֹרָה, מִתְפַּלְּלִים וּמְבַקְּשִׁים לַחֲזֹר לִירוּשָׁלַיִם."}, {"text": "לְאַחַר הַתְּפִלָּה הָיוּ הַקֶּיְסִים מְבָרְכִים אֶת הָאֲנָשִׁים וּמְבַקְּשִׁים מֵהֶם לִשְׁמֹר אֶת מִצְווֹת הַתּוֹרָה."}, {"text": "אֶת הַטֶּקֶס הָיוּ מְסַיְּמִים בִּתְקִיעָה בַּחֲצוֹצְרוֹת וּבִסְעוּדָה גְּדוֹלָה."}, {"question": "מִי הֵם הַקֶּיְסִים?", "options": ["הַכֹּהֲנִים", "הַיְּלָדִים", "הַמְּלָכִים", "הַחַיָּלִים"], "answer": 0}, {"question": "אֵיךְ הִסְתַּיֵּם הַטֶּקֶס?", "options": ["בַּחֲצוֹצְרוֹת וּבִסְעוּדָה גְּדוֹלָה", "בְּשֵׁנָה אֲרֻכָּה", "בְּמִשְׂחַק כַּדּוּר", "בְּשֶׁקֶט גָּמוּר"], "answer": 0}, {"text": "בָּאָרֶץ יְהוּדֵי אֶתְיוֹפְּיָה מְצַיְּנִים אֶת חַג הַסִּיגְד בְּצוֹם, בִּלְבִישַׁת בִּגְדֵי לָבָן וּבִתְפִלּוֹת,"}, {"text": "בַּטַּיֶּלֶת בִּשְׁכוּנַת אַרְמוֹן הַנְּצִיב בִּירוּשָׁלַיִם, שֶׁמִּמֶּנָּה נִתָּן לְהַשְׁקִיף עַל יְרוּשָׁלַיִם כֻּלָּהּ."}, {"text": "מִי שֶׁלֹּא רָאָה סִיגְד מִיָּמָיו, יָבוֹא וִיחַוֶּה שִׂמְחָה מְיֻחֶדֶת בִּירוּשָׁלַיִם."}, {"question": "אֵיפֹה חוֹגְגִים הַיּוֹם אֶת הַסִּיגְד בָּאָרֶץ?", "options": ["בַּטַּיֶּלֶת בִּירוּשָׁלַיִם", "עַל חוֹף הַיָּם בְּתֵל אָבִיב", "בְּהַר סִינַי", "בְּבֵית הַסֵּפֶר"], "answer": 0}, {"question": "אֵיזֶה צֶבַע בְּגָדִים לוֹבְשִׁים בַּחַג?", "options": ["לָבָן", "שָׁחֹר", "אָדֹם", "כָּחֹל"], "answer": 0}, {"question": "מָה הָרַעְיוֹן הָעִקָּרִי שֶׁל הַקֶּטַע?", "options": ["יְהוּדֵי אֶתְיוֹפְּיָה שָׁמְרוּ עַל הַתּוֹרָה וְהִתְגַּעְגְּעוּ לִירוּשָׁלַיִם", "יְהוּדֵי אֶתְיוֹפְּיָה שָׁכְחוּ אֶת הַתּוֹרָה", "חַג הַסִּיגְד הוּא חַג שֶׁל מַתָּנוֹת", "בְּאֶתְיוֹפְּיָה יֵשׁ הָרִים גְּבוֹהִים"], "answer": 0}]}, {"id": "hw-1", "title": "כָּל אֶחָד יָחִיד וּמְיֻחָד", "theme": "שיעורי בית", "start": true, "steps": [{"text": "מִדֵּי יוֹם וּבְמַהֲלַךְ כָּל יְמוֹת הַשָּׁבוּעַ אַתֶּם פּוֹגְשִׁים אֶת חַבְרֵיכֶם לַכִּתָּה."}, {"text": "מָה מְשֻׁתָּף לְכֻלְּכֶם?"}, {"text": "כַּנִּרְאֶה אַתֶּם כִּמְעַט בְּאוֹתוֹ גִּיל – וְנוֹלַדְתֶּם בְּאוֹתָהּ שָׁנָה."}, {"question": "מָה מְשֻׁתָּף לְרֹב הַיְּלָדִים בַּכִּתָּה?", "options": ["הֵם כִּמְעַט בְּאוֹתוֹ גִּיל", "יֵשׁ לָהֶם אוֹתוֹ שֵׁם", "כֻּלָּם גְּבוֹהִים", "כֻּלָּם גָּרִים בְּאוֹתוֹ בַּיִת"], "answer": 0}, {"text": "אַתֶּם לוֹמְדִים בְּאוֹתָהּ כִּתָּה, יֵשׁ לָכֶם אוֹתָם מוֹרִים וְאוֹתָהּ מַעֲרֶכֶת שָׁעוֹת."}, {"text": "אַתֶּם חַיִּים בְּאוֹתוֹ יִשּׁוּב וּמַגִּיעִים לְבֵית הַסֵּפֶר בְּאוֹתָהּ שָׁעָה."}, {"question": "מָה עוֹד מְשֻׁתָּף לַיְּלָדִים בַּכִּתָּה?", "options": ["אוֹתָם מוֹרִים וְאוֹתָהּ מַעֲרֶכֶת שָׁעוֹת", "אוֹתוֹ צֶבַע שֵׂעָר", "אוֹתוֹ אֹכֶל אָהוּב", "אוֹתָם אַחִים"], "answer": 0}, {"text": "אַךְ בְּכִתַּתְכֶם יֵשׁ בָּנִים וְיֵשׁ בָּנוֹת, יֵשׁ גְּבוֹהִים וְיֵשׁ נְמוּכִים, יֵשׁ שְׁמֵנִים וְיֵשׁ רָזִים."}, {"text": "אֶפְשָׁר לִרְאוֹת אִם יֶלֶד הוּא רָזֶה אוֹ שָׁמֵן, גָּבוֹהַּ אוֹ נָמוּךְ, מְמֻשְׁקָף אוֹ בַּעַל נְמָשִׁים – כְּבָר מִמַּבָּט רִאשׁוֹן."}, {"question": "מָה אֶפְשָׁר לִרְאוֹת כְּבָר מִמַּבָּט רִאשׁוֹן?", "options": ["אִם יֶלֶד גָּבוֹהַּ אוֹ נָמוּךְ", "אִם יֶלֶד אַמִּיץ", "אִם יֶלֶד נָדִיב", "אִם יֶלֶד מָהִיר"], "answer": 0}, {"text": "אֲבָל כְּדֵי לָדַעַת אִם הַיֶּלֶד הוּא מָהִיר אוֹ אִטִּי, נָדִיב אוֹ קַמְצָן, אַמִּיץ אוֹ פַּחְדָן, צָרִיךְ לְהַכִּיר אוֹתוֹ וּלְבַלּוֹת אִתּוֹ זְמַן מָה בְּמַצָּבִים שׁוֹנִים."}, {"question": "מָה צָרִיךְ כְּדֵי לָדַעַת אִם יֶלֶד נָדִיב אוֹ קַמְצָן?", "options": ["לְהַכִּיר אוֹתוֹ וּלְבַלּוֹת אִתּוֹ זְמַן", "לְהִסְתַּכֵּל עָלָיו פַּעַם אַחַת", "לִשְׁאֹל אֶת הַמּוֹרָה", "לִמְדֹּד אֶת הַגֹּבַהּ שֶׁלּוֹ"], "answer": 0}, {"question": "מָה הַהֵפֶךְ שֶׁל אַמִּיץ?", "options": ["פַּחְדָן", "נָדִיב", "מָהִיר", "רָזֶה"], "answer": 0}, {"text": "כָּל אֶחָד מִכֶּם דּוֹמֶה לַחֲבֵרִים בַּכִּתָּה בִּדְבָרִים מְסֻיָּמִים, אַךְ שׁוֹנֶה מֵהֶם בִּדְבָרִים אֲחֵרִים."}, {"text": "לְכָל אֶחָד יֵשׁ דְּבָרִים שֶׁהוּא אוֹהֵב בִּמְיֻחָד, דְּבָרִים שֶׁהוּא רוֹצֶה אוֹ לֹא רוֹצֶה לַעֲשׂוֹת;"}, {"text": "וּלְכָל אֶחָד יֵשׁ דְּבָרִים שֶׁעֲלֵיהֶם הוּא לֹא מוּכָן לְוַתֵּר, וְאוּלַי אֲפִלּוּ יֵשׁ דְּבָרִים שֶׁהָיָה מוּכָן לְוַתֵּר עֲלֵיהֶם."}, {"question": "מָה פֵּרוּשׁ \"לְוַתֵּר\"?", "options": ["לְהַסְכִּים לְהִשָּׁאֵר בְּלִי מַשֶּׁהוּ", "לְנַצֵּחַ", "לִכְעֹס", "לְהַבְטִיחַ"], "answer": 0}, {"question": "מָה הָרַעְיוֹן הָעִקָּרִי שֶׁל הַקֶּטַע?", "options": ["כָּל יֶלֶד דּוֹמֶה לַאֲחֵרִים וְגַם שׁוֹנֶה מֵהֶם", "כָּל הַיְּלָדִים בְּדִיּוּק אוֹתוֹ דָּבָר", "צָרִיךְ לְהַגִּיעַ בַּזְּמַן", "אָסוּר לְוַתֵּר אַף פַּעַם"], "answer": 0}]}, {"id": "tuki-1", "title": "טוֹם קָנָה תּוּכִּי 1: חֲלוֹם עִם נוֹצוֹת", "theme": "סיפור: טום קנה תוכי, פרק 1 מתוך 8", "start": true, "steps": [{"text": "טוֹם בֶּן שְׁמוֹנֶה. יֵשׁ לוֹ אוֹפַנַּיִם כְּחֻלִּים, כַּדּוּר שֶׁל כַּדּוּרֶגֶל, קֻפָּה עִם כֶּסֶף מִיּוֹם הַהֻלֶּדֶת, וְהַרְבֵּה חֲבֵרִים. יֵשׁ לוֹ גַּם אַבָּא, אִמָּא וְאָח קָטָן בֶּן שֵׁשׁ שֶׁקּוֹרְאִים לוֹ דִּין."}, {"text": "אֲבָל דָּבָר אֶחָד חָסֵר לְטוֹם: חַיַּת מַחְמָד."}, {"question": "מָה חָסֵר לְטוֹם?", "options": ["חַיַּת מַחְמָד", "אוֹפַנַּיִם", "חֲבֵרִים", "כַּדּוּר"], "answer": 0}, {"text": "לְיוֹאָב, הֶחָבֵר הֲכִי טוֹב שֶׁלּוֹ, יֵשׁ כֶּלֶב. לְנוֹעָה מֵהַכִּתָּה יֵשׁ שְׁנֵי חֲתוּלִים. אֲפִילוּ לַשָּׁכֵן מִלְּמַטָּה יֵשׁ דַּג זָהָב בְּאַקְוַרְיוּם."}, {"question": "לְמִי יֵשׁ כֶּלֶב?", "options": ["לְיוֹאָב", "לְנוֹעָה", "לַשָּׁכֵן", "לְדִין"], "answer": 0}, {"text": "\"רַק לָנוּ אֵין כְּלוּם,\" אָמַר טוֹם בַּאֲרוּחַת הָעֶרֶב."}, {"text": "\"יֵשׁ לָנוּ אֶת דִּין,\" צָחַק אַבָּא. \"הוּא עוֹשֶׂה רַעַשׁ כְּמוֹ גּוּר שֶׁל אַרְיֵה.\""}, {"text": "\"גְּרְרְרְר!\" נָהַם דִּין, וְכֻלָּם צָחֲקוּ."}, {"text": "אֲבָל טוֹם לֹא וִתֵּר. \"אֲנִי רוֹצֶה תּוּכִּי,\" הוּא אָמַר. \"תּוּכִּי יָרֹק שֶׁיּוֹדֵעַ לְדַבֵּר.\""}, {"question": "אֵיזוֹ חַיָּה טוֹם רוֹצֶה?", "options": ["תּוּכִּי יָרֹק", "כֶּלֶב", "אוֹגֵר", "חָתוּל"], "answer": 0}, {"text": "\"תּוּכִּי?\" שָׁאֲלָה אִמָּא. \"תּוּכִּי צָרִיךְ אֹכֶל, מַיִם וּכְלוּב נָקִי. צָרִיךְ לְדַבֵּר אִתּוֹ כָּל יוֹם. זֶה הַרְבֵּה עֲבוֹדָה.\""}, {"text": "\"אֲנִי יָכוֹל!\" אָמַר טוֹם. \"אֲנִי מַבְטִיחַ לִדְאֹג לוֹ כָּל יוֹם.\""}, {"text": "אַבָּא וְאִמָּא הִסְתַּכְּלוּ זֶה עַל זֶה. \"הַשָּׁכֵן מִלְּמַטָּה יוֹצֵא לְחֻפְשָׁה שֶׁל שְׁבוּעַיִם,\" אָמַר אַבָּא. \"אִם תַּאֲכִיל אֶת דַּג הַזָּהָב שֶׁלּוֹ כָּל יוֹם, בְּלִי שֶׁנַּזְכִּיר לְךָ, נְדַבֵּר עַל תּוּכִּי.\""}, {"question": "מָה טוֹם צָרִיךְ לַעֲשׂוֹת כְּדֵי לְקַבֵּל תּוּכִּי?", "options": ["לְהַאֲכִיל אֶת הַדָּג שֶׁל הַשָּׁכֵן", "לְנַקּוֹת אֶת הַחֶדֶר", "לְקַבֵּל צִיּוּן טוֹב", "לִשְׁמֹר עַל דִּין"], "answer": 0}, {"text": "\"עִסְקָה!\" צָעַק טוֹם."}, {"text": "בְּבֵית הַסֵּפֶר סִפֵּר טוֹם לְיוֹאָב וּלְנוֹעָה עַל הַנִּסָּיוֹן. \"שְׁבוּעַיִם שְׁלֵמִים?\" שָׁאַל יוֹאָב. \"אֲנִי שׁוֹכֵחַ לְצַחְצֵחַ שִׁנַּיִם כְּבָר אַחֲרֵי יוֹמַיִם.\""}, {"text": "\"אַתָּה תַּצְלִיחַ,\" אָמְרָה נוֹעָה. \"תִּכְתֹּב פֶּתֶק וְתַדְבִּיק אוֹתוֹ עַל הַדֶּלֶת שֶׁל הַחֶדֶר.\""}, {"text": "טוֹם כָּתַב פֶּתֶק גָּדוֹל בְּטוּשׁ אָדֹם: \"לֹא לִשְׁכֹּחַ אֶת הַדָּג!\" וְהִדְבִּיק אוֹתוֹ עַל הַדֶּלֶת. דִּין צִיֵּר לְיַד הַמִּלִּים דָּג עִם כֶּתֶר."}, {"text": "טוֹם גַּם הֵבִיא מֵהַסִּפְרִיָּה סֵפֶר עַל תּוּכִּים. הוּא לָמַד שֶׁתּוּכִּים חַיִּים הַרְבֵּה שָׁנִים, שֶׁהֵם אוֹהֲבִים פֵּרוֹת, וְשֶׁהֵם צְרִיכִים חֲבֵרִים. \"אֲנִי אֶהְיֶה הֶחָבֵר שֶׁלּוֹ,\" הוּא הֶחְלִיט."}, {"text": "כָּל בֹּקֶר, לִפְנֵי בֵּית הַסֵּפֶר, טוֹם יָרַד בַּמַּדְרֵגוֹת עִם הַמַּפְתֵּחַ שֶׁל הַשָּׁכֵן. הוּא פִּזֵּר קְצָת אֹכֶל בָּאַקְוַרְיוּם וְאָמַר: \"בֹּקֶר טוֹב, דָּגִי!\""}, {"text": "הַדָּג לֹא עָנָה. דָּגִים לֹא מְדַבְּרִים. \"בִּגְלַל זֶה אֲנִי רוֹצֶה תּוּכִּי,\" הִסְבִּיר טוֹם לְדִין."}, {"text": "יוֹם אֶחָד יָרַד גֶּשֶׁם חָזָק, וְטוֹם הָיָה עָיֵף מְאֹד. הוּא כִּמְעַט שָׁכַח. אֲבָל בָּרֶגַע הָאַחֲרוֹן הוּא נִזְכַּר, רָץ לְמַטָּה בַּפִּיגָ'מָה, וְהֶאֱכִיל אֶת הַדָּג."}, {"question": "מָה קָרָה בַּיּוֹם שֶׁל הַגֶּשֶׁם?", "options": ["טוֹם כִּמְעַט שָׁכַח, אֲבָל נִזְכַּר", "טוֹם לֹא הֶאֱכִיל אֶת הַדָּג", "דִּין הֶאֱכִיל אֶת הַדָּג", "הַדָּג בָּרַח"], "answer": 0}, {"text": "אַחֲרֵי שְׁבוּעַיִם חָזַר הַשָּׁכֵן. הַדָּג הָיָה שָׂמֵחַ וּשְׁמַנְמַן."}, {"text": "בָּעֶרֶב אָמַר אַבָּא: \"טוֹם, עָמַדְתָּ בַּמִּבְחָן. בְּיוֹם שִׁשִּׁי נוֹסְעִים לַחֲנוּת הַחַיּוֹת.\""}, {"text": "טוֹם קָפַץ עַל הַסַּפָּה וְצָעַק \"יֵשׁ!\" כָּל כָּךְ חָזָק, שֶׁהַשָּׁכֵן מִלְּמַטָּה דָּפַק עִם מַטְאֲטֵא עַל הַתִּקְרָה."}, {"question": "לָמָּה הַשָּׁכֵן דָּפַק עַל הַתִּקְרָה?", "options": ["כִּי טוֹם צָעַק חָזָק מְאֹד", "כִּי הַדָּג רָעֵב", "כִּי יָרַד גֶּשֶׁם", "כִּי הוּא רָצָה לְבַקֵּר"], "answer": 0}]}, {"id": "tuki-2", "title": "טוֹם קָנָה תּוּכִּי 2: בַּחֲנוּת הַחַיּוֹת", "theme": "סיפור: טום קנה תוכי, פרק 2 מתוך 8", "steps": [{"text": "בְּיוֹם שִׁשִּׁי בַּבֹּקֶר טוֹם הִתְעוֹרֵר לִפְנֵי כֻּלָּם. הוּא פָּתַח אֶת הַקֻּפָּה שֶׁלּוֹ וְסָפַר אֶת הַכֶּסֶף: מֵאָה וְעֶשְׂרִים שְׁקָלִים."}, {"question": "כַּמָּה כֶּסֶף הָיָה בַּקֻּפָּה שֶׁל טוֹם?", "options": ["מֵאָה וְעֶשְׂרִים שְׁקָלִים", "עֶשֶׂר שְׁקָלִים", "חֲמִשִּׁים שְׁקָלִים", "אֶלֶף שְׁקָלִים"], "answer": 0}, {"text": "\"זֶה מַסְפִּיק לְתוּכִּי?\" שָׁאַל."}, {"text": "\"זֶה מַסְפִּיק לְחֵלֶק מֵהַתּוּכִּי,\" אָמְרָה אִמָּא. \"אֶת הַשְּׁאָר נוֹסִיף אֲנַחְנוּ.\""}, {"text": "כָּל הַמִּשְׁפָּחָה נָסְעָה לַחֲנוּת. דִּין יָשַׁב בַּמּוֹשָׁב הָאֲחוֹרִי וְשָׁאַל כָּל דַּקָּה: \"הִגַּעְנוּ? הִגַּעְנוּ?\""}, {"text": "בַּחֲנוּת הָיָה רַעַשׁ גָּדוֹל. כְּלָבִים נָבְחוּ, אוֹגְרִים רָצוּ בְּתוֹךְ גַּלְגַּלִּים, וְצִפּוֹרִים צִיְּצוּ מִכָּל הַצְּדָדִים."}, {"text": "\"אֲנִי רוֹצֶה אוֹגֵר!\" צָעַק דִּין. \"אוֹגֵר קָטָן וְחוּם!\""}, {"text": "\"הַיּוֹם קוֹנִים תּוּכִּי לְטוֹם,\" אָמַר אַבָּא. \"כְּשֶׁתִּהְיֶה בֶּן שְׁמוֹנֶה, נְדַבֵּר.\""}, {"text": "דִּין עָשָׂה פַּרְצוּף עָצוּב, אֲבָל אָז הוּא רָאָה דָּג כָּתֹם עִם פַּסִּים, וְשָׁכַח מֵהָאוֹגֵר."}, {"question": "אֵיזוֹ חַיָּה דִּין רָצָה?", "options": ["אוֹגֵר", "תּוּכִּי", "כֶּלֶב", "דָּג"], "answer": 0}, {"text": "בַּפִּנָּה, בִּכְלוּב גָּדוֹל, יָשְׁבוּ חֲמִשָּׁה תּוּכִּים. הָיָה אֶחָד כָּחֹל, אֶחָד צָהֹב וּשְׁנַיִם לְבָנִים. וְהָיָה אֶחָד יָרֹק, עִם כֶּתֶם צָהֹב עַל הָרֹאשׁ, כְּמוֹ כּוֹבַע קָטָן."}, {"question": "אֵיךְ נִרְאָה הַתּוּכִּי שֶׁטּוֹם בָּחַר?", "options": ["יָרֹק, עִם כֶּתֶם צָהֹב עַל הָרֹאשׁ", "כָּחֹל כֻּלּוֹ", "לָבָן עִם כּוֹבַע", "צָהֹב עִם זָנָב אָדֹם"], "answer": 0}, {"text": "פִּתְאֹם אֶחָד הַתּוּכִּים הַלְּבָנִים צָעַק: \"שָׁלוֹם, מֹתֶק!\""}, {"text": "דִּין נִבְהַל וְהִתְחַבֵּא מֵאֲחוֹרֵי אַבָּא. \"הוּא מְדַבֵּר! הַתּוּכִּי מְדַבֵּר!\""}, {"text": "\"זֶה שׁוֹקוֹ,\" צָחַק הַמּוֹכֵר. \"הוּא גָּר פֹּה כְּבָר עֶשֶׂר שָׁנִים, וְהוּא אוֹמֵר 'שָׁלוֹם, מֹתֶק' לְכָל מִי שֶׁנִּכְנָס. גַּם לַדַּוָּר.\""}, {"text": "הַתּוּכִּי הַיָּרֹק הִתְקָרֵב לְטוֹם. הוּא הִטָּה אֶת הָרֹאשׁ לַצַּד וְהִסְתַּכֵּל עָלָיו בְּעַיִן אַחַת."}, {"text": "\"הוּא בּוֹחֵן אוֹתְךָ,\" אָמַר הַמּוֹכֵר וְחִיֵּךְ. \"נִרְאֶה שֶׁהוּא אוֹהֵב אוֹתְךָ.\""}, {"text": "\"זֶה הוּא,\" לָחַשׁ טוֹם. \"אֲנִי רוֹצֶה אֶת הַיָּרֹק.\""}, {"text": "הַמּוֹכֵר הִסְבִּיר לְטוֹם אֵיךְ לְטַפֵּל בַּתּוּכִּי. \"כָּל יוֹם מַחְלִיפִים מַיִם וּזְרָעִים. פַּעַם בְּשָׁבוּעַ מְנַקִּים אֶת הַכְּלוּב. וְהֲכִי חָשׁוּב: מְדַבְּרִים אִתּוֹ הַרְבֵּה. כָּכָה הוּא לוֹמֵד מִלִּים.\""}, {"question": "מָה הֲכִי חָשׁוּב, לְפִי הַמּוֹכֵר?", "options": ["לְדַבֵּר עִם הַתּוּכִּי הַרְבֵּה", "לָתֵת לוֹ הַרְבֵּה אֹכֶל", "לִשְׁמֹר עָלָיו בַּשֶּׁמֶשׁ", "לְשַׂחֵק אִתּוֹ בְּכַדּוּר"], "answer": 0}, {"text": "\"הוּא בֶּאֱמֶת יְדַבֵּר?\" שָׁאַל טוֹם."}, {"text": "\"אוּלַי,\" אָמַר הַמּוֹכֵר. \"תּוּכִּים לוֹמְדִים לְאַט. וְלִפְעָמִים הֵם לוֹמְדִים דַּוְקָא אֶת הַמִּלִּים שֶׁלֹּא רָצִיתָ.\""}, {"text": "טוֹם שִׁלֵּם בַּקֻּפָּה עִם הַכֶּסֶף שֶׁלּוֹ, וְאַבָּא הוֹסִיף אֶת הַשְּׁאָר. הֵם קָנוּ גַּם כְּלוּב, שַׂק זְרָעִים, וּמַרְאָה קְטַנָּה עִם פַּעֲמוֹן."}, {"question": "מִי שִׁלֵּם עַל הַתּוּכִּי?", "options": ["טוֹם, וְאַבָּא הוֹסִיף", "רַק אִמָּא", "רַק דִּין", "הַמּוֹכֵר נָתַן בְּחִנָּם"], "answer": 0}, {"text": "בַּמְּכוֹנִית שָׁאֲלָה אִמָּא: \"אֵיךְ תִּקְרָא לוֹ?\""}, {"text": "\"פִּיצָה!\" הִצִּיעַ דִּין. \"בַּנָּנָה! מְכוֹנִית!\""}, {"text": "\"מְכוֹנִית זֶה לֹא שֵׁם לְתוּכִּי,\" אָמַר טוֹם."}, {"text": "טוֹם חָשַׁב וְחָשַׁב. \"הוּא יָרֹק... כְּמוֹ קִיוִי! קוֹרְאִים לוֹ קִיוִי.\""}, {"question": "לָמָּה טוֹם קָרָא לַתּוּכִּי קִיוִי?", "options": ["כִּי הוּא יָרֹק כְּמוֹ קִיוִי", "כִּי הוּא שָׂעִיר", "כִּי הוּא אוֹהֵב לֶאֱכֹל קִיוִי", "כִּי כָּכָה קָרָא הַמּוֹכֵר"], "answer": 0}, {"text": "\"קִיוִי!\" צָעַק דִּין. \"כְּמוֹ הַפְּרִי הַשָּׂעִיר!\""}, {"text": "\"אֲבָל קִיוִי שֶׁלָּנוּ לֹא שָׂעִיר,\" צָחַק טוֹם. \"יֵשׁ לוֹ נוֹצוֹת.\""}]}, {"id": "tuki-3", "title": "טוֹם קָנָה תּוּכִּי 3: קִיוִי מַגִּיעַ הַבַּיְתָה", "theme": "סיפור: טום קנה תוכי, פרק 3 מתוך 8", "steps": [{"text": "אֶת הַכְּלוּב שָׂמוּ בַּסָּלוֹן, לְיַד הַחַלּוֹן, אֲבָל לֹא בַּשֶּׁמֶשׁ. כָּכָה אָמַר הַמּוֹכֵר."}, {"text": "קִיוִי לֹא זָז. הוּא יָשַׁב בַּפִּנָּה שֶׁל הַכְּלוּב, נָפוּחַ כְּמוֹ כַּדּוּר קָטָן שֶׁל נוֹצוֹת."}, {"question": "מָה עָשָׂה קִיוִי כְּשֶׁהִגִּיעַ הַבַּיְתָה?", "options": ["יָשַׁב בַּפִּנָּה וְלֹא זָז", "דִּבֵּר הַרְבֵּה", "עָף בַּבַּיִת", "אָכַל אֶת כָּל הַזְּרָעִים"], "answer": 0}, {"text": "\"לָמָּה הוּא לֹא מְדַבֵּר?\" שָׁאַל דִּין, וְהִצְמִיד אֶת הָאַף לַכְּלוּב."}, {"text": "\"הוּא מְפַחֵד,\" אָמְרָה אִמָּא. \"הַכֹּל חָדָשׁ לוֹ. הַבַּיִת חָדָשׁ, הָרֵיחוֹת חֲדָשִׁים, וְגַם אַתֶּם חֲדָשִׁים. צָרִיךְ לָתֵת לוֹ זְמַן.\""}, {"question": "לָמָּה קִיוִי לֹא מְדַבֵּר, לְפִי אִמָּא?", "options": ["כִּי הוּא מְפַחֵד וְהַכֹּל חָדָשׁ לוֹ", "כִּי הוּא חוֹלֶה", "כִּי הוּא כּוֹעֵס", "כִּי הוּא לֹא אוֹהֵב אֶת טוֹם"], "answer": 0}, {"text": "טוֹם הֵבִיא כִּסֵּא וְיָשַׁב לְיַד הַכְּלוּב. הוּא לֹא נָגַע בּוֹ וְלֹא צָעַק. הוּא רַק דִּבֵּר בְּשֶׁקֶט."}, {"question": "אֵיךְ טוֹם דִּבֵּר עִם קִיוִי?", "options": ["בְּשֶׁקֶט, בְּלִי לָגַעַת", "בִּצְעָקוֹת", "בְּשִׁירָה", "דֶּרֶךְ הַטֶּלֶפוֹן"], "answer": 0}, {"text": "\"שָׁלוֹם, קִיוִי. אֲנִי טוֹם. זֶה הַבַּיִת שֶׁלְּךָ עַכְשָׁו. אַל תְּפַחֵד.\""}, {"text": "קִיוִי פָּתַח עַיִן אַחַת, וְסָגַר אוֹתָהּ שׁוּב."}, {"text": "כָּל הָעֶרֶב טוֹם סִפֵּר לְקִיוִי עַל עַצְמוֹ. הוּא סִפֵּר עַל הָאוֹפַנַּיִם הַכְּחֻלִּים, עַל יוֹאָב וְעַל נוֹעָה, וְעַל מִשְׂחַק הַכַּדּוּר בַּהַפְסָקָה. הוּא אֲפִילוּ סִפֵּר לוֹ בְּדִיחָה."}, {"text": "\"לָמָּה הַתַּרְנְגֹלֶת חָצְתָה אֶת הַכְּבִישׁ? כְּדֵי לְהַגִּיעַ לַצַּד הַשֵּׁנִי!\""}, {"text": "קִיוִי לֹא צָחַק. אֲבָל דִּין צָחַק כָּל כָּךְ, שֶׁהוּא נָפַל מֵהַסַּפָּה."}, {"question": "מִי צָחַק מֵהַבְּדִיחָה?", "options": ["דִּין", "קִיוִי", "אַבָּא", "אַף אֶחָד"], "answer": 0}, {"text": "בַּלַּיְלָה טוֹם לֹא הִצְלִיחַ לְהֵרָדֵם. \"אוּלַי קַר לוֹ? אוּלַי הוּא רָעֵב? אוּלַי הוּא מַרְגִּישׁ לְבַד?\" הוּא קָם עַל קְצוֹת הָאֶצְבָּעוֹת וְהָלַךְ לַסָּלוֹן."}, {"text": "אַבָּא כְּבָר הָיָה שָׁם. הוּא כִּסָּה אֶת הַכְּלוּב בְּמַגֶּבֶת."}, {"question": "לָמָּה אַבָּא כִּסָּה אֶת הַכְּלוּב?", "options": ["כְּדֵי שֶׁקִּיוִי יַרְגִּישׁ שֶׁזֶּה לַיְלָה", "כִּי הָיָה חַם", "כִּי קִיוִי עָשָׂה רַעַשׁ", "כְּדֵי לְהַסְתִּיר אוֹתוֹ מִדִּין"], "answer": 0}, {"text": "\"כָּכָה הוּא יַרְגִּישׁ שֶׁזֶּה לַיְלָה,\" לָחַשׁ אַבָּא. \"גַּם תּוּכִּים צְרִיכִים לִישֹׁן.\""}, {"text": "\"לַיְלָה טוֹב, קִיוִי,\" לָחַשׁ טוֹם."}, {"text": "מִתּוֹךְ הַכְּלוּב נִשְׁמַע צִיּוּץ קָטָן וְשָׁקֵט: \"צִיפּ.\""}, {"text": "\"שָׁמַעְתָּ?\" טוֹם תָּפַס אֶת הַיָּד שֶׁל אַבָּא. \"הוּא עָנָה לִי!\""}, {"text": "בַּבֹּקֶר, כְּשֶׁאִמָּא הוֹרִידָה אֶת הַמַּגֶּבֶת, קִיוִי כְּבָר לֹא יָשַׁב בַּפִּנָּה. הוּא עָמַד עַל הַמּוֹט, אָכַל זְרָעִים וְהִסְתַּכֵּל בַּמַּרְאָה הַקְּטַנָּה."}, {"text": "דִּינְג! הוּא נָקַשׁ בַּפַּעֲמוֹן. דִּינְג! דִּינְג!"}, {"text": "\"הוּא מְנַגֵּן!\" צָעַק דִּין."}, {"question": "מָה עָשָׂה קִיוִי בַּבֹּקֶר?", "options": ["נָקַשׁ בַּפַּעֲמוֹן", "אָמַר שָׁלוֹם", "בָּרַח מֵהַכְּלוּב", "יָשַׁן כָּל הַיּוֹם"], "answer": 0}, {"text": "\"הוּא מַרְגִּישׁ בַּבַּיִת,\" חִיֵּךְ טוֹם."}, {"text": "לִפְנֵי שֶׁיָּצְאוּ לְבֵית הַסֵּפֶר, טוֹם הֶחְלִיף לְקִיוִי אֶת הַמַּיִם וְהוֹסִיף זְרָעִים. דִּין רָצָה לְהַכְנִיס אֶצְבַּע לַכְּלוּב."}, {"text": "\"עוֹד לֹא,\" אָמַר טוֹם. \"הַמּוֹכֵר אָמַר שֶׁצָּרִיךְ לְחַכּוֹת שֶׁהוּא יַכִּיר אוֹתָנוּ. אַחֶרֶת הוּא יְנַקֵּר.\""}, {"text": "\"מָה זֶה יְנַקֵּר?\" שָׁאַל דִּין."}, {"text": "\"זֶה כְּמוֹ צְבִיטָה, רַק עִם מַקּוֹר,\" הִסְבִּיר טוֹם. דִּין הֶחְבִּיא מַהֵר אֶת הַיָּדַיִם בַּכִּיסִים."}]}, {"id": "tuki-4", "title": "טוֹם קָנָה תּוּכִּי 4: הַמִּלָּה הָרִאשׁוֹנָה", "theme": "סיפור: טום קנה תוכי, פרק 4 מתוך 8", "steps": [{"text": "עָבַר שָׁבוּעַ. כָּל יוֹם, אַחֲרֵי בֵּית הַסֵּפֶר, טוֹם יָשַׁב לְיַד קִיוִי וְלִמֵּד אוֹתוֹ מִלָּה אַחַת."}, {"text": "\"שָׁ-לוֹם,\" אָמַר טוֹם לְאַט. \"שָׁ-לוֹם, קִיוִי.\""}, {"text": "קִיוִי הִטָּה אֶת הָרֹאשׁ וְאָמַר: \"צִיפּ.\""}, {"text": "\"לֹא צִיפּ. שָׁלוֹם!\""}, {"text": "\"צִיפּ צִיפּ.\""}, {"question": "מָה קִיוִי עָנָה כְּשֶׁטּוֹם אָמַר \"שָׁלוֹם\"?", "options": ["צִיפּ", "שָׁלוֹם", "גּוֹל", "טוֹם"], "answer": 0}, {"text": "טוֹם נֶאֱנַח. \"זֶה יִקַּח הַרְבֵּה זְמַן,\" אָמַר לְאִמָּא."}, {"text": "\"גַּם אַתָּה לֹא דִּבַּרְתָּ בַּיּוֹם הָרִאשׁוֹן שֶׁלְּךָ,\" צָחֲקָה אִמָּא. \"הַמִּלָּה הָרִאשׁוֹנָה שֶׁלְּךָ הָיְתָה 'כַּדּוּר'.\""}, {"question": "מָה הָיְתָה הַמִּלָּה הָרִאשׁוֹנָה שֶׁל טוֹם?", "options": ["כַּדּוּר", "אִמָּא", "אַבָּא", "תּוּכִּי"], "answer": 0}, {"text": "גַּם יוֹאָב וְנוֹעָה בָּאוּ לְנַסּוֹת."}, {"text": "\"אוּלַי הוּא מֵבִין רַק אַנְגְּלִית,\" אָמַר יוֹאָב, וְאָמַר לְקִיוִי: \"הֶלוֹ!\""}, {"text": "\"צִיפּ,\" עָנָה קִיוִי."}, {"text": "\"אוּלַי הוּא אוֹהֵב שִׁירִים,\" אָמְרָה נוֹעָה, וְשָׁרָה לוֹ שִׁיר שֶׁל יוֹם הֻלֶּדֶת. קִיוִי הִסְתּוֹבֵב אֵלֶיהָ עִם הַגַּב."}, {"text": "דִּין נִסָּה לְלַמֵּד אֶת קִיוִי לְהַגִּיד \"פִּיפִּי\". \"דִּין!\" אָמְרָה אִמָּא. \"מָה? זֶה מַצְחִיק!\" אָמַר דִּין."}, {"text": "בָּעֲרָבִים, טוֹם וְאַבָּא אָהֲבוּ לִצְפּוֹת בְּמִשְׂחֲקֵי כַּדּוּרֶגֶל בַּטֵּלֶוִיזְיָה. כָּל פַּעַם שֶׁהַקְּבוּצָה שֶׁלָּהֶם הִבְקִיעָה, הֵם קָפְצוּ מֵהַסַּפָּה וְצָעֲקוּ \"גּוֹל!\" בְּקוֹל רָם."}, {"question": "מָה טוֹם וְאַבָּא צוֹעֲקִים כְּשֶׁהַקְּבוּצָה מַבְקִיעָה?", "options": ["גּוֹל", "יֵשׁ", "הֻרָּה", "שָׁלוֹם"], "answer": 0}, {"text": "קִיוִי הִסְתַּכֵּל עֲלֵיהֶם מֵהַכְּלוּב. הוּא לֹא אָמַר כְּלוּם."}, {"text": "לְאַבָּא הָיָה גַּם הֶרְגֵּל מַצְחִיק. כָּל פַּעַם שֶׁהוּא הִתְעַטֵּשׁ, זֶה נִשְׁמַע כְּמוֹ צְפִירָה שֶׁל מְכוֹנִית: \"אַפְּצִ'ייי!\" דִּין תָּמִיד צָחַק מִזֶּה."}, {"text": "וְהַטֶּלֶפוֹן שֶׁל אִמָּא צִלְצֵל כָּל הַזְּמַן: טִי-רִי-רִי, טִי-רִי-רִי."}, {"text": "יוֹם אֶחָד, בְּאֶמְצַע אֲרוּחַת הַצָּהֳרַיִם, נִשְׁמַע צִלְצוּל. טִי-רִי-רִי!"}, {"text": "אִמָּא קָמָה לְחַפֵּשׂ אֶת הַטֶּלֶפוֹן. הִיא חִפְּשָׂה בַּתִּיק, בַּמִּטְבָּח וּמִתַּחַת לַכָּרִיּוֹת. \"אֵיפֹה הוּא?\""}, {"text": "טִי-רִי-רִי!"}, {"text": "וְאָז הִיא רָאֲתָה אֶת הַטֶּלֶפוֹן עַל הַשֻּׁלְחָן, לְיַד הַצַּלַּחַת שֶׁלָּהּ. הַמָּסָךְ הָיָה שָׁחֹר."}, {"question": "לָמָּה אִמָּא לֹא מָצְאָה מִי מְצַלְצֵל?", "options": ["כִּי הַטֶּלֶפוֹן לֹא צִלְצֵל בִּכְלָל", "כִּי הַטֶּלֶפוֹן הָיָה בַּתִּיק", "כִּי דִּין הִסְתִּיר אוֹתוֹ", "כִּי הַטֶּלֶפוֹן נִשְׁבַּר"], "answer": 0}, {"text": "כֻּלָּם הִסְתּוֹבְבוּ לְאַט אֶל הַכְּלוּב. קִיוִי עָמַד עַל הַמּוֹט, מְאֹד מְרֻצֶּה מֵעַצְמוֹ."}, {"text": "\"טִי-רִי-רִי,\" אָמַר קִיוִי."}, {"question": "מִי עָשָׂה אֶת הַצִּלְצוּל?", "options": ["קִיוִי", "הַטֶּלֶפוֹן", "דִּין", "הַשָּׁכֵן"], "answer": 0}, {"text": "כָּל הַמִּשְׁפָּחָה פָּרְצָה בִּצְחוֹק. דִּין צָחַק כָּל כָּךְ, שֶׁיָּצָא לוֹ מִיץ מֵהָאַף."}, {"text": "\"הוּא לֹא אָמַר שָׁלוֹם,\" אָמַר טוֹם, \"אֲבָל הוּא מְחַקֶּה! הוּא לוֹמֵד!\""}, {"text": "בָּעֶרֶב אַבָּא הִתְעַטֵּשׁ: \"אַפְּצִ'ייי!\""}, {"text": "וּמֵהַכְּלוּב נִשְׁמַע מִיָּד: \"אַפְּצִ'ייי!\""}, {"text": "\"זָכִיתִי בְּתַלְמִיד,\" אָמַר אַבָּא, וּמָחָה אֶת הָאַף. \"לְפָחוֹת הוּא לֹא צָרִיךְ מִמְחָטָה.\""}, {"question": "אֵיזֶה קוֹל שֶׁל אַבָּא קִיוִי חִקָּה?", "options": ["הָעִטּוּשׁ", "הַצְּחוֹק", "הַשִּׁירָה", "הַצְּעָקָה"], "answer": 0}]}, {"id": "tuki-5", "title": "טוֹם קָנָה תּוּכִּי 5: הַדֶּלֶת הַפְּתוּחָה", "theme": "סיפור: טום קנה תוכי, פרק 5 מתוך 8", "steps": [{"text": "דִּין אָהַב אֶת קִיוִי כִּמְעַט כְּמוֹ טוֹם. הוּא רַק הָיָה קְצָת קָטָן מִדַּי כְּדֵי לִזְכֹּר אֶת הַכְּלָלִים."}, {"text": "הַכְּלָל הֲכִי חָשׁוּב בַּבַּיִת הָיָה: אֶת הַכְּלוּב פּוֹתְחִים רַק כְּשֶׁכָּל הַחַלּוֹנוֹת סְגוּרִים."}, {"question": "מָה הַכְּלָל הֲכִי חָשׁוּב בַּבַּיִת?", "options": ["פּוֹתְחִים אֶת הַכְּלוּב רַק כְּשֶׁהַחַלּוֹנוֹת סְגוּרִים", "לֹא נוֹגְעִים בַּתּוּכִּי", "מַאֲכִילִים רַק בַּבֹּקֶר", "לֹא צוֹעֲקִים בַּבַּיִת"], "answer": 0}, {"text": "דִּין רָצָה מְאֹד שֶׁגַּם לוֹ יִהְיֶה תַּפְקִיד. \"אֲנִי כְּבָר גָּדוֹל,\" הוּא אָמַר כָּל יוֹם. \"אֲנִי יָכוֹל לְהַאֲכִיל אֶת קִיוִי לְבַד.\""}, {"text": "\"כְּשֶׁתִּהְיֶה קְצָת יוֹתֵר גָּדוֹל,\" עָנָה טוֹם כָּל פַּעַם, וְדִין כָּל פַּעַם כָּעַס."}, {"text": "בְּיוֹם שְׁלִישִׁי טוֹם חָזַר מְאֻחָר מֵחוּג כַּדּוּרֶגֶל. אִמָּא דִּבְּרָה בַּטֶּלֶפוֹן, בַּטֶּלֶפוֹן הָאֲמִתִּי, בַּחֶדֶר הַשֵּׁנִי. דִּין נִשְׁאַר לְבַד בַּסָּלוֹן עִם קִיוִי."}, {"text": "\"קִיוִי רָעֵב,\" אָמַר דִּין לְעַצְמוֹ. \"אֲנִי אֶתֵּן לוֹ חֲתִיכַת תַּפּוּחַ, כְּמוֹ שֶׁטּוֹם עוֹשֶׂה.\""}, {"text": "הוּא פָּתַח אֶת הַדֶּלֶת הַקְּטַנָּה שֶׁל הַכְּלוּב וְהִכְנִיס אֶת הַתַּפּוּחַ. קִיוִי לָקַח אוֹתוֹ בַּמַּקּוֹר."}, {"question": "לָמָּה דִּין פָּתַח אֶת הַכְּלוּב?", "options": ["כְּדֵי לָתֵת לְקִיוִי תַּפּוּחַ", "כְּדֵי לְשַׂחֵק אִתּוֹ", "כְּדֵי לְנַקּוֹת", "כְּדֵי שֶׁיָּעוּף"], "answer": 0}, {"text": "וְאָז דִּין שָׁמַע מוּזִיקָה מֵהָרְחוֹב. מְכוֹנִית שֶׁל גְּלִידָה! הוּא רָץ אֶל הַחַלּוֹן, פָּתַח אוֹתוֹ לִרְוָחָה וְהוֹצִיא אֶת הָרֹאשׁ הַחוּצָה."}, {"question": "לָמָּה דִּין רָץ לַחַלּוֹן?", "options": ["הוּא שָׁמַע מְכוֹנִית שֶׁל גְּלִידָה", "הוּא שָׁמַע אֶת טוֹם", "הוּא רָאָה כֶּלֶב", "הָיָה לוֹ חַם"], "answer": 0}, {"text": "הוּא שָׁכַח לִסְגֹּר אֶת הַכְּלוּב."}, {"text": "קִיוִי הֵצִיץ מֵהַדֶּלֶת הַפְּתוּחָה. הוּא קָפַץ אֶל הַשֻּׁלְחָן, וְאָז אֶל הַסַּפָּה, וְאָז... פְרְרְרְר! הוּא עָף יָשָׁר מֵעַל הָרֹאשׁ שֶׁל דִּין, וְהַחוּצָה מֵהַחַלּוֹן."}, {"text": "\"לֹא! קִיוִי, תַּחְזֹר!\" צָעַק דִּין."}, {"text": "הוּא צָעַק מֵהַחַלּוֹן: \"קִיוִי! יֵשׁ תַּפּוּחַ!\" אֲבָל רַק מְכוֹנִית הַגְּלִידָה עָנְתָה לוֹ, עִם הַמּוּזִיקָה שֶׁלָּהּ, שֶׁפִּתְאֹם נִשְׁמְעָה עֲצוּבָה מְאֹד."}, {"text": "אֲבָל קִיוִי כְּבָר הָיָה נְקֻדָּה יְרֻקָּה קְטַנָּה בַּשָּׁמַיִם, וְאָז הוּא נֶעֱלַם מֵאֲחוֹרֵי הָעֵצִים."}, {"question": "אֵיךְ קִיוִי יָצָא מֵהַבַּיִת?", "options": ["עָף מֵהַחַלּוֹן הַפָּתוּחַ", "יָצָא מֵהַדֶּלֶת", "דִּין הוֹצִיא אוֹתוֹ", "אִמָּא שִׁחְרְרָה אוֹתוֹ"], "answer": 0}, {"text": "בְּדִיּוּק אָז נִפְתְּחָה דֶּלֶת הַבַּיִת. טוֹם נִכְנַס עִם הַכַּדּוּר מִתַּחַת לַיָּד. הוּא רָאָה אֶת הַכְּלוּב הָרֵיק, אֶת הַחַלּוֹן הַפָּתוּחַ, וְאֶת דִּין בּוֹכֶה."}, {"text": "\"אֵיפֹה קִיוִי?\" שָׁאַל בְּקוֹל רוֹעֵד."}, {"text": "\"הוּא... הוּא עָף,\" יִבֵּב דִּין. \"אֲנִי רַק רָצִיתִי לָתֵת לוֹ תַּפּוּחַ.\""}, {"text": "טוֹם הִרְגִּישׁ שֶׁהַלֵּב שֶׁלּוֹ נוֹפֵל עַד הָרִצְפָּה. הוּא רָצָה לִצְעֹק עַל דִּין. הוּא רָצָה לִבְכּוֹת. הוּא רָצָה לִצְעֹק וְלִבְכּוֹת בְּיַחַד."}, {"question": "אֵיךְ טוֹם הִרְגִּישׁ כְּשֶׁרָאָה אֶת הַכְּלוּב הָרֵיק?", "options": ["כּוֹעֵס וְעָצוּב", "שָׂמֵחַ", "רָגוּעַ", "עָיֵף"], "answer": 0}, {"text": "אִמָּא בָּאָה בְּרִיצָה וְחִבְּקָה אֶת שְׁנֵיהֶם. \"עַכְשָׁו זֶה לֹא הַזְּמַן לִכְעֹס,\" הִיא אָמְרָה. \"עַכְשָׁו זֶה הַזְּמַן לְחַפֵּשׂ. תּוּכִּים לֹא עָפִים רָחוֹק בַּפַּעַם הָרִאשׁוֹנָה. הוּא בֶּטַח קָרוֹב.\""}, {"text": "טוֹם נָשַׁם עָמֹק וְנִגֵּב אֶת הָעֵינַיִם."}, {"text": "\"אַתְּ צוֹדֶקֶת,\" הוּא אָמַר. \"אֲנִי לוֹקֵחַ אֶת הָאוֹפַנַּיִם וְקוֹרֵא לְיוֹאָב וּלְנוֹעָה. אֲנַחְנוּ נִמְצָא אוֹתוֹ.\""}, {"text": "\"גַּם אֲנִי רוֹצֶה לַעֲזֹר,\" אָמַר דִּין בְּשֶׁקֶט."}, {"text": "טוֹם הִסְתַּכֵּל עָלָיו רֶגַע אָרֹךְ. \"בְּסֵדֶר,\" אָמַר לְבַסּוֹף. \"אֲבָל הַפַּעַם תַּקְשִׁיב לִי.\""}, {"question": "מָה אָמְרָה אִמָּא שֶׁצָּרִיךְ לַעֲשׂוֹת עַכְשָׁו?", "options": ["לְחַפֵּשׂ אֶת קִיוִי", "לִכְעֹס עַל דִּין", "לִקְנוֹת תּוּכִּי חָדָשׁ", "לְחַכּוֹת בַּבַּיִת"], "answer": 0}]}, {"id": "tuki-6", "title": "טוֹם קָנָה תּוּכִּי 6: הַחִפּוּשׂ הַגָּדוֹל", "theme": "סיפור: טום קנה תוכי, פרק 6 מתוך 8", "steps": [{"text": "תּוֹךְ חָמֵשׁ דַּקּוֹת יוֹאָב וְנוֹעָה הָיוּ לְמַטָּה, כָּל אֶחָד עַל הָאוֹפַנַּיִם שֶׁלּוֹ. דִּין הָלַךְ עִם אִמָּא, וְהֶחְזִיק בַּיָּד חֲתִיכַת תַּפּוּחַ, לְמִקְרֶה שֶׁקִּיוִי יִהְיֶה רָעֵב."}, {"question": "מָה דִּין לָקַח אִתּוֹ לַחִפּוּשׂ?", "options": ["חֲתִיכַת תַּפּוּחַ", "כַּדּוּר", "כְּלוּב", "פַּנָּס"], "answer": 0}, {"text": "\"תַּקְשִׁיבוּ,\" אָמַר טוֹם. \"קִיוִי יָרֹק, עִם כֶּתֶם צָהֹב עַל הָרֹאשׁ. הוּא אוֹהֵב תַּפּוּחִים וּמְחַקֶּה קוֹלוֹת.\""}, {"text": "\"מְחַקֶּה קוֹלוֹת?\" שָׁאַל יוֹאָב. \"אָז אוּלַי נִשְׁמַע אוֹתוֹ.\""}, {"text": "הֵם רָכְבוּ לְאַט בָּרְחוֹב וְהִסְתַּכְּלוּ לְמַעְלָה, עַל כָּל עֵץ וְעַל כָּל גַּג."}, {"text": "\"קִיוִי! קִיוִי!\" קָרְאוּ כֻּלָּם."}, {"text": "עַל עֵץ גָּבוֹהַּ נִרְאָה מַשֶּׁהוּ יָרֹק. \"הִנֵּה הוּא!\" צָעֲקָה נוֹעָה."}, {"text": "הֵם הִתְקָרְבוּ, וְרָאוּ שֶׁזֶּה בִּכְלָל לֹא תּוּכִּי. זֶה הָיָה בַּקְבּוּק יָרֹק שֶׁל מַיִם, שֶׁמִּישֶׁהוּ זָרַק וְהוּא נִתְקַע בֵּין הָעֲנָפִים."}, {"text": "\"אוּף,\" אָמְרָה נוֹעָה. \"אֲנִי צְרִיכָה מִשְׁקָפַיִם.\""}, {"question": "מָה הָיָה הַדָּבָר הַיָּרֹק עַל הָעֵץ?", "options": ["בַּקְבּוּק שֶׁל מַיִם", "קִיוִי", "תּוּכִּי אַחֵר", "כַּדּוּר"], "answer": 0}, {"text": "יוֹאָב עָצַר אֶת הָאוֹפַנַּיִם. \"בּוֹאוּ נִתְחַלֵּק,\" הוּא הִצִּיעַ. \"אֲנִי אֶבְדֹּק בָּרְחוֹב שֶׁל בֵּית הַסֵּפֶר, וְנוֹעָה בַּגִּנָּה.\""}, {"text": "\"לֹא,\" אָמַר טוֹם. \"אִם נִתְפַּזֵּר, לֹא נֵדַע מִי מָצָא אוֹתוֹ. נִשָּׁאֵר בְּיַחַד.\""}, {"text": "הֵם הִמְשִׁיכוּ לְגִנַּת הַמִּשְׂחָקִים. הֵם שָׁאֲלוּ אֶת הַיְּלָדִים עַל הַנַּדְנֵדוֹת. הֵם שָׁאֲלוּ אִישָׁה עִם כֶּלֶב. הֵם שָׁאֲלוּ אֶת הַמּוֹכֵר בַּמַּכֹּלֶת."}, {"text": "הָאִישָׁה עִם הַכֶּלֶב לֹא רָאֲתָה כְּלוּם. אֲבָל הַכֶּלֶב שֶׁלָּהּ נָבַח עַל כָּל עֵץ, וְכָל פַּעַם כֻּלָּם הִסְתַּכְּלוּ לְמַעְלָה בְּתִקְוָה. בַּסּוֹף הִתְבָּרֵר שֶׁהוּא סְתָם נוֹבֵחַ עַל חֲתוּלִים."}, {"text": "דִּין הִתְחִיל לְהִתְעַיֵּף. \"זֶה בִּגְלָלִי,\" הוּא לָחַשׁ לְאִמָּא, וְהַשְּׂפָתַיִם שֶׁלּוֹ רָעֲדוּ."}, {"text": "\"מָתוֹק שֶׁלִּי, כֻּלָּם טוֹעִים לִפְעָמִים,\" אָמְרָה אִמָּא. \"מָה שֶׁחָשׁוּב זֶה מָה עוֹשִׂים אַחַר כָּךְ. וְאַתָּה עוֹזֵר לְחַפֵּשׂ.\""}, {"text": "\"תּוּכִּי יָרֹק?\" אָמַר הַמּוֹכֵר וְגֵרֵד בָּרֹאשׁ. \"לֹא רָאִיתִי. אֲבָל לִפְנֵי רֶבַע שָׁעָה שָׁמַעְתִּי מִישֶׁהוּ מִתְעַטֵּשׁ מוּזָר מְאֹד לְיַד הַחֲנוּת, וְלֹא הָיָה שָׁם אַף אֶחָד.\""}, {"question": "מָה שָׁמַע הַמּוֹכֵר בַּמַּכֹּלֶת?", "options": ["מִישֶׁהוּ מִתְעַטֵּשׁ מוּזָר", "מִישֶׁהוּ שָׁר", "טֶלֶפוֹן מְצַלְצֵל", "כֶּלֶב נוֹבֵחַ"], "answer": 0}, {"text": "טוֹם וְדִין הִסְתַּכְּלוּ זֶה עַל זֶה. \"אַפְּצִ'ייי!\" אָמְרוּ שְׁנֵיהֶם בְּיַחַד."}, {"question": "אֵיךְ טוֹם וְדִין יָדְעוּ שֶׁזֶּה קִיוִי?", "options": ["כִּי קִיוִי מִתְעַטֵּשׁ כְּמוֹ אַבָּא", "כִּי הַמּוֹכֵר רָאָה אוֹתוֹ", "כִּי קִיוִי אָמַר אֶת הַשֵּׁם שֶׁלּוֹ", "כִּי הֵם מָצְאוּ נוֹצָה"], "answer": 0}, {"text": "\"זֶה הוּא!\" אָמַר טוֹם. \"לְאָן הוּא עָף?\""}, {"text": "\"נִדְמֶה לִי שֶׁהוּא עָף לַמִּגְרָשׁ,\" אָמַר הַמּוֹכֵר."}, {"text": "הַשֶּׁמֶשׁ כְּבָר הִתְחִילָה לִשְׁקֹעַ, וְהַשָּׁמַיִם הָיוּ כְּתֻמִּים. טוֹם יָדַע שֶׁבַּחֹשֶׁךְ יִהְיֶה קָשֶׁה מְאֹד לִמְצֹא צִפּוֹר יְרֻקָּה."}, {"question": "לָמָּה טוֹם רָצָה לְהִזְדָּרֵז?", "options": ["כִּי בַּחֹשֶׁךְ יִהְיֶה קָשֶׁה לִמְצֹא אוֹתוֹ", "כִּי הוּא הָיָה רָעֵב", "כִּי הַמִּשְׂחָק הִתְחִיל", "כִּי יָרַד גֶּשֶׁם"], "answer": 0}, {"text": "\"מַהֵר,\" הוּא אָמַר. \"לַמִּגְרָשׁ!\""}, {"text": "הֵם רָכְבוּ הֲכִי מַהֵר שֶׁיָּכְלוּ. דִּין וְאִמָּא רָצוּ אַחֲרֵיהֶם."}, {"text": "בַּמִּגְרָשׁ שִׂחֲקוּ יְלָדִים גְּדוֹלִים כַּדּוּרֶגֶל. הָיָה רַעַשׁ שֶׁל צְעָקוֹת וּבְעִיטוֹת, וְאִי אֶפְשָׁר הָיָה לִשְׁמֹעַ שׁוּם צִפּוֹר."}, {"text": "\"אֵיךְ נִמְצָא אוֹתוֹ פֹּה?\" שָׁאֲלָה נוֹעָה."}, {"text": "טוֹם הִסְתַּכֵּל עַל הָעֵצִים הַגְּבוֹהִים מִסָּבִיב לַמִּגְרָשׁ. הוּא לֹא רָאָה כְּלוּם. רַק עָלִים יְרֻקִּים, יְרֻקִּים, יְרֻקִּים."}, {"question": "לָמָּה קָשֶׁה לִמְצֹא אֶת קִיוִי בָּעֵצִים?", "options": ["כִּי הוּא יָרֹק כְּמוֹ הָעָלִים", "כִּי הוּא קָטָן מִדַּי", "כִּי הוּא מִתְחַבֵּא בָּאֲדָמָה", "כִּי הוּא שָׁקֵט"], "answer": 0}]}, {"id": "tuki-7", "title": "טוֹם קָנָה תּוּכִּי 7: גּוֹל!", "theme": "סיפור: טום קנה תוכי, פרק 7 מתוך 8", "steps": [{"text": "טוֹם עָמַד בְּצַד הַמִּגְרָשׁ, וְלֹא יָדַע מָה לַעֲשׂוֹת."}, {"text": "פִּתְאֹם אֶחָד הַשַּׂחְקָנִים הַגְּדוֹלִים בָּעַט, וְהַכַּדּוּר נִכְנַס לַשַּׁעַר. \"גּוֹל!\" צָעֲקוּ כָּל הַשַּׂחְקָנִים."}, {"text": "וּמִתּוֹךְ הָעֵץ הֲכִי גָּבוֹהַּ, מֵאֲחוֹרֵי הַשַּׁעַר, נִשְׁמַע קוֹל קָטָן וְצַרְחָנִי: \"גּוֹל! גּוֹל!\""}, {"question": "אֵיךְ טוֹם מָצָא אֶת קִיוִי?", "options": ["קִיוִי צָעַק \"גּוֹל\" אַחֲרֵי הַשַּׂחְקָנִים", "קִיוִי עָף אֵלָיו", "דִּין רָאָה אוֹתוֹ", "נוֹעָה שָׁמְעָה צִיּוּץ"], "answer": 0}, {"text": "כָּל הַשַּׂחְקָנִים עָצְרוּ. \"מִי אָמַר אֶת זֶה?\""}, {"text": "\"זֶה הַתּוּכִּי שֶׁלִּי!\" צָעַק טוֹם, וְזָרַק אֶת הָאוֹפַנַּיִם עַל הַדֶּשֶׁא."}, {"text": "טוֹם רָץ אֶל הָעֵץ. שָׁם, עַל עָנָף גָּבוֹהַּ, יָשַׁב כַּדּוּר קָטָן שֶׁל נוֹצוֹת יְרֻקּוֹת, עִם כֶּתֶם צָהֹב עַל הָרֹאשׁ."}, {"text": "\"קִיוִי!\" צָעַק טוֹם. \"לָמַדְתָּ מִלָּה! לָמַדְתָּ מִלָּה אֲמִתִּית!\""}, {"question": "לָמָּה טוֹם שָׂמַח כָּל כָּךְ?", "options": ["כִּי קִיוִי נִמְצָא וְגַם לָמַד מִלָּה", "כִּי הַקְּבוּצָה נִצְּחָה", "כִּי הוּא הִבְקִיעַ", "כִּי הוּא קִבֵּל גְּלִידָה"], "answer": 0}, {"text": "\"גּוֹל!\" עָנָה קִיוִי בְּגַאֲוָה."}, {"text": "הַשַּׂחְקָנִים הַגְּדוֹלִים צָחֲקוּ. \"יֵשׁ לָכֶם תּוּכִּי אוֹהֵד,\" אָמַר אֶחָד מֵהֶם. \"הוּא יָכוֹל לָבוֹא לְכָל הַמִּשְׂחָקִים שֶׁלָּנוּ.\""}, {"text": "אֲבָל אֵיךְ מוֹרִידִים אוֹתוֹ? הָעָנָף הָיָה גָּבוֹהַּ מְאֹד, יוֹתֵר גָּבוֹהַּ מֵהַשַּׁעַר."}, {"text": "\"נְטַפֵּס?\" הִצִּיעַ יוֹאָב."}, {"text": "\"לֹא!\" אָמְרָה אִמָּא, שֶׁהִגִּיעָה בְּרִיצָה. \"אַף אֶחָד לֹא מְטַפֵּס. זֶה מְסֻכָּן.\""}, {"question": "לָמָּה אִמָּא לֹא הִסְכִּימָה לְטַפֵּס?", "options": ["כִּי זֶה מְסֻכָּן", "כִּי הָעֵץ שֶׁל הַשָּׁכֵן", "כִּי כְּבָר חֹשֶׁךְ", "כִּי קִיוִי יִכְעַס"], "answer": 0}, {"text": "\"נִזְרֹק לוֹ אֶת הַכַּדּוּר?\" הִצִּיעָה נוֹעָה."}, {"text": "\"הוּא יִבָּהֵל וְיָעוּף עוֹד יוֹתֵר רָחוֹק,\" אָמַר טוֹם."}, {"text": "וְאָז דִּין מָשַׁךְ בַּחֻלְצָה שֶׁל טוֹם. \"טוֹם,\" הוּא לָחַשׁ, \"הֵבֵאתִי תַּפּוּחַ.\""}, {"question": "מָה הָיָה הָרַעְיוֹן שֶׁל דִּין?", "options": ["לְהַרְאוֹת לְקִיוִי תַּפּוּחַ", "לִזְרֹק כַּדּוּר", "לְטַפֵּס עַל הָעֵץ", "לִקְרֹא לְאַבָּא"], "answer": 0}, {"text": "טוֹם הִסְתַּכֵּל עַל אָחִיו הַקָּטָן. \"דִּין, אַתָּה גָּאוֹן!\""}, {"text": "טוֹם הֵרִים אֶת דִּין עַל הַכְּתֵפַיִם. דִּין הוֹשִׁיט אֶת הַיָּד הֲכִי גָּבוֹהַּ שֶׁהוּא יָכוֹל, וְהֶחְזִיק אֶת הַתַּפּוּחַ."}, {"text": "\"קִיוִי,\" קָרָא טוֹם בְּקוֹל רַךְ, כְּמוֹ בַּלַּיְלָה הָרִאשׁוֹן. \"בּוֹא הַבַּיְתָה. יֵשׁ תַּפּוּחַ.\""}, {"text": "קִיוִי הִטָּה אֶת הָרֹאשׁ. הוּא הִסְתַּכֵּל עַל הַתַּפּוּחַ. הוּא הִסְתַּכֵּל עַל טוֹם. הוּא קָפַץ לְעָנָף נָמוּךְ יוֹתֵר, וְעוֹד אֶחָד... וְאָז, פְרְרְרְר! הוּא נָחַת יָשָׁר עַל הַיָּד שֶׁל דִּין, וְהִתְחִיל לֶאֱכֹל."}, {"question": "עַל מָה נָחַת קִיוִי?", "options": ["עַל הַיָּד שֶׁל דִּין", "עַל הָרֹאשׁ שֶׁל טוֹם", "עַל הַשַּׁעַר", "עַל הָאוֹפַנַּיִם"], "answer": 0}, {"text": "\"הוּא עָלַי! הוּא עָלַי!\" לָחַשׁ דִּין, וְלֹא זָז אֲפִילוּ סַנְטִימֶטֶר."}, {"text": "אִמָּא כִּסְּתָה אֶת קִיוִי בַּעֲדִינוּת בַּסְּוֶדֶר שֶׁלָּהּ. \"תָּפַסְנוּ אוֹתוֹ,\" הִיא אָמְרָה, וְהַקּוֹל שֶׁלָּהּ רָעַד קְצָת."}, {"text": "כָּל הַשַּׂחְקָנִים בַּמִּגְרָשׁ מָחֲאוּ כַּפַּיִם. וּמִתּוֹךְ הַסְּוֶדֶר נִשְׁמַע קוֹל עָמוּם: \"גּוֹל!\""}, {"question": "בְּמָה אִמָּא כִּסְּתָה אֶת קִיוִי?", "options": ["בַּסְּוֶדֶר שֶׁלָּהּ", "בְּמַגֶּבֶת", "בַּכּוֹבַע שֶׁל טוֹם", "בַּחֻלְצָה שֶׁל דִּין"], "answer": 0}, {"text": "אֶחָד הַשַּׂחְקָנִים הַגְּדוֹלִים נִגַּשׁ לְטוֹם. \"תָּבִיא אוֹתוֹ בְּשַׁבָּת לַמִּשְׂחָק,\" הוּא אָמַר. \"הוּא יִהְיֶה הַקָּמֵעַ שֶׁלָּנוּ.\""}, {"text": "\"רַק אִם הוּא יִהְיֶה בַּכְּלוּב,\" אָמְרָה אִמָּא מִיָּד, וְכֻלָּם צָחֲקוּ."}]}, {"id": "tuki-8", "title": "טוֹם קָנָה תּוּכִּי 8: שָׁלוֹם, טוֹם!", "theme": "סיפור: טום קנה תוכי, פרק 8 מתוך 8", "steps": [{"text": "כְּשֶׁהֵם חָזְרוּ הַבַּיְתָה, אַבָּא כְּבָר חִכָּה לָהֶם בַּפֶּתַח. \"שָׁמַעְתִּי שֶׁהָיְתָה פֹּה הַרְפַּתְקָה,\" הוּא אָמַר."}, {"text": "קִיוִי חָזַר לַכְּלוּב שֶׁלּוֹ. הוּא שָׁתָה מַיִם, נָקַשׁ פַּעַם אַחַת בַּפַּעֲמוֹן, וְנִרְדַּם עַל הַמּוֹט, עַל רֶגֶל אַחַת."}, {"question": "מָה עָשָׂה קִיוִי כְּשֶׁחָזַר הַבַּיְתָה?", "options": ["שָׁתָה מַיִם וְנִרְדַּם", "צָעַק גּוֹל", "בָּרַח שׁוּב", "אָכַל עוּגָה"], "answer": 0}, {"text": "דִּין עָמַד לְיַד הַכְּלוּב וְהִסְתַּכֵּל עַל הָרִצְפָּה."}, {"text": "\"טוֹם,\" הוּא אָמַר בְּשֶׁקֶט, \"סְלִיחָה. לֹא הִתְכַּוַּנְתִּי. שָׁכַחְתִּי אֶת הַכְּלָל.\""}, {"text": "טוֹם חָשַׁב עַל כָּל הַיּוֹם הַזֶּה: עַל הַפַּחַד, עַל הַבַּקְבּוּק הַיָּרֹק בָּעֵץ, וְעַל הַתַּפּוּחַ שֶׁל דִּין."}, {"text": "\"אַתָּה הִצַּלְתָּ אוֹתוֹ,\" אָמַר טוֹם. \"בְּלִי הַתַּפּוּחַ שֶׁלְּךָ, הוּא עוֹד הָיָה עַל הָעֵץ.\""}, {"text": "\"אָז אַתָּה לֹא כּוֹעֵס?\""}, {"text": "\"קְצָת,\" הוֹדָה טוֹם. \"אֲבָל יוֹתֵר שָׂמֵחַ.\""}, {"question": "מָה טוֹם הִרְגִּישׁ כְּלַפֵּי דִּין בַּסּוֹף?", "options": ["קְצָת כּוֹעֵס, אֲבָל יוֹתֵר שָׂמֵחַ", "כּוֹעֵס מְאֹד", "עָצוּב", "פָּחַד מִמֶּנּוּ"], "answer": 0}, {"text": "הֵם קָבְעוּ בְּיַחַד כְּלָל חָדָשׁ: אֶת הַכְּלוּב פּוֹתְחִים רַק כְּשֶׁטּוֹם בַּבַּיִת. וְאַבָּא תָּלָה רֶשֶׁת עַל הַחַלּוֹן, כְּדֵי שֶׁאִם מִישֶׁהוּ יִשְׁכַּח, קִיוִי לֹא יוּכַל לָצֵאת."}, {"question": "מָה אַבָּא שָׂם עַל הַחַלּוֹן?", "options": ["רֶשֶׁת", "מַגֶּבֶת", "מַנְעוּל", "וִילוֹן"], "answer": 0}, {"text": "מֵאוֹתוֹ יוֹם, דִּין עָזַר לְטוֹם כָּל בֹּקֶר. טוֹם הֶחְלִיף אֶת הַמַּיִם, וְדִין חָתַךְ אֶת הַתַּפּוּחַ. וּשְׁנֵיהֶם יָשְׁבוּ לְיַד הַכְּלוּב וְלִמְּדוּ אֶת קִיוִי מִלִּים."}, {"text": "קִיוִי לָמַד מַהֵר. הוּא לָמַד לְהַגִּיד \"טוֹם\". הוּא לָמַד לְהַגִּיד \"דִּין\". הוּא לָמַד לְהַגִּיד \"תַּפּוּחַ\", אֲבָל זֶה יָצָא \"פּוּחַ\"."}, {"question": "אֵיךְ יָצְאָה לְקִיוִי הַמִּלָּה \"תַּפּוּחַ\"?", "options": ["פּוּחַ", "תַּפּוּ", "פִּיחַ", "תַּפִּי"], "answer": 0}, {"text": "יוֹאָב וְנוֹעָה בָּאוּ לְבַקֵּר כִּמְעַט כָּל יוֹם. נוֹעָה הֵבִיאָה לְקִיוִי פֶּלַח תַּפּוּז, וְיוֹאָב נִסָּה לְלַמֵּד אוֹתוֹ לְהַגִּיד \"יוֹאָב מֶלֶךְ\". קִיוִי הִסְתַּכֵּל עָלָיו וְאָמַר: \"אַפְּצִ'ייי!\""}, {"text": "\"נִרְאֶה לִי שֶׁזֶּה אוֹמֵר לֹא,\" צָחֲקָה נוֹעָה."}, {"text": "וְהוּא עֲדַיִן הִתְעַטֵּשׁ כְּמוֹ אַבָּא, צִלְצֵל כְּמוֹ הַטֶּלֶפוֹן שֶׁל אִמָּא, וְצָעַק \"גּוֹל!\" כָּל פַּעַם שֶׁמִּישֶׁהוּ בָּעַט בְּכַדּוּר."}, {"text": "בְּבֵית הַסֵּפֶר טוֹם סִפֵּר לְכָל הַכִּתָּה עַל הַהַרְפַּתְקָה. הַמּוֹרָה בִּקְּשָׁה שֶׁיִּכְתֹּב עַל זֶה חִבּוּר. טוֹם קָרָא לַחִבּוּר \"טוֹם קָנָה תּוּכִּי\", וְקִבֵּל מְצֻיָּן."}, {"text": "יוֹם אֶחָד, אַחֲרֵי חֹדֶשׁ, טוֹם חָזַר מִבֵּית הַסֵּפֶר. הוּא פָּתַח אֶת הַדֶּלֶת וְזָרַק אֶת הַתִּיק עַל הָרִצְפָּה."}, {"text": "\"שָׁלוֹם, טוֹם!\" אָמַר קוֹל קָטָן מֵהַסָּלוֹן."}, {"text": "טוֹם קָפָא בַּמָּקוֹם. הוּא רָץ לַסָּלוֹן. קִיוִי עָמַד עַל הַמּוֹט וְהִסְתַּכֵּל עָלָיו בְּעַיִן אַחַת, בְּדִיּוּק כְּמוֹ בַּיּוֹם הָרִאשׁוֹן בַּחֲנוּת."}, {"text": "\"שָׁלוֹם, טוֹם!\" אָמַר קִיוִי שׁוּב."}, {"text": "דִּין הֵצִיץ מֵאֲחוֹרֵי הַסַּפָּה וְחִיֵּךְ חִיּוּךְ גָּדוֹל. \"הַפְתָּעָה! לִמַּדְתִּי אוֹתוֹ כָּל הַשָּׁבוּעַ בַּסֵּתֶר!\""}, {"question": "מִי לִמֵּד אֶת קִיוִי לְהַגִּיד \"שָׁלוֹם, טוֹם\"?", "options": ["דִּין", "אִמָּא", "אַבָּא", "יוֹאָב"], "answer": 0}, {"text": "טוֹם צָחַק וְחִבֵּק אֶת אָחִיו הַקָּטָן חָזָק."}, {"text": "\"שָׁלוֹם, קִיוִי,\" הוּא אָמַר. \"בָּרוּךְ הַבָּא הַבַּיְתָה.\""}, {"text": "\"גּוֹל!\" עָנָה קִיוִי."}, {"question": "מָה לָמַדְנוּ מֵהַסִּפּוּר?", "options": ["שֶׁאַחִים יְכוֹלִים לִסְלֹחַ וְלַעֲזֹר זֶה לָזֶה", "שֶׁתּוּכִּים לֹא מְדַבְּרִים", "שֶׁאָסוּר לִקְנוֹת חַיּוֹת", "שֶׁכְּדַאי לִצְעֹק"], "answer": 0}, {"text": "סוֹף."}]}, {"id": "tzidi-1", "title": "צִידִי הַגּוֹלִים 1: חֲלוֹם מַדְלִיק", "theme": "ספר: צידי הגולים, פרק 1 מתוך 8", "start": true, "steps": [{"text": "דָּנִיֵּאל חוֹלֵם, עֵינָיו פְּקוּחוֹת אֲבָל מַחְשְׁבוֹתָיו נוֹדְדוֹת."}, {"text": "גּוּפוֹ בַּכִּתָּה, יָדָיו שְׁעוּנוֹת עַל שֻׁלְחַן הַכְּתִיבָה הַקָּרִיר, רֹאשׁוֹ מֻטֶּה קִמְעָה כְּמַבִּיט אֶל לוּחַ הַכִּתָּה, לְיָדוֹ חֲבֵרוֹ הַטּוֹב עָסוּק בְּמִלּוּי הַשּׁוּרוֹת בְּמַחְבַּרְתּוֹ בְּמֶרֶץ."}, {"text": "בִּפְנֵי הַכִּתָּה, בְּעוֹדָהּ מְהַלֶּכֶת הָלוֹךְ וָשׁוֹב, מְנַסָּה מוֹרָתוֹ, אֲבִיבִית, לְהַסְבִּיר תַּרְגִּיל אָרֹךְ וּפְתַלְתֹּל."}, {"text": "בְּאֵיזֶה תַּרְגִּיל מְדֻבָּר?! אֵין דָּנִיֵּאל מַמָּשׁ יוֹדֵעַ."}, {"text": "מַחְשְׁבוֹתָיו נוֹשְׂאוֹת אוֹתוֹ הַרְחֵק הַרְחֵק אֶל הַמִּשְׂחָק הַגָּדוֹל, אוֹי, הַמִּשְׂחָק הַגָּדוֹל וְהֶחָשׁוּב בְּיוֹתֵר בְּחַיָּיו."}, {"text": "הַמִּשְׂחָק, שֶׁאָמוּר לְהִתְקַיֵּם בְּדִיּוּק בְּעוֹד יוֹמַיִם – הַקְּבוּצָה שֶׁל דָּנִיֵּאל – כִּתָּה ג'3 – כְּנֶגֶד קְבוּצָה מִבֵּית הַסֵּפֶר \"שְׂחָקִים\"."}, {"question": "עַל מָה דָּנִיֵּאל חוֹלֵם בַּכִּתָּה?", "options": ["עַל הַמִּשְׂחָק הַגָּדוֹל", "עַל חֻפְשָׁה בַּיָּם", "עַל עוּגַת שׁוֹקוֹלָד", "עַל הַמּוֹרָה"], "answer": 0}, {"text": "קְבוּצַת \"שְׂחָקִים\" הִיא קְבוּצָה חֲזָקָה."}, {"text": "אֵין דָּנִיֵּאל מֵטִיל סָפֵק בִּיכוֹלוֹתֶיהָ שֶׁל קְבוּצָתָם הַיְּרִיבָה, אַחֶרֶת לֹא הָיְתָה עוֹלָה הַקְּבוּצָה לַגְּמָר, הַגְּמָר שֶׁבּוֹ מִתְחָרִים עַל גָּבִיעַ חָשׁוּב, גָּבִיעַ שֶׁבּוֹ הוּא וַחֲבֵרָיו לַקְּבוּצָה, כָּל כָּךְ חוֹשְׁקִים. כֵּן, זֶהוּ מִשְׂחָק חָשׁוּב מֵאֵין כָּמוֹהוּ וְלָכֵן נוֹתֵן דָּנִיֵּאל דְּרוֹר לְמַחְשְׁבוֹתָיו בְּעוֹדוֹ יוֹשֵׁב בַּכִּתָּה, בְּאֶמְצָעוֹ שֶׁל שִׁעוּר חֶשְׁבּוֹן."}, {"question": "בְּאֵיזֶה שִׁעוּר יוֹשֵׁב דָּנִיֵּאל?", "options": ["חֶשְׁבּוֹן", "אַנְגְּלִית", "סְפּוֹרְט", "מוּזִיקָה"], "answer": 0}, {"text": "הַחֲלוֹם שֶׁל דָּנִיֵּאל כָּל כָּךְ מָתוֹק, הוּא מַמָּשׁ מַרְגִּישׁ אֶת רַגְלָיו נִשָּׂאוֹת בְּרִיצָה עַל הַדֶּשֶׁא הָרַךְ, הוּא חָשׁ בַּזֵּעָה הַנִּגֶּרֶת..."}, {"text": "רוֹנִי בּוֹעֵט אֶת הַכַּדּוּר לְכִוּוּנוֹ שֶׁל דָּנִיֵּאל, דָּנִיֵּאל תּוֹפֵס אֶת הַכַּדּוּר בֵּין רַגְלָיו וּבוֹעֵט חֲזָרָה לְרוֹנִי, הַשְּׁנַיִם מִתְקַדְּמִים בִּמְהִירוּת עֲצוּמָה לְעֵבֶר שַׁעַר הַיְּרִיבִים, דָּנִיֵּאל חָשׁ רַחֲמִים כְּלַפֵּי הַשּׁוֹעֵר מֵהַקְּבוּצָה הַיְּרִיבָה, מִשּׁוּם שֶׁהוּא יוֹדֵעַ שֶׁבְּקָרוֹב הֵם יִכְבְּשׁוּ אֶת הַשַּׁעַר הַמְּיֻחָל."}, {"text": "צַחִי וְיוֹן-יוֹן בְּעֶמְדַּת הַבְּלִימָה, הֵם כְּבָר \"יַאֲכִילוּ\" אֶת שַׂחְקָנֵי הַקְּבוּצָה הַיְּרִיבָה \"קַשׁ\"."}, {"text": "דָּנִיֵּאל יוֹדֵעַ עַד כַּמָּה צַחִי וְיוֹן-יוֹן טוֹבִים בְּתַפְקִידָם עַל הַמִּגְרָשׁ."}, {"text": "עֹמֶר וְיוּבַל תּוֹפְסִים אֶת עֶמְדָּתָם בְּמֶרְכַּז הַמִּגְרָשׁ, פָּשׁוּט תּוֹתָחִים – אֵין זְרִיזִים וַחֲזָקִים מֵהֶם."}, {"text": "רַק תּוֹם, הַשּׁוֹעֵר, עוֹמֵד גַּלְמוּד בַּשַּׁעַר, מְשֻׁעֲמָם."}, {"text": "הָאֱמֶת, בַּחֲלוֹם הַזֶּה, אֵין לְתוֹם הַרְבֵּה מָה לַעֲשׂוֹת, לְשַׂחְקָנֵי הַקְּבוּצָה הַיְּרִיבָה אֵין אֲפִלּוּ סִכּוּי לְהִתְקָרֵב אֶל הַשַּׁעַר..."}, {"question": "מִי הַשּׁוֹעֵר שֶׁל הַקְּבוּצָה?", "options": ["תּוֹם", "רוֹנִי", "יוּבַל", "צַחִי"], "answer": 0}, {"text": "\"דָּנִיֵּאל!\" נִשְׁמַע קוֹלָהּ שֶׁל הַמּוֹרָה אֲבִיבִית, חוֹדֵר מִבַּעַד לְמָסַךְ הַחֲלוֹם. \"דָּנִיֵּאל, שִׂים לֵב! אַתָּה יָכוֹל בְּבַקָּשָׁה לַחֲזֹר עַל הַמִּשְׁפָּט הָאַחֲרוֹן שֶׁלִּי?\""}, {"text": "דָּנִיֵּאל נָע בְּכִסְאוֹ בְּחֹסֶר נוֹחוּת, הוּא לֹא מַמָּשׁ יוֹדֵעַ מָה הָיָה הַמִּשְׁפָּט הָאַחֲרוֹן שֶׁל הַמּוֹרָה."}, {"text": "אוֹי, הַמַּצָּב לֹא נָעִים."}, {"text": "דָּנִיֵּאל מַבִּיט בַּחֲבֵרָיו בִּתְחִנָּה וּמְקַוֶּה שֶׁיַּעֲבִירוּ לוֹ, אֲפִלּוּ בְּטֶלֶפַּתְיָה, אֵיזֶה מֻשָּׂג קָלוּשׁ עַל מָה הָיָה הַמִּשְׁפָּט."}, {"text": "עֹמֶר מְנַסָּה לַעֲזֹר וְלוֹחֶשֶׁת לוֹ מַשֶּׁהוּ, אֲבָל דָּנִיֵּאל לֹא מַמָּשׁ מֵבִין מָה הִיא אוֹמֶרֶת."}, {"question": "לָמָּה הַמַּצָּב שֶׁל דָּנִיֵּאל לֹא נָעִים?", "options": ["כִּי הוּא לֹא שָׁמַע מָה הַמּוֹרָה אָמְרָה", "כִּי הוּא שָׁכַח אֶת הַתִּיק", "כִּי הוּא חוֹלֶה", "כִּי הוּא אִחֵר לַכִּתָּה"], "answer": 0}, {"text": "לְמַזָּלוֹ, בְּעִתּוּי מַדְהִים, נִפְתַּחַת דֶּלֶת הַכִּתָּה וְהַמְּנַהֵל נִכְנָס."}, {"text": "הַמְּנַהֵל אֵינוֹ לְבַד, לְיָדוֹ עוֹמֵד יֶלֶד שֶׁהֵם אֵינָם מַכִּירִים."}, {"text": "הַמְּנַהֵל מְסַפֵּר שֶׁזֶּהוּ תַּלְמִיד חָדָשׁ שֶׁשְּׁמוֹ נְתַנְאֵל."}, {"question": "מִי נִכְנַס לַכִּתָּה עִם הַמְּנַהֵל?", "options": ["תַּלְמִיד חָדָשׁ", "מְאַמֵּן", "אַבָּא שֶׁל דָּנִיֵּאל", "מוֹרָה חֲדָשָׁה"], "answer": 0}, {"text": "\"עַד לֹא מִזְּמַן הוּא גָּר בְּעִיר אַחֶרֶת וְלָאַחֲרוֹנָה עָבַר עִם הוֹרָיו לְכָאן\", מַסְבִּיר הַמְּנַהֵל."}, {"text": "\"אָמַרְתִּי לוֹ שֶׁהוּא הִגִּיעַ לַכִּתָּה הֲכִי מַקְסִימָה בְּבֵית הַסֵּפֶר\", סִפֵּר הַמְּנַהֵל, קָרַץ, צָחַק וְיָצָא מִן הַכִּתָּה."}, {"text": "נְתַנְאֵל הִבִּיט בְּיַלְדֵי הַכִּתָּה בְּעוֹד הֵם בָּהוּ בּוֹ בְּסַקְרָנוּת."}, {"text": "הַמּוֹרָה אֲבִיבִית הֵנִיחָה בַּחֲבִיבוּת אֶת יָדָהּ עַל כְּתֵפוֹ וּבֵרְכָה אוֹתוֹ בְּבִרְכַּת בָּרוּךְ הַבָּא לְכִתָּה ג'3."}, {"text": "הִיא רָכְנָה אֵלָיו וְלָחֲשָׁה בְּאָזְנוֹ שֶׁאֵין לָהּ שׁוּם סָפֵק שֶׁתּוֹךְ זְמַן קָצָר הוּא יִשְׁתַּלֵּב בַּכִּתָּה."}, {"text": "בְּרֶגַע זֶה נִשְׁמַע צִלְצוּל פַּעֲמוֹן בֵּית הַסֵּפֶר, צִלְצוּל שֶׁסִּמֵּן אֶת סִיּוּם הַשִּׁעוּר וְתַלְמִידֵי הַכִּתָּה פָּרְצוּ בִּצְוָחוֹת חֶדְוָה לְעֵבֶר מִגְרַשׁ הַמִּשְׂחָקִים אֲשֶׁר בְּרַחֲבַת בֵּית הַסֵּפֶר."}, {"question": "לְאָן רָצוּ הַתַּלְמִידִים כְּשֶׁצִּלְצֵל הַפַּעֲמוֹן?", "options": ["לְמִגְרַשׁ הַמִּשְׂחָקִים", "הַבַּיְתָה", "לַסִּפְרִיָּה", "לַחֲדַר הַמְּנַהֵל"], "answer": 0}]}, {"id": "tzidi-2", "title": "צִידִי הַגּוֹלִים 2: אֵיפֹה לְכָל הַשֵּׁדִים זֶה טוֹרוֹנְטוֹ?", "theme": "ספר: צידי הגולים, פרק 2 מתוך 8", "steps": [{"text": "בַּהַפְסָקָה, בָּרְחָבָה שֶׁל בֵּית הַסֵּפֶר, נְתַנְאֵל בּוֹחֵן אֶת חֲבֵרָיו הַחֲדָשִׁים."}, {"text": "גַּם הַתַּלְמִידִים הַוָּתִיקִים מְנַסִּים לִתְהוֹת עַל קַנְקַנּוֹ שֶׁל הַתַּלְמִיד הֶחָדָשׁ."}, {"text": "בְּתִסְפָּרְתּוֹ הָעַכְשָׁוִית, בַּעֲמִידָתוֹ הַנִּנּוֹחָה וְהַבּוֹטַחַת, נְתַנְאֵל כְּבָר מַמָּשׁ לֹא נִרְאֶה בַּיְשָׁן."}, {"text": "\"מֵהֵיכָן אַתָּה בָּא?\" שׁוֹאֵל רוֹנִי."}, {"text": "\"מֵהַבַּיִת\", עוֹנֶה לוֹ נְתַנְאֵל."}, {"question": "מָה עָנָה נְתַנְאֵל כְּשֶׁשָּׁאֲלוּ אוֹתוֹ מֵהֵיכָן הוּא בָּא?", "options": ["מֵהַבַּיִת", "מִטּוֹרוֹנְטוֹ", "מִלּוֹנְדוֹן", "מֵהַיָּם"], "answer": 0}, {"text": "יוֹן-יוֹן צוֹחֵק, לֶחָדָשׁ יֵשׁ חוּשׁ הוּמוֹר וְזֶה מוֹצֵא חֵן בְּעֵינָיו."}, {"text": "\"אֲנִי מִתְכַּוֵּן, אֵיפֹה הִתְגּוֹרַרְתָּ לִפְנֵי שֶׁהִגַּעְתָּ לְכָאן?\" מַמְשִׁיךְ רוֹנִי בְּנִסְיוֹנוֹתָיו."}, {"text": "נְתַנְאֵל נוֹתֵן מַבָּט מְשֻׁעֲמָם בְּרוֹנִי."}, {"text": "\"אוֹח... פַּעַם כָּאן, פַּעַם שָׁם\", הוּא מֵשִׁיב, \"נוֹלַדְתִּי בְּטוֹרוֹנְטוֹ, וְגַרְנוּ בְּתֵל-אָבִיב, בְּאֵילַת בְּרוֹמָא, וְגַם מִסְפַּר שָׁנִים בְּלוֹנְדוֹן\", הוּא מְסַפֵּר."}, {"text": "כֻּלָּם מַבִּיטִים בּוֹ בִּפְלִיאָה."}, {"text": "כָּל כָּךְ הַרְבֵּה מְקוֹמוֹת הֵם אֲפִלּוּ לֹא רָאוּ בַּחֻפְשׁוֹת שֶׁלָּהֶם."}, {"text": "דָּנִיֵּאל שׁוֹאֵל: \"אֵיפֹה זֶה טוֹרוֹנְטוֹ?\""}, {"text": "\"בְּקָנָדָה\", לוֹחֶשֶׁת עֹמֶר. \"זֶה יָדוּעַ\", הִיא מוֹסִיפָה."}, {"question": "בְּאֵיזוֹ מְדִינָה נִמְצֵאת טוֹרוֹנְטוֹ?", "options": ["קָנָדָה", "אַנְגְּלִיָּה", "אִיטַלְיָה", "יִשְׂרָאֵל"], "answer": 0}, {"text": "\"לֹא, זֶה לֹא\", זוֹעֵף דָּנִיֵּאל, \"וְזֶה גַּם לֹא חָשׁוּב בִּכְלָל\"."}, {"text": "הוּא הָיָה מַעֲדִיף לְשַׂחֵק כַּדּוּרֶגֶל בִּמְקוֹם לִשְׁמֹעַ אֶת הַסִּפּוּרִים הָאֵלֶּה."}, {"text": "אֲבָל שְׁאָר הַחֲבֵרִים מִתְלַהֲבִים וּמִתְעַנְיְנִים כָּרֶגַע בִּנְתַנְאֵל יוֹתֵר מֵאֲשֶׁר בְּמִשְׂחַק הַכַּדּוּרֶגֶל הַמִּתְקָרֵב."}, {"question": "מָה דָּנִיֵּאל הָיָה מַעֲדִיף לַעֲשׂוֹת?", "options": ["לְשַׂחֵק כַּדּוּרֶגֶל", "לִשְׁמֹעַ עוֹד סִפּוּרִים", "לִלְעֹס מַסְטִיק", "לִלְמֹד חֶשְׁבּוֹן"], "answer": 0}, {"text": "נְתַנְאֵל מַשְׁלִיךְ בְּקוֹלִיּוּת מַסְטִיקִים לְעֵבֶר כֻּלָּם."}, {"text": "\"שָׁמַעְתִּי שֶׁאַתֶּם חֲבוּרַת כַּדּוּרַגְלָנִים\", הוּא אוֹמֵר בְּעוֹדוֹ לוֹעֵס מַסְטִיק וָרֹד וּמָתוֹק."}, {"text": "\"שָׁמַעְתָּ נָכוֹן\", מְמַצְמֵץ יוּבַל בִּשְׂפָתָיו, \"אֲנַחְנוּ קְבוּצָה תּוֹתָחִית!\""}, {"text": "\"מָחֳרָתַיִם אֲנַחְנוּ נִזְכֶּה בְּגָבִיעַ בֵּית הַסֵּפֶר, אָז נוֹכִיחַ לְכֻלָּם עַד כַּמָּה שֶׁאֲנַחְנוּ טוֹבִים!\" פּוֹסֵק בְּהֶחְלֵטִיּוּת יוּבַל."}, {"text": "כֻּלָּם נִרְגָּשִׁים לִקְרַאת הַמִּשְׂחָק וּמְצַפִּים לוֹ מְאֹד."}, {"question": "מָתַי הַקְּבוּצָה רוֹצָה לִזְכּוֹת בַּגָּבִיעַ?", "options": ["מָחֳרָתַיִם", "הַיּוֹם", "מָחָר", "בְּעוֹד שָׁנָה"], "answer": 0}, {"text": "\"גַּם אֲנִי בָּעִנְיָן\", אוֹמֵר נְתַנְאֵל, \"אֲנִי מְשַׂחֵק כַּדּוּרֶגֶל טוֹב מְאֹד, אֲנִי מְשַׂחֵק כְּבָר דֵּי הַרְבֵּה זְמַן. מִי שֶׁלּוֹמֵד כַּדּוּרֶגֶל בְּאַנְגְּלִיָּה, מֻכְרָח לִהְיוֹת שַׂחְקָן טוֹב\", הוּא מַסְבִּיר."}, {"text": "\"מָתַי הָאִמּוּן הַבָּא?\" הוּא שׁוֹאֵל."}, {"text": "\"הַיּוֹם\", עוֹנֶה צַחִי, מֻפְתָּע, \"בְּשָׁלֹשׁ, בְּמִגְרַשׁ הַסְּפּוֹרְט\"."}, {"question": "מָתַי וְאֵיפֹה הָאִמּוּן?", "options": ["הַיּוֹם בְּשָׁלֹשׁ בְּמִגְרַשׁ הַסְּפּוֹרְט", "מָחָר בַּבֹּקֶר בַּכִּתָּה", "הַיּוֹם בְּחָמֵשׁ בַּפַּארְק", "מָחֳרָתַיִם בְּבֵית הַסֵּפֶר"], "answer": 0}, {"text": "\"סָגַרְנוּ!\" נְתַנְאֵל צוֹחֵק."}, {"text": "\"דֶּרֶךְ אַגַּב, הַחֲבֵרִים שֶׁלִּי קוֹרְאִים לִי נָתִי\", מַסְבִּיר נְתַנְאֵל לַחֲבֵרָיו הַחֲדָשִׁים."}, {"text": "\"אָז יַאלְלָה נִתְרָאֶה מְאֻחָר יוֹתֵר בָּאִמּוּן!\" אוֹמֵר נָתִי וּמִתְרַחֵק בְּעוֹדוֹ שׁוֹרֵק מַנְגִּינָה מִבֵּין שְׂפָתָיו."}, {"question": "אֵיךְ הַחֲבֵרִים שֶׁל נְתַנְאֵל קוֹרְאִים לוֹ?", "options": ["נָתִי", "נָתָן", "אֵלִי", "תּוֹם"], "answer": 0}]}, {"id": "tzidi-3", "title": "צִידִי הַגּוֹלִים 3: נַעֲלֵי הַכַּדּוּרֶגֶל הַטּוֹבוֹת בְּיוֹתֵר", "theme": "ספר: צידי הגולים, פרק 3 מתוך 8", "steps": [{"text": "\"הַחֲבֵרִים שֶׁלִּי קוֹרְאִים לִי נָתִי!\" חִקָּה אוֹתוֹ דָּנִיֵּאל בְּעוֹדוֹ שׂוֹרֵךְ אֶת שְׂרוֹכֵי נַעֲלֵי קַט הָרֶגֶל שֶׁעַל רַגְלָיו, \"וְנוֹלַדְתִּי בְּטוֹוֹוֹרוֹנְטוֹוֹוֹ...\", הוּא לוֹעֵג וּמְקַמֵּט אֶת אַפּוֹ."}, {"text": "תּוֹם, בְּעוֹדוֹ לוֹבֵשׁ אֶת חֻלְצַת הַקְּבוּצָה, אוֹמֵר לְדָנִיֵּאל – \"נוּ, תַּרְגִּיעַ כְּבָר, הֲרֵי זֶה לֹא בְּדִיּוּק קַל לִהְיוֹת הֶחָדָשׁ שֶׁל הַכִּתָּה וּלְנַסּוֹת לְהִשְׁתַּלֵּב בִּזְמַן שֶׁכֻּלָּם מַכִּירִים אֶחָד אֶת הַשֵּׁנִי כְּבָר מִזְּמַן. אָז חַיָּבִים קְצָת לְהַשְׁוִיץ, כְּדֵי שֶׁהָאֲחֵרִים יֵדְעוּ מִי אַתָּה\", הוּא מַסְבִּיר."}, {"question": "מָה עוֹשֶׂה דָּנִיֵּאל כְּשֶׁהוּא מְחַקֶּה אֶת נָתִי?", "options": ["לוֹעֵג לוֹ", "מְחַבֵּק אוֹתוֹ", "מְשַׁבֵּחַ אוֹתוֹ", "שׁוֹאֵל אוֹתוֹ שְׁאֵלָה"], "answer": 0}, {"text": "\"בֶּאֱמֶת חַיָּבִים?\" שׁוֹאֵל יוּבַל."}, {"text": "אָבִי, הַמְּאַמֵּן, עוֹמֵד בַּצַּד וּמַאֲזִין לְשִׂיחָתָם."}, {"question": "מִי זֶה אָבִי?", "options": ["הַמְּאַמֵּן", "הַשּׁוֹעֵר", "הַמְּנַהֵל", "הַשּׁוֹפֵט"], "answer": 0}, {"text": "הַשָּׁעָה קְצָת לִפְנֵי שָׁלֹשׁ, כֻּלָּם הִתְאַסְּפוּ כְּבָר, רַק הֶחָדָשׁ עֲדַיִן לֹא הִגִּיעַ."}, {"text": "\"הוּא בֶּטַח כְּבָר שָׁכַח מִזֶּה\", אוֹמֵר רוֹנִי."}, {"text": "\"עָדִיף כָּךְ\", רוֹטֵן דָּנִיֵּאל, \"הוּא סְתָם שְׁוִיצֶר\"."}, {"text": "\"אַתָּה מַגְזִים, אַתָּה בִּכְלָל לֹא מַכִּיר אוֹתוֹ\", אוֹמֶרֶת עֹמֶר."}, {"question": "מָה אוֹמֶרֶת עֹמֶר לְדָנִיֵּאל?", "options": ["שֶׁהוּא מַגְזִים", "שֶׁהוּא צוֹדֵק", "שֶׁהוּא שׁוֹעֵר טוֹב", "שֶׁהִיא רְעֵבָה"], "answer": 0}, {"text": "לְפֶתַע נְתַנְאֵל מֵגִיחַ מֵאֲחוֹרֵיהֶם, הוּא לוֹבֵשׁ חֻלְצַת כַּדּוּרֶגֶל מְהַמֶּמֶת: חֻלְצָה צְהֻבָּה עִם פַּסִּים שְׁחֹרִים, עַל הַגַּב מֻטְבַּעַת הַסִּפְרָה 7, בְּדִיּוּק כְּמוֹ שֶׁל דֵּיוִיד בֶּקְהֶם."}, {"question": "אֵיזֶה מִסְפָּר יֵשׁ עַל הַחֻלְצָה שֶׁל נָתִי?", "options": ["7", "10", "1", "9"], "answer": 0}, {"text": "גַּם נַעֲלֵי הַכַּדּוּרֶגֶל שֶׁעַל רַגְלָיו הֵן מֵהַטּוֹבוֹת בְּיוֹתֵר, אֶת זֶה רוֹאִים מִמַּבָּט רִאשׁוֹן."}, {"text": "\"אֲנִי מְאַחֵר?\" הוּא שׁוֹאֵל בְּעוֹדוֹ מְחַיֵּךְ בִּלְבָבִיּוּת."}, {"text": "\"לֹא, הִגַּעְתָּ בְּדִיּוּק בַּזְּמַן\", הוּא נַעֲנֶה."}, {"text": "אָבִי הַמְּאַמֵּן מַרְגִּישׁ שֶׁהוּא חַיָּב לְבָרֵר אֶת הָעִנְיָן, הוּא חַיָּב לָדַעַת מַה נָּכוֹן וּמַה לֹּא, הוּא חַיָּב לְגַלּוֹת עַד כַּמָּה נְתַנְאֵל בֶּאֱמֶת יוֹדֵעַ לְשַׂחֵק."}, {"text": "\"אֲנַחְנוּ מַתְחִילִים עַכְשָׁו\", הוּא מַכְרִיז, \"וְאַתָּה פָּשׁוּט תִּצְטָרֵף אֵלֵינוּ לָאִמּוּן כְּדֵי שֶׁנּוּכַל לִבְדֹּק אִם אַתָּה מַתְאִים לַקְּבוּצָה אוֹ לֹא\", הוּא מַסְבִּיר לִנְתַנְאֵל."}, {"text": "אָבִי זוֹרֵק אֶת הַכַּדּוּר לְמֶרְכַּז הַמִּגְרָשׁ."}, {"text": "דָּנִיֵּאל תּוֹפֵס אֶת הַכַּדּוּר וּבוֹעֵט בְּעִיטָה עַצְבָּנִית, שֶׁשּׁוֹלַחַת אֶת הַכַּדּוּר הַרְחֵק אֶל מֵעֵבֶר לַמִּגְרָשׁ, יָשָׁר לְתוֹךְ הַשַּׁעַר הַפָּתוּחַ."}, {"text": "\"יָפֶה מְאֹד\", מְמַלְמֵל אָבִי."}, {"question": "לְאָן הִגִּיעַ הַכַּדּוּר שֶׁבָּעַט דָּנִיֵּאל?", "options": ["לְתוֹךְ הַשַּׁעַר", "לַחַלּוֹן", "לַגָּדֵר", "לַיָּדַיִם שֶׁל תּוֹם"], "answer": 0}]}, {"id": "tzidi-4", "title": "צִידִי הַגּוֹלִים 4: פְּרוֹפֶסוֹר כָּל-יוֹדֵעַ", "theme": "ספר: צידי הגולים, פרק 4 מתוך 8", "steps": [{"text": "אָבִי הַמְּאַמֵּן מַכִּיר אֶת הַחֲבוּרָה שֶׁלּוֹ טוֹב מְאֹד."}, {"text": "הוּא לֹא רַק הַדּוֹד שֶׁל תּוֹם, הוּא הַמְּאַמֵּן שֶׁל הַהֶרְכֵּב כְּבָר זְמַן לֹא קָצָר."}, {"text": "הוּא יוֹדֵעַ בְּדִיּוּק מָה הֵן נְקֻדּוֹת הַחֹזֶק שֶׁלָּהֶם וּמָה הֵן נְקֻדּוֹת הַחֻלְשָׁה: כָּל אֶחָד מֵהֶם כְּשֶׁהוּא לְבַד הוּא דֵּי טוֹב, אַךְ שִׁתּוּף הַפְּעֻלָּה בֵּינֵיהֶם זָקוּק לְשִׁפּוּר וְאֶת זֶה הוּא רוֹצֶה לְתַרְגֵּל הַיּוֹם."}, {"question": "מָה אָבִי רוֹצֶה לְתַרְגֵּל הַיּוֹם?", "options": ["לְשַׂחֵק בְּיַחַד וְלִמְסֹר", "לָרוּץ מַהֵר", "לִבְעֹט חָזָק", "לַעֲמֹד בַּשַּׁעַר"], "answer": 0}, {"text": "\"קָדִימָה יוֹן-יוֹן, לַמֶּרְכָּז! וְתִמְסֹר לַחֲבֵרִים שֶׁלְּךָ – שׁוֹמֵעַ? לִ מְ סֹ ר!!!\" הוּא מְבַקֵּשׁ."}, {"text": "עֹמֶר פְּנוּיָה, וְיוֹן-יוֹן מוֹסֵר לָהּ."}, {"text": "עֹמֶר תּוֹפֶסֶת בְּרַגְלֶיהָ אֶת הַכַּדּוּר וְיוֹצֵאת עִמּוֹ בְּרִיצָה קָדִימָה."}, {"text": "רוֹנִי חוֹסֵם אֶת דַּרְכָּהּ."}, {"text": "אָבִי מוֹרֶה לָהּ לְהַעֲבִיר אֶת הַכַּדּוּר לְצַחִי: \"לְצַחִי, תִּמְסְרִי כְּבָר לְצַחִי!\""}, {"text": "אָבִי רָץ יַחַד אִתָּם, הוּא לְגַמְרֵי בָּעִנְיָן."}, {"text": "עֹמֶר בּוֹעֶטֶת אֶת הַכַּדּוּר לְצַחִי, צַחִי כְּבָר מַמְתִּין בַּהֲגַנָּה הַיְמָנִית."}, {"question": "לְמִי עֹמֶר בּוֹעֶטֶת אֶת הַכַּדּוּר?", "options": ["לְצַחִי", "לְרוֹנִי", "לְתוֹם", "לְאָבִי"], "answer": 0}, {"text": "אֲבָל אָז, לְפֶתַע, נְתַנְאֵל נִכְנָס לַמִּשְׂחָק וְעוֹצֵר אֶת הַכַּדּוּר בְּחָזֵהוּ, הוּא מַקְפִּיץ וּמַרְקִיד אֶת הַכַּדּוּר עַל בִּרְכָּיו, וְאָז בִּתְנוּעָה קַלִּילָה הוּא מְאַזֵּן אֶת הַכַּדּוּר עַל רֹאשׁוֹ וְשׁוּב עַל הַבִּרְכַּיִם..."}, {"text": "\"מָה אַתָּה עוֹשֶׂה?!\" שׁוֹאֵל אָבִי בִּתְמִיהָה, \"תִּמְסֹר כְּבָר לְיוּבַל, קָדִימָה, זוּז!\""}, {"text": "אֲבָל נְתַנְאֵל בִּכְלָל לֹא חוֹשֵׁב לַעֲשׂוֹת זֹאת, הוּא מְכַדְרֵר אֶת הַכַּדּוּר, בּוֹעֵט בּוֹ, מְנִיפוֹ מַעְלָה בְּעֶזְרַת רַגְלָיו, מְשַׂחֵק בּוֹ כְּמוֹ חָתוּל בְּעַכְבָּר, וְאָז הוּא בּוֹעֵט אֶת הַכַּדּוּר בְּכָל הַכֹּחַ, הַיְשֵׁר לַשַּׁעַר."}, {"text": "\"וָואוּ אֵיזוֹ בְּעִיטָה אַדִּירָה וּמְדֻיֶּקֶת, כָּל הַכָּבוֹד!\" מַחְמִיאִים לוֹ שַׂחְקָנֵי הַקְּבוּצָה."}, {"question": "מָה עָשָׂה נָתִי בִּמְקוֹם לִמְסֹר לְיוּבַל?", "options": ["בָּעַט לְבַד לַשַּׁעַר", "מָסַר לְעֹמֶר", "יָצָא מֵהַמִּגְרָשׁ", "תָּפַס בַּיָּדַיִם"], "answer": 0}, {"text": "\"יָפֶה מְאֹד!\" מְאַשֵּׁר אָבִי הַמְּאַמֵּן, \"שִׂחַקְתָּ אוֹתָהּ. עַכְשָׁו עָלֵינוּ לַחֲזֹר וּלְשַׂחֵק בְּיַחַד, כִּי כַּדּוּרֶגֶל הוּא סְפּוֹרְט קְבוּצָתִי, נָכוֹן?\""}, {"text": "נָתִי מֵעִיף בִּנְשִׁיפָה תַּלְתַּל מִמִּצְחוֹ: \"הָאִמּוּן שֶׁלָּכֶם מְשַׁעֲמֵם, כָּךְ לֹא תִּזְכּוּ אֲפִלּוּ בְּסֻכָּרִיָּה עַל מַקֵּל, תַּאֲמִינוּ לִי, אֲנִי שִׂחַקְתִּי כְּבָר בְּלֹא מְעַט קְבוּצוֹת, אֲנִי יוֹדֵעַ עַל מָה אֲנִי מְדַבֵּר\"."}, {"question": "מָה נָתִי חוֹשֵׁב עַל הָאִמּוּן?", "options": ["שֶׁהוּא מְשַׁעֲמֵם", "שֶׁהוּא מְצֻיָּן", "שֶׁהוּא קָשֶׁה מִדַּי", "שֶׁהוּא מַצְחִיק"], "answer": 0}, {"text": "אָבִי לוֹקֵחַ נְשִׁימָה עֲמֻקָּה."}, {"text": "דָּנִיֵּאל מְמַלְמֵל: \"מָה אַתָּה שָׂח, פְּרוֹפֶסוֹר אֲנִי כָּל-יוֹדֵעַ?!\""}, {"question": "לָמָּה דָּנִיֵּאל קוֹרֵא לְנָתִי \"פְּרוֹפֶסוֹר כָּל-יוֹדֵעַ\"?", "options": ["כִּי נָתִי מִתְנַהֵג כְּאִלּוּ הוּא יוֹדֵעַ הַכֹּל", "כִּי נָתִי מוֹרֶה", "כִּי נָתִי מַרְכִּיב מִשְׁקָפַיִם", "כִּי נָתִי לוֹמֵד הַרְבֵּה"], "answer": 0}, {"text": "\"אֲנַחְנוּ נַעֲשֶׂה אֶת זֶה אֵיךְ שֶׁאָבִי יַגִּיד לָנוּ\", מַעֲמִידָה אוֹתוֹ עֹמֶר בַּמָּקוֹם."}, {"text": "נָתִי מוֹשֵׁךְ בִּכְתֵפָיו, \"אוֹ-קֵיי, זוֹ הָיְתָה רַק עֵצָה יְדִידוּתִית, הֲרֵי בְּסַךְ הַכֹּל אֲנַחְנוּ רוֹצִים לִזְכּוֹת\"."}, {"text": "\"אֲנַחְנוּ?\" שׁוֹאֵל צַחִי בְּשֶׁקֶט."}, {"text": "\"אֲבָל בְּצוּרָה כָּזוֹ אֵין סִכּוּי שֶׁנַּצְלִיחַ\", הוּא מַסְבִּיר."}, {"text": "נָתִי דּוֹחֵף בְּבוּז אֶת הַכַּדּוּר הַצִּדָּה, הוּא חוֹטֵף אֶת תִּיק הַסְּפּוֹרְט שֶׁלּוֹ, קוֹפֵץ עַל אוֹפַנָּיו וְנוֹסֵעַ לְדַרְכּוֹ."}, {"text": "כֻּלָּם מַבִּיטִים בּוֹ בְּעוֹדוֹ מִתְרַחֵק."}, {"text": "\"מָה זֶה הָיָה צָרִיךְ לִהְיוֹת?\" שׁוֹאֵל רוֹנִי."}, {"text": "\"יֶלֶד מוּזָר\", לוֹחֵשׁ אָבִי הַמְּאַמֵּן, \"אוּלַי תְּדַבְּרוּ אִתּוֹ מָחָר?\" הוּא מַצִּיעַ."}, {"text": "כֵּן, זֶה מַה שֶּׁהֵם יַעֲשׂוּ מָחָר בְּבֵית הַסֵּפֶר, הֵם יְנַהֲלוּ עִמּוֹ שִׂיחָה רְצִינִית, אֲבָל מָה הֵם יַגִּידוּ לוֹ?"}, {"question": "מָה עָשָׂה נָתִי בְּסוֹף הָאִמּוּן?", "options": ["נָסַע הַבַּיְתָה עַל הָאוֹפַנַּיִם", "נִשְׁאַר לְהִתְאַמֵּן", "הִתְנַצֵּל", "עָמַד בַּשַּׁעַר"], "answer": 0}]}, {"id": "tzidi-5", "title": "צִידִי הַגּוֹלִים 5: מְסִבַּת הַכַּדּוּרֶגֶל", "theme": "ספר: צידי הגולים, פרק 5 מתוך 8", "steps": [{"text": "\"אוּלַי נַגִּיד לוֹ שֶׁהוּא פָּשׁוּט לֹא מַתְאִים לַקְּבוּצָה שֶׁלָּנוּ?\" שׁוֹאֵל דָּנִיֵּאל."}, {"text": "\"כֵּן, פָּשׁוּט מְאֹד\", מְחַזֵּק אוֹתוֹ יוּבַל."}, {"text": "הֵם קָבְעוּ לְהִפָּגֵשׁ לִפְנֵי תְּחִלַּת הַשִּׁעוּר כְּדֵי לָדוּן בָּעִנְיָן, הֲרֵי זֶהוּ עִנְיָן מְאֹד חָשׁוּב."}, {"text": "הַמַּצָּב דּוֹרֵשׁ הַבְהָרָה מִיָּדִית, בְּכָךְ אָבִי הַמְּאַמֵּן צוֹדֵק."}, {"question": "לָמָּה הַחֲבֵרִים נִפְגָּשִׁים לִפְנֵי הַשִּׁעוּר?", "options": ["כְּדֵי לְדַבֵּר עַל נָתִי", "כְּדֵי לְהִתְאַמֵּן", "כְּדֵי לֶאֱכֹל", "כְּדֵי לְהָכִין שִׁעוּרֵי בַּיִת"], "answer": 0}, {"text": "\"אוּלַי נוּכַל לָתֵת לוֹ עוֹד הִזְדַּמְּנוּת?\" נִסָּה צַחִי בִּזְהִירוּת."}, {"text": "\"גַּם אֲנִי חוֹשֶׁבֶת שֶׁאוּלַי כְּדַאי לְנַסּוֹת\", אָמְרָה עֹמֶר, \"כִּי נִרְאֶה שֶׁלְּשַׂחֵק כַּדּוּרֶגֶל הוּא דַּוְקָא יוֹדֵעַ\"."}, {"question": "מִי רוֹצִים לָתֵת לְנָתִי עוֹד הִזְדַּמְּנוּת?", "options": ["צַחִי וְעֹמֶר", "דָּנִיֵּאל וְיוּבַל", "רַק אָבִי", "אַף אֶחָד"], "answer": 0}, {"text": "בְּרֶגַע זֶה נָתִי פּוֹרֵץ לַכִּתָּה, תַּלְתַּלָּיו הַשְּׁחֹרִים בְּעִקְבוֹתָיו, מִתַּחַת לִזְרוֹעוֹ הוּא מַחֲזִיק כַּדּוּר, כַּדּוּר חָדָשׁ, מַבְרִיק וּמְנֻפָּח עַד לְהִתְפּוֹצֵץ."}, {"text": "\"הִנֵּה מַתָּנָה קְטַנָּה לַקְּבוּצָה\", הוּא אוֹמֵר בְּגַאֲוָה."}, {"question": "מָה נָתִי מֵבִיא לַקְּבוּצָה?", "options": ["כַּדּוּר חָדָשׁ", "נַעֲלַיִם", "חֻלְצוֹת", "גָּבִיעַ"], "answer": 0}, {"text": "\"וָואוּ!\" מִתְלַהֵב רוֹנִי, \"אֵיזֶה כַּדּוּר פְּצָצָה! תּוֹדָה\"."}, {"text": "\"אֵין בְּעַד מָה\", עוֹנֶה נָתִי."}, {"text": "\"דֶּרֶךְ אַגַּב, רָצִיתִי לְהַזְמִין אֶתְכֶם לִמְסִבַּת כַּדּוּרֶגֶל הַיּוֹם אַחַר הַצָּהֳרַיִם, אֶצְלִי בַּבַּיִת. נִצְפֶּה בְּכַמָּה סְרָטִים שֶׁל הָאַלִּיפוּת הָאַחֲרוֹנָה, וְאָז נְשַׂחֵק בַּמַּחְשֵׁב, שָׁם אֶפְשָׁר לִלְמֹד טַקְטִיקוֹת טוֹב יוֹתֵר מֵאֲשֶׁר עַל הַמִּגְרָשׁ, אִמָּא שֶׁלִּי אִרְגְּנָה חֲטִיפִים וּשְׁתִיָּה וּבְמַהֲלַךְ הָעֶרֶב נַזְמִין הַמְבּוּרְגֶּרִים לְכֻלָּם, אוֹ-קֵיי?\""}, {"question": "מָה יַעֲשׂוּ בַּמְּסִבָּה?", "options": ["יִצְפּוּ בִּסְרָטִים שֶׁל כַּדּוּרֶגֶל", "יִשְׂחוּ בַּבְּרֵכָה", "יֵצְאוּ לְטִיּוּל", "יְצַיְּרוּ"], "answer": 0}, {"text": "\"מַ גְ נִ י ב!\" מִתְלַהֵב תּוֹם, \"עִם צִ'יפְּס וּמָלֵא רְטָבִים?\""}, {"text": "\"עִם מַה שֶּׁאַתֶּם רוֹצִים\", צוֹחֵק נָתִי."}, {"text": "רוֹנִי וְיוֹן-יוֹן מְהַנְהֲנִים, \"נִשְׁמָע נֶחְמָד, לֹא?\""}, {"text": "\"אֲנִי בָּעִנְיָן\", עוֹנֶה צַחִי."}, {"text": "\"אֲנִי לֹא אוֹהֶבֶת הַמְבּוּרְגֶּר\", מְמַלְמֶלֶת עֹמֶר."}, {"text": "יוּבַל וְדָנִיֵּאל מַבִּיטִים זֶה בָּזֶה."}, {"text": "\"לֹא, תּוֹדָה!\" מַחְלִיט דָּנִיֵּאל."}, {"question": "מִי אָמַר \"לֹא, תּוֹדָה!\"?", "options": ["דָּנִיֵּאל", "תּוֹם", "צַחִי", "רוֹנִי"], "answer": 0}, {"text": "יוּבַל מֵנִיד בְּרֹאשׁוֹ לִשְׁלִילָה."}, {"text": "\"אֵיךְ שֶׁבָּא לָכֶם!\" עוֹנֶה נָתִי."}, {"text": "\"אֲבָל אִם תִּתְחָרְטוּ אַתֶּם יְכוֹלִים לְהִצְטָרֵף אֵלֵינוּ\"."}, {"text": "\"כְּדַאי לָכֶם לָבוֹא! אַחֶרֶת אֲנַחְנוּ נְטַפֵּל בַּמָּנוֹת שֶׁלָּכֶם!\" מְאַיֵּם יוֹן-יוֹן."}]}, {"id": "tzidi-6", "title": "צִידִי הַגּוֹלִים 6: יוֹם נִשּׂוּאִין", "theme": "ספר: צידי הגולים, פרק 6 מתוך 8", "steps": [{"text": "אַחַר הַצָּהֳרַיִם, יוּבַל, עֹמֶר וְדָנִיֵּאל נִפְגָּשִׁים בַּמִּגְרָשׁ, מַצַּב רוּחָם עַל הַפָּנִים, כָּךְ גַּם מֶזֶג הָאֲוִיר."}, {"text": "עַנְנֵי גֶּשֶׁם כְּבֵדִים נִשָּׂאִים מֵעֲלֵיהֶם, הַשָּׁמַיִם קוֹדְרִים וּכְבֵדִים, בְּדִיּוּק כְּמוֹ מַחְשְׁבוֹתָיו שֶׁל דָּנִיֵּאל."}, {"question": "אֵיךְ מֶזֶג הָאֲוִיר?", "options": ["קוֹדֵר וּמְעֻנָּן", "שִׁמְשִׁי וְחַם", "יוֹרֵד שֶׁלֶג", "נוֹשֶׁבֶת רוּחַ חַמָּה"], "answer": 0}, {"text": "\"בּוֹגְדִים!\" הוּא כּוֹעֵס, \"יוֹשְׁבִים לָהֶם שָׁם עַכְשָׁו מוּל הַטֶּלֶוִיזְיָה, בִּמְקוֹם לְהִתְאַמֵּן\"."}, {"text": "\"אוּלַי הֵם צוֹדְקִים\", מֵשִׁיב יוּבַל בְּעוֹדוֹ נוֹשֵׂא מַבָּטוֹ מַעְלָה אֶל הַשָּׁמַיִם הָאֲפֹרִים."}, {"text": "\"וְכָל זֶה רַק בִּגְלַל הַשַּׁחְצָן הַזֶּה\", נֶאֱנַח דָּנִיֵּאל, \"עִם הַחֻלְצָה שֶׁלּוֹ הוּא נִרְאֶה כְּמוֹ אֵיזוֹ צִרְעָה וּכְאִלּוּ זֶה לֹא מַסְפִּיק – אָז גַּם מוֹפִיעַ לוֹ עַל הַחֻלְצָה הַמִּסְפָּר שֶׁל בֶּקְהֶם! כְּאִלּוּ דָּה, הוּא כְּבָר בִּכְלָל לֹא אָפְנָתִי\"."}, {"text": "\"אַתָּה סְתָם מְקַנֵּא\", קוֹבַעַת עֹמֶר."}, {"question": "מָה עֹמֶר חוֹשֶׁבֶת עַל דָּנִיֵּאל?", "options": ["שֶׁהוּא מְקַנֵּא", "שֶׁהוּא צוֹדֵק", "שֶׁהוּא עָיֵף", "שֶׁהוּא שָׂמֵחַ"], "answer": 0}, {"text": "\"שְׁטֻיּוֹת!\" דָּנִיֵּאל מֵנִיד אֶת רֹאשׁוֹ, \"אֲנִי פָּשׁוּט לֹא רוֹצֶה אוֹתוֹ בַּקְּבוּצָה וַאֲנַחְנוּ גַּם לֹא מַמָּשׁ צְרִיכִים אוֹתוֹ, אֲנַחְנוּ שִׁבְעָה, גַּם בַּקְּבוּצָה שֶׁל בֵּית סֵפֶר שְׁחָקִים יֵשׁ שִׁבְעָה שַׂחְקָנִים, אֵין לָנוּ צֹרֶךְ בְּעוֹד שַׂחְקָן\"."}, {"text": "יוּבַל מְכַחְכֵּחַ בִּגְרוֹנוֹ, בִּמְבוּכָה. \"יֵשׁ רַק בְּעָיָה אַחַת\", הוּא אוֹמֵר בִּזְהִירוּת."}, {"text": "דָּנִיֵּאל מַבִּיט בּוֹ בִּתְמִיהָה."}, {"text": "\"אֲנַחְנוּ לֹא שִׁבְעָה...\" הוּא לוֹחֵשׁ."}, {"text": "עֹמֶר וְדָנִיֵּאל מַמָּשׁ לֹא מְבִינִים וְהֵם מַבִּיטִים בּוֹ שְׁנֵיהֶם בִּשְׁאֵלָה."}, {"text": "\"אֲנִי לֹא יָכוֹל לְהִשְׁתַּתֵּף מָחָר\", אוֹמֵר יוּבַל."}, {"question": "מָה יוּבַל מְסַפֵּר לַחֲבֵרִים?", "options": ["שֶׁהוּא לֹא יָכוֹל לְהִשְׁתַּתֵּף מָחָר", "שֶׁהוּא חוֹלֶה", "שֶׁהוּא עוֹבֵר דִּירָה", "שֶׁהוּא רוֹצֶה לִהְיוֹת שׁוֹעֵר"], "answer": 0}, {"text": "\"מָה?!\" מִתְרַעֲמִים הַשְּׁנַיִם בְּקוֹלֵי קוֹלוֹת."}, {"text": "\"חֲזֹר שֵׁנִית\", מְסַנֵּן דָּנִיֵּאל בְּשֶׁקֶט, \"אַתָּה לֹא יָכוֹל לְשַׂחֵק? אֲבָל זֶה בִּלְתִּי אֶפְשָׁרִי\"."}, {"text": "יוּבַל הוּא הַשַּׂחְקָן שֶׁמְּנַהֵל אֶת הַמִּשְׂחָק, הַמִּקְצוֹעָן, זֶה שֶׁאַף פַּעַם לֹא מְוַתֵּר..."}, {"text": "\"אֲנִי לֹא אֶהְיֶה\", חוֹזֵר יוּבַל. \"הַסָּבִים שֶׁלִּי חוֹגְגִים יוֹם נִשּׂוּאִין 50, אֲנִי חַיָּב לִהְיוֹת שָׁם, אַחֶרֶת יַעֲשׂוּ לִי אֶת הַמָּוֶת בַּבַּיִת, אֲנִי כָּל כָּךְ מִצְטַעֵר, שָׁכַחְתִּי מִזֶּה לְגַמְרֵי\"."}, {"question": "לָמָּה יוּבַל לֹא יָבוֹא לַמִּשְׂחָק?", "options": ["כִּי לַסָּבִים שֶׁלּוֹ יֵשׁ יוֹם נִשּׂוּאִין", "כִּי יֵשׁ לוֹ מִבְחָן", "כִּי הוּא כּוֹעֵס", "כִּי הוּא נוֹסֵעַ לְטוֹרוֹנְטוֹ"], "answer": 0}, {"text": "\"וָואוּ אָחִי, זֶה לֹא יְאֻמַּן!\" נֶאֱנַחַת עֹמֶר."}, {"text": "\"טוֹב, אָז נִהְיֶה רַק שִׁשָּׁה\", מַרְגִּיעַ דָּנִיֵּאל."}, {"text": "\"אֲבָל אִם נִהְיֶה שִׁבְעָה זֶה יִהְיֶה יוֹתֵר טוֹב\", מְשִׁיבָה עֹמֶר."}, {"text": "יוּבַל מְהַנְהֵן, \"אֲנַחְנוּ בְּסוֹפוֹ שֶׁל דָּבָר הֲרֵי רוֹצִים אֶת הַגָּבִיעַ, זֶה הֲכִי חָשׁוּב, לֹא?\""}, {"text": "דָּנִיֵּאל כּוֹעֵס, בְּרוּרָה לוֹ לְגַמְרֵי מַהִי מַשְׁמָעוּת הַדָּבָר, זֶה אוֹמֵר שֶׁנְּתַנְאֵל הַשַּׁחְצָן יִשְׁתַּתֵּף בַּמִּשְׂחָק, שֶׁהוּא יִלְבַּשׁ אֶת הַחֻלְצָה שֶׁל יוּבַל, בְּעוֹד יוּבַל יֵשֵׁב אֵצֶל הַסָּבִים שֶׁלּוֹ בְּכֵיף וְיֹאכַל בַּהֲנָאָה רַבָּה עוּגַת שׁוֹקוֹלָד טְעִימָה."}, {"question": "מִי יְשַׂחֵק בִּמְקוֹם יוּבַל?", "options": ["נָתִי", "אָבִי", "דָּנִיֵּאל", "הַסַּבָּא"], "answer": 0}, {"text": "בֶּטַח נָתִי שׁוּב יַשְׁוִיץ עִם הַיְּכוֹלוֹת שֶׁלּוֹ, וְאַחַר כָּךְ הוּא גַּם יִהְיֶה הַכּוֹכָב הַגָּדוֹל שֶׁל הַמִּשְׂחָק, זֶה לֹא פֵיר וְזֶה מְעַצְבֵּן!"}, {"text": "בָּרָק זוֹהֵר מַבְזִיק עַל הַמִּגְרָשׁ, גֶּשֶׁם מַתְחִיל לָרֶדֶת."}, {"text": "עֹמֶר וְיוּבַל רָצִים וּמְחַפְּשִׂים מַחְסֶה מִתַּחַת לַגַּג שֶׁל אוּלַם הַסְּפּוֹרְט."}, {"text": "דָּנִיֵּאל נִשְׁאָר לַעֲמֹד בַּגֶּשֶׁם, מִצִּדּוֹ הוּא יָכוֹל לְהֵרָטֵב עַד לָעֲצָמוֹת, אֵין בְּעָיָה!"}, {"text": "הֲכִי גָּרוּעַ, מָחָר הוּא יִהְיֶה חוֹלֶה. אָז מָה? יוֹתֵר טוֹב מִלִּהְיוֹת בַּגְּמָר, בּוֹ יִשְׁתַּתֵּף נָתִי הַשַּׁחְצָן."}, {"text": "יוֹתֵר מִזֶּה, הָיָה מַתְאִים לוֹ מְאֹד אִם סוּפַת גְּשָׁמִים הָיְתָה מַשְׁמִידָה אֶת מִגְרַשׁ הַסְּפּוֹרְט – הוֹרֶסֶת אֶת הַמִּדְשָׁאָה, מוֹחֶקֶת אֶת הַסִּמּוּנִים, מְעִיפָה אֶת הַשְּׁעָרִים..."}, {"text": "קָדִימָה, סוּפָה – תִּשְׁתּוֹלְלִי לָךְ!"}, {"text": "תַּרְאִי לָנוּ לְמָה אַתְּ מְסֻגֶּלֶת!"}, {"question": "מָה דָּנִיֵּאל רוֹצֶה שֶׁתַּעֲשֶׂה הַסּוּפָה?", "options": ["שֶׁתַּהֲרֹס אֶת הַמִּגְרָשׁ", "שֶׁתַּפְסִיק מַהֵר", "שֶׁתָּבִיא שֶׁלֶג", "שֶׁתַּעֲזֹר לַקְּבוּצָה"], "answer": 0}]}, {"id": "tzidi-7", "title": "צִידִי הַגּוֹלִים 7: יֵשׁ שָׁם עוֹד מַשֶּׁהוּ בַּמִּשְׂחָק...", "theme": "ספר: צידי הגולים, פרק 7 מתוך 8", "steps": [{"text": "אֲבָל, לְמָחֳרַת הַיּוֹם, הַסּוּפָה נֶחֱלֶשֶׁת וְהַשֶּׁמֶשׁ חוֹזֶרֶת לִזְרֹחַ, בְּדִיּוּק בַּזְּמַן לַמִּשְׂחָק הַגָּדוֹל."}, {"text": "מַצַּב הָרוּחַ שֶׁל קְהַל הַצּוֹפִים מְרוֹמָם."}, {"text": "רַבִּים הִגִּיעוּ לִצְפּוֹת בָּהֶם וּלְעוֹדֵד אוֹתָם."}, {"text": "שַׂחְקָנֵי בֵּית הַסֵּפֶר \"שְׂחָקִים\" בְּטוּחִים בְּנִצְחוֹנָם, הֵם רוֹצִים לִזְכּוֹת בַּגָּבִיעַ, בְּכָל מְחִיר!"}, {"question": "אֵיךְ מֶזֶג הָאֲוִיר בְּיוֹם הַמִּשְׂחָק?", "options": ["הַשֶּׁמֶשׁ זוֹרַחַת", "יֵשׁ סוּפָה", "יוֹרֵד שֶׁלֶג", "יֵשׁ עֲרָפֶל"], "answer": 0}, {"text": "אֲבָל גַּם כִּתָּה ג'3 נְחוּשָׁה לִזְכּוֹת בּוֹ, הֵם נִלְחָמִים כְּמוֹ אֲרָיוֹת, לֹא מְוַתְּרִים עַל אַף כַּדּוּר, לֹא מְפַסְפְּסִים אַף מְסִירָה, לֹא מַחֲטִיאִים שׁוּם בְּעִיטָה."}, {"text": "\"קָדִימָה, חֶבְרֶ'ה!\" קוֹרֵא אָבִי הַמְּאַמֵּן מִשּׁוּלֵי הַמִּגְרָשׁ, \"תַּמְשִׁיכוּ כָּךְ!\""}, {"text": "הֵם תּוֹקְפִים, שׁוּב וָשׁוּב."}, {"text": "קְצָת לִפְנֵי סוֹף הַמִּשְׂחָק הַתּוֹצָאָה עוֹמֶדֶת עַל 1:1."}, {"text": "הֵם טוֹבִים, הַשַּׂחְקָנִים שֶׁלִּי, מוֹדֶה אָבִי בִּפְנֵי עַצְמוֹ, הֵם פָּשׁוּט חַיָּבִים לְהַצְלִיחַ."}, {"question": "מָה הַתּוֹצָאָה קְצָת לִפְנֵי הַסּוֹף?", "options": ["1:1", "2:0", "0:0", "3:1"], "answer": 0}, {"text": "יוֹן-יוֹן מְקַבֵּל אֶת הַכַּדּוּר, הוּא מַנִּיחַ אוֹתוֹ לְרַגְלָיו וְיוֹצֵא בְּרִיצָה בְּעוֹדוֹ בּוֹעֵט בַּכַּדּוּר בְּעִיטוֹת קְצָרוֹת וּמְדֻיָּקוֹת."}, {"text": "לְפֶתַע, אֶחָד מִשַּׂחְקָנֵי בֵּית סֵפֶר \"שְׂחָקִים\" חוֹתֵךְ אוֹתוֹ וְחוֹטֵף מִמֶּנּוּ אֶת הַכַּדּוּר, הוּא בּוֹעֵט בַּכַּדּוּר לַצַּד הַשְּׂמָאלִי שֶׁל הַמִּגְרָשׁ."}, {"text": "בַּצַּד הַשְּׂמָאלִי עוֹמֵד שַׂחְקָן הַקִּשּׁוּר לְבַדּוֹ."}, {"text": "\"מִישֶׁהוּ שֶׁיָּרוּץ לְשָׁם, קָדִימָה!\" צוֹרֵחַ אָבִי."}, {"text": "רוֹנִי יוֹצֵא בְּרִיצָה לַכִּוּוּן, אֲבָל נָתִי מָהִיר יוֹתֵר, הוּא חוֹטֵף אֶת הַכַּדּוּר וּ\"מְנַפְנֵף\" אֶת הַיָּרִיב בְּקַלִּילוּת, אַף אֶחָד לֹא חוֹסֵם אוֹתוֹ וְהוּא נִמְצָא רַק מִסְפַּר מֶטְרִים בּוֹדְדִים מֵהַשַּׁעַר, הַגּוֹל הַזֶּה נִתָּן לְהַשָּׂגָה..."}, {"question": "מִי חוֹטֵף אֶת הַכַּדּוּר וּמַגִּיעַ קָרוֹב לַשַּׁעַר?", "options": ["נָתִי", "רוֹנִי", "תּוֹם", "עֹמֶר"], "answer": 0}, {"text": "\"קָדִימָה, תִּבְעַט כְּבָר!\" צוֹרֵחַ אָבִי."}, {"text": "אֲבָל נָתִי לֹא בּוֹעֵט."}, {"text": "הוּא מִסְתּוֹבֵב, מִתְבּוֹנֵן בַּקָּהָל, מְכַדְרֵר אֶת הַכַּדּוּר."}, {"text": "\"וָואוּוּ...\" לוֹחֵשׁ הַקָּהָל בְּהִתְלַהֲבוּת."}, {"text": "אוֹי לֹא! חוֹשֵׁב דָּנִיֵּאל, מְעֻצְבָּן."}, {"text": "נָתִי מַרְקִיד אֶת הַכַּדּוּר עַל רַגְלָיו וּמְגַלְגֵּל אוֹתוֹ בְּמוֹרַד קַרְסֻלּוֹ."}, {"text": "הִתְנַהֲלוּת כָּל כָּךְ מְיֻתֶּרֶת, כּוֹעֵס דָּנִיֵּאל."}, {"question": "לָמָּה דָּנִיֵּאל מְעֻצְבָּן?", "options": ["כִּי נָתִי מַשְׁוִיץ בִּמְקוֹם לִבְעֹט", "כִּי נָתִי הִבְקִיעַ", "כִּי הַשּׁוֹפֵט צָעַק", "כִּי יָרַד גֶּשֶׁם"], "answer": 0}, {"text": "בֵּינְתַיִם, מַקִּיפִים אוֹתוֹ שַׂחְקָנֵי בֵּית סֵפֶר \"שְׂחָקִים\"."}, {"text": "הוּא בּוֹעֵט לְבַסּוֹף אֶת הַכַּדּוּר לְרוֹנִי."}, {"text": "רוֹנִי מַעֲבִיר אֶת הַכַּדּוּר לְדָנִיֵּאל."}, {"text": "דָּנִיֵּאל מַעֲבִיר אֶת הַכַּדּוּר לְעֹמֶר, שֶׁמַּמְתִּינָה כְּבָר בְּחֹסֶר סַבְלָנוּת."}, {"text": "עֹמֶר מוֹסֶרֶת אֶת הַכַּדּוּר לְצַחִי, אֲבָל זֶה מְפַסְפֵּס אֶת הַכַּדּוּר."}, {"text": "אֶחָד מִשַּׂחְקָנֵי \"שְׂחָקִים\" חוֹטֵף אֶת הַכַּדּוּר וְרָץ בִּצְעָדִים גְּדוֹלִים לְעֵבֶר הַשַּׁעַר."}, {"text": "הַמַּצָּב מְסֻכָּן!"}, {"text": "תּוֹם הַשּׁוֹעֵר מִתְכּוֹנֵן בְּמֶתַח."}, {"text": "בְּרֶגַע זֶה אָבִי הָיָה רוֹצֶה לַעֲלוֹת עַל הַמִּגְרָשׁ בְּעַצְמוֹ."}, {"text": "אֲבָל רוֹנִי מַצִּיל אֶת הַמַּצָּב, בְּהֶחְלֵטִיּוּת הוּא חוֹטֵף מִשַּׂחְקַן \"שְׂחָקִים\" אֶת הַכַּדּוּר."}, {"question": "מִי מַצִּיל אֶת הַמַּצָּב לְיַד הַשַּׁעַר שֶׁל ג'3?", "options": ["רוֹנִי", "צַחִי", "נָתִי", "אָבִי"], "answer": 0}, {"text": "כָּעֵת כֻּלָּם רָצִים לַכִּוּוּן הַשֵּׁנִי, לְכִוּוּן הַשַּׁעַר שֶׁל הַיָּרִיב."}, {"text": "בִּרְחָבַת הַ-16 רוֹנִי בּוֹעֵט בְּחָזְקָה אֶת הַכַּדּוּר לַגֹּבַהּ."}, {"text": "לְפֶתַע כֻּלָּם כָּאן, בִּרְחָבַת הַ-16, קְבוּצַת \"שְׂחָקִים\", וְהַקְּבוּצָה שֶׁל כִּתָּה ג'3, כֻּלָּם רוֹצִים לִנְגֹּחַ בַּכַּדּוּר."}, {"text": "אֲבָל עוֹד מַשֶּׁהוּ מוֹפִיעַ לְפֶתַע בַּמִּשְׂחָק, אֶחָד מִשַּׂחְקָנֵי קְבוּצַת \"שְׂחָקִים\" מוֹשִׁיט זְרוֹעַ יְרֻקָּה וַאֲרֻכָּה וְחוֹבֵט בַּכַּדּוּר, מוֹצִיא אוֹתוֹ מֵאֵזוֹר הַסַּכָּנָה."}, {"text": "הַשּׁוֹפֵט שׁוֹרֵק נִמְרָצוֹת לַעֲצִירָה."}, {"text": "\"יָד!\" יָד בִּרְחָבַת הַ-16, זֶה פָּשׁוּט לֹא יְאֻמַּן!"}, {"text": "הָעֹנֶשׁ לֹא מְאַחֵר לְהַגִּיעַ: בְּעִיטַת שִׁבְעָה מֶטְרִים, זוֹ הַהִזְדַּמְּנוּת עֲבוּר ג'3! הִזְדַּמְּנוּת פָּז, שֶׁמַּגִּיעָה מַמָּשׁ לִקְרַאת סִיּוּם הַמִּשְׂחָק."}, {"question": "לָמָּה הַשּׁוֹפֵט שָׁרַק?", "options": ["שַׂחְקָן נָגַע בַּכַּדּוּר בַּיָּד", "הַמִּשְׂחָק נִגְמַר", "יָרַד גֶּשֶׁם", "נָתִי נָפַל"], "answer": 0}, {"text": "אֲבָל לְמִי הֵם יִתְּנוּ אֶת הַזְּכוּת?"}, {"text": "הַשַּׂחְקָנִים מַבִּיטִים זֶה בָּזֶה, מִתְלַבְּטִים..."}, {"text": "דָּבָר אֶחָד בָּרוּר לְכֻלָּם: מִי שֶׁיְּפַסְפֵּס, יְפַסְפֵּס לְכֻלָּם גַּם אֶת הַנִּצָּחוֹן."}, {"text": "צַחִי מֵנִיד בְּרֹאשׁוֹ. עֹמֶר שׁוֹתֶקֶת. יוֹן-יוֹן וְרוֹנִי מַשְׁפִּילִים אֶת מַבָּטָם."}, {"text": "\"אַתָּה!\" מַחְלִיט דָּנִיֵּאל וּמַצְבִּיעַ עַל נָתִי."}, {"text": "הֲרֵי הוּא תָּמִיד רוֹצֶה לְהַרְאוֹת לְכֻלָּם מָה הוּא מְסֻגָּל לַעֲשׂוֹת."}, {"text": "אִם הוּא יַבְקִיעַ, זֶה יִהְיֶה נֶהְדָּר, אָז מָה אִם הוּא יְקַבֵּל אֶת מְחִיאוֹת הַכַּפַּיִם?!"}, {"text": "אֵין צֹרֶךְ לְקַנֵּא, הָעִקָּר הַנִּצָּחוֹן."}, {"text": "אֶת בְּעִיטַת שִׁבְעַת הַמֶּטְרִים כִּמְעַט כָּל אֶחָד מְסֻגָּל לְבַצֵּעַ, וְאִם הוּא לֹא יַצְלִיחַ... הוּא יִהְיֶה בִּבְעָיָה וְזֶה יָשִׂים קֵץ לַשַּׁחְצָנוּת שֶׁלּוֹ."}, {"question": "לָמָּה דָּנִיֵּאל בּוֹחֵר בְּנָתִי לִבְעֹט?", "options": ["כִּי נָתִי תָּמִיד רוֹצֶה לְהַרְאוֹת מָה הוּא יוֹדֵעַ", "כִּי נָתִי הַשּׁוֹעֵר", "כִּי אָבִי בִּקֵּשׁ", "כִּי נָתִי בִּקֵּשׁ"], "answer": 0}, {"text": "דָּנִיֵּאל מַנִּיחַ אֶת הַכַּדּוּר עֲבוּר נָתִי עַל סִמּוּן שִׁבְעַת הַמֶּטְרִים."}, {"text": "\"יַאלְלָה, בְּהַצְלָחָה!\" הוּא מְאַחֵל לְנָתִי."}, {"text": "\"לֹא!\" לוֹחֵשׁ נָתִי."}, {"text": "לְמָה הוּא מִתְכַּוֵּן? תּוֹהִים כֻּלָּם."}, {"text": "\"אֲנִי לֹא יָכוֹל לַעֲשׂוֹת אֶת זֶה\", אוֹמֵר נָתִי בְּקוֹל רָם, כָּךְ שֶׁכֻּלָּם שׁוֹמְעִים אוֹתוֹ."}, {"text": "\"אֲנִי לֹא מְסֻגָּל לַעֲשׂוֹת אֶת זֶה\", הוּא חוֹזֵר וְאוֹמֵר בַּשֵּׁנִית."}, {"question": "מָה אוֹמֵר נָתִי לִפְנֵי הַבְּעִיטָה?", "options": ["שֶׁהוּא לֹא מְסֻגָּל לִבְעֹט", "שֶׁהוּא יִבְעַט חָזָק", "שֶׁהוּא עָיֵף", "שֶׁהוּא רוֹצֶה לָלֶכֶת"], "answer": 0}, {"text": "בְּאוֹתוֹ הָרֶגַע תּוֹם פּוֹרֵץ קָדִימָה בְּרִיצָה, כְּמוֹ טִיל, הוּא לֹא עוֹצֵר לִפְנֵי הַכַּדּוּר וְהוּא בּוֹעֵט בּוֹ תּוֹךְ כְּדֵי רִיצָה."}, {"text": "לִפְנֵי שֶׁהַשּׁוֹעֵר הַיָּרִיב מַבְחִין בְּמָה שֶׁקּוֹרֶה, הַכַּדּוּר כְּבָר נִכְנָס לְתוֹךְ הָרֶשֶׁת."}, {"text": "\"גּ וֹ ל !!! גּ וֹ ל!\" צְעָקוֹת מַחֲרִישׁוֹת אָזְנַיִם נִשְׁמָעוֹת מִקְּהַל הַמְּעוֹדְדִים."}, {"text": "\"2:1, נִצַּחְנוּ!\" צוֹעֲקִים בְּהִתְרַגְּשׁוּת חַבְרֵי הַקְּבוּצָה."}, {"text": "שְׁרִיקַת הַסִּיּוּם נִשְׁמַעַת."}, {"text": "הַמִּשְׂחָק נִגְמַר."}, {"question": "מִי הִבְקִיעַ אֶת הַגּוֹל הַמְּנַצֵּחַ?", "options": ["תּוֹם הַשּׁוֹעֵר", "נָתִי", "דָּנִיֵּאל", "רוֹנִי"], "answer": 0}]}, {"id": "tzidi-8", "title": "צִידִי הַגּוֹלִים 8: רַק עַד לַסְּתָו", "theme": "ספר: צידי הגולים, פרק 8 מתוך 8", "steps": [{"text": "\"תָּמִיד רָצִיתִי לְהַבְקִיעַ שַׁעַר!\" אוֹמֵר בְּשִׂמְחָה תּוֹם."}, {"text": "בַּאֲשֶׁר רַב הוּא אוֹחֵז אֶת הַגָּבִיעַ הַנִּפְלָא וְהַנּוֹצֵץ קָרוֹב לְלִבּוֹ."}, {"text": "\"אַתֶּם שִׂחַקְתֶּם פָּשׁוּט יוֹצֵא מִן הַכְּלָל!\" מְשַׁבֵּחַ אוֹתָם אָבִי."}, {"question": "מָה תּוֹם תָּמִיד רָצָה?", "options": ["לְהַבְקִיעַ שַׁעַר", "לִהְיוֹת מְאַמֵּן", "לִנְסֹעַ לְקָנָדָה", "לִהְיוֹת שׁוֹפֵט"], "answer": 0}, {"text": "\"וָואוּ, נָתִי, זֶה הָיָה פָּשׁוּט מַגְנִיב\", אוֹמֵר דָּנִיֵּאל, \"לְהוֹדוֹת בִּפְנֵי כֻּלָּם שֶׁאַתָּה לֹא מְסֻגָּל לְבַצֵּעַ מַשֶּׁהוּ – לֹא כָּל אֶחָד מְסֻגָּל לְכָךְ\"."}, {"text": "\"שְׁטֻיּוֹת, חוּץ מִזֶּה, אֲנִי דֵּי מֻשְׁלָם\", אוֹמֵר בְּחִיּוּךְ נָתִי."}, {"text": "כֻּלָּם מְבִינִים שֶׁנְּתַנְאֵל בְּעֶצֶם צוֹחֵק עַל חֶשְׁבּוֹנוֹ."}, {"question": "לָמָּה דָּנִיֵּאל אוֹמֵר שֶׁנָּתִי הָיָה מַגְנִיב?", "options": ["כִּי הוּא הוֹדָה שֶׁהוּא לֹא מְסֻגָּל", "כִּי הוּא הִבְקִיעַ", "כִּי הוּא הֵבִיא כַּדּוּר", "כִּי הוּא לָבַשׁ חֻלְצָה יָפָה"], "answer": 0}, {"text": "אֲבָל אָז הוּא חוֹזֵר לִהְיוֹת רְצִינִי, \"אֲנִי צָרִיךְ לְסַפֵּר לָכֶם מַשֶּׁהוּ, אֲנִי נִשְׁאָר רַק עַד הַסְּתָו בַּכִּתָּה שֶׁלָּכֶם, בַּסְּתָו מַעֲבִירִים אֶת אַבָּא שֶׁלִּי לְתַפְקִיד אַחֵר, וַאֲנַחְנוּ שׁוּב עוֹבְרִים לְעִיר אַחֶרֶת\"."}, {"text": "\"אוּלַי חֲזָרָה לְטוֹרוֹנְטוֹוֹוֹ...?\" לוֹעֵג דָּנִיֵּאל."}, {"question": "מָה יִקְרֶה לְנָתִי בַּסְּתָו?", "options": ["הוּא יַעֲבֹר לְעִיר אַחֶרֶת", "הוּא יִהְיֶה מְאַמֵּן", "הוּא יַעֲלֶה כִּתָּה", "הוּא יִשָּׁאֵר לְתָמִיד"], "answer": 0}, {"text": "עֹמֶר תּוֹקַעַת מַרְפֵּק בְּצַלְעוֹתָיו, \"תַּפְסִיק כְּבָר!\""}, {"text": "\"זֶה לֹא קַל בִּכְלָל וּבֶטַח מְבָאֵס מְאֹד לְהַחֲלִיף כָּל הַזְּמַן בָּתֵּי סֵפֶר, נָכוֹן?\" שׁוֹאֵל רוֹנִי."}, {"text": "נָתִי מֵשִׁיב: \"זֶה אֲפִלּוּ מְאֹד מְבָאֵס, בְּדִיּוּק כְּשֶׁאֲנִי מוֹצֵא חֲבֵרִים, אֲנִי חַיָּב לַעֲזֹב שׁוּב\"."}, {"question": "מָה הֲכִי מְבָאֵס לְנָתִי?", "options": ["לַעֲזֹב בְּדִיּוּק כְּשֶׁהוּא מוֹצֵא חֲבֵרִים", "לְהַפְסִיד בְּמִשְׂחָק", "לִלְמֹד חֶשְׁבּוֹן", "לֶאֱכֹל הַמְבּוּרְגֶּר"], "answer": 0}, {"text": "\"אַל דְּאָגָה, עַד הַסְּתָו יֵשׁ עוֹד הַרְבֵּה זְמַן וְעַד אָז אֲנַחְנוּ נַעֲזֹר לְךָ לְהִתְאַמֵּן בְּ-אֵיךְ לִמְצֹא חֲבֵרִים יוֹתֵר מַהֵר\", מַבְטִיחִים חֲבֵרָיו לַקְּבוּצָה."}, {"text": "נָתִי מְחַיֵּךְ, \"אוֹ-קֵיי, וַאֲנִי אַרְאֶה לָכֶם כַּמָּה טְרִיקִים עִם הַכַּדּוּר\"."}, {"text": "\"וַאֲנַחְנוּ נְלַמֵּד אוֹתְךָ אֵיךְ מַבְקִיעִים אֶת בְּעִיטַת-שִׁבְעַת הַמֶּטְרִים!\" מַקְנִיטָה עֹמֶר."}, {"text": "\"וּבַשָּׁנָה הַבָּאָה אֲנַחְנוּ נְשַׂחֵק נֶגֶד הַקְּבוּצָה הַחֲדָשָׁה שֶׁלְּךָ, מִתְעָרְבִים שֶׁאֲנַחְנוּ נְנַצֵּחַ?\""}, {"text": "\"אֲנִי מַצִּיעַ שֶׁנַּתְחִיל בָּאִמּוּן!\" קוֹרֵא צַחִי וּבוֹעֵט אֶת הַכַּדּוּר הַרְחֵק."}, {"text": "כֻּלָּם מַתְחִילִים לָרוּץ אַחֲרָיו."}, {"text": "רַק תּוֹם נִשְׁאָר מֵאָחוֹר, הוּא נוֹשֵׁק לַגָּבִיעַ בַּסֵּתֶר, הַגּוֹל הָרִאשׁוֹן שֶׁלּוֹ!"}, {"text": "עַכְשָׁו יִהְיֶה לוֹ עַל מָה לַחֲלֹם בִּזְמַן שֶׁהוּא יַעֲמֹד וְיִשְׁתַּעֲמֵם בַּשַּׁעַר לְבַד."}, {"question": "מָה עָשָׂה תּוֹם בַּסֵּתֶר?", "options": ["נָשַׁק לַגָּבִיעַ", "בָּכָה", "אָכַל עוּגָה", "הָלַךְ הַבַּיְתָה"], "answer": 0}, {"question": "מָה לָמְדוּ הַיְּלָדִים בַּסִּפּוּר?", "options": ["שֶׁכַּדּוּרֶגֶל הוּא מִשְׂחָק שֶׁל קְבוּצָה", "שֶׁכְּדַאי לְהַשְׁוִיץ", "שֶׁכְּדַאי לְשַׂחֵק לְבַד", "שֶׁגֶּשֶׁם מַפְרִיעַ לְכַדּוּרֶגֶל"], "answer": 0}]}]}];

  }).map((p, i) => Object.assign(p, { w: 7 + Math.random() * 7, h: 10 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * 14, sway: Math.random() * 6, color: colors[i % colors.length], round: i % 5 === 0 }));

  for (let i = 0; i < n; i++) {
    const el = document.createElementNS("http://www.w3.org/2000/svg", confetti ? "rect" : "circle");
    if (confetti) { el.setAttribute("width", 5); el.setAttribute("height", 8); el.setAttribute("x", -2.5); el.setAttribute("y", -4); el.setAttribute("fill", colors[i % colors.length]); }
    else { el.setAttribute("r", 4 + Math.random() * 3); el.setAttribute("fill", "#d8c094"); }
    g.appendChild(el);
    parts.push({ el, vx: (Math.random() - .5) * (confetti ? 300 : 90), vy: confetti ? -(140 + Math.random() * 170) : -(8 + Math.random() * 22), r: Math.random() * 360, vr: (Math.random() - .5) * 900 });

function play(frames, total, done) {

  const step = now => {
    const t = Math.min(1, (now - t0) / (reduceMotion ? total / 3 : total));

const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function resetScene() { setKid(70, 0, 0, 0, 0); setBanana(300, 0, 0); $("#stars") && $("#stars").setAttribute("opacity", 0); bubble("", ""); idle(); }

function animateCorrect(done) {
  bubble("יֵשׁ!", "good");
  let popped = false, landed = false;
  play(t => {
    const x = 70 + 470 * ease(t), ph = t * 26;
    const inJump = x > 215 && x < 385, j = (x - 215) / 170;
    if (inJump) {
      const y = -58 * Math.sin(Math.PI * j);
      // tuck in the air, stretch toward landing
      setKid(x, y, 0, 30 - 50 * j, 130 - 60 * j, { knee: 70 - 50 * j, elbow: -30, lean: 8 - 10 * j });
    } else {
      setKid(x, 0, 0, Math.sin(ph) * 34, Math.sin(ph) * 40, { bob: -Math.abs(Math.cos(ph)) * 3, lean: 7 });
    }
    if (!popped && x > 300) { popped = true; screenConfetti(); }
    if (!landed && x >= 385) { landed = true; burst(385, 112, "dust"); }
    const wob = Math.max(0, 1 - Math.abs(x - 300) / 60);
    setBanana(300, 0, Math.sin(t * 60) * 12 * wob);
  }, 1900, () => setTimeout(() => { resetScene(); done && done(); }, 250));
}
function animateWrong(done) {
  play(t => { const x = 70 + 205 * t, ph = t * 14; setKid(x, 0, 0, Math.sin(ph) * 34, Math.sin(ph) * 40, { bob: -Math.abs(Math.cos(ph)) * 3, lean: 7 }); }, 700, () => {
    bubble("אוּפְּס!", "bad");
    let thud = false;
    play(t => {
      if (!thud && t > .66) { thud = true; burst(305, 112, "dust"); }
      const e = ease(t), up = Math.sin(Math.PI * Math.min(1, t * 1.5));
      // feet fly forward, body tips back, arms flail, then a soft bounce on the ground
      const land = t > .66 ? Math.sin(Math.PI * (t - .66) / .34) * 4 : 0;
      setKid(275 + 34 * e, -38 * up - land, -85 * e, -70 * e, 150 * e + Math.sin(t * 30) * 20 * (1 - e), { knee: 15, elbow: -20 + Math.sin(t * 25) * 25 });
      setBanana(300 + 130 * e, -55 * Math.sin(Math.PI * e), 600 * e);
    }, 1000, () => {
      const s = $("#stars");
      s.innerHTML = [0, 1, 2].map(i => `<text class="star" x="${248 + i * 18}" y="${92 - (i % 2) * 8}" font-size="18" fill="#ffc93c" style="animation-delay:${i * 120}ms">★</text>`).join("");
      s.setAttribute("opacity", 1);
      setTimeout(() => { resetScene(); done && done(); }, 1100);
    });
  });
}

// ---------- library: built-in content + what the parent uploaded ----------
// A "lesson" is one text (homework). A "book" is a list of chapters read in order.
// Built-in stories are grouped by their id prefix ("tuki-3" -> book "tuki"); homework themes become lessons.
// Each device belongs to one kid (state.me). Other kids are known from shared storage (kids/*).
const remoteKidCache = {};
function K(id) {
  if (state.kids[id]) return state.kids[id];
  const r = remote.kids.find(k => k.id === id) || { name: "ילד", grade: 2 };
  const c = remoteKidCache[id] = remoteKidCache[id] || { color: "#2f6fe4", candies: 0, levelCandies: {}, runs: {} };
  return Object.assign(c, { name: r.name, grade: r.grade, level: levelForGrade(r.grade) });
}
function allKidIds() { return [...new Set([...Object.keys(state.kids), ...remote.kids.map(k => k.id)])]; }
async function registerKid() {
  if (!remote.db || !state.me) return;
  const k = state.kids[state.me], ref = remote.db.doc("kids/" + state.me);
  try {
    const cur = await ref.get();
    if (!cur.exists || cur.data().name !== k.name || cur.data().grade !== k.grade) await ref.set({ name: k.name, grade: k.grade, updatedAt: Date.now() });
  } catch (e) {}
}
function builtinFor(kidId) {
  const lvl = levelFor(K(kidId));
  const lessons = [], books = {};
  for (const L of CONTENT) for (const s of L.stories) if (s.theme === "שיעורי בית") lessons.push({ id: s.id, kind: "lesson", title: s.title, createdAt: 0, stories: [s] });
  for (const s of lvl.stories) {
    if (s.theme === "שיעורי בית") { if (0) lessons.push({ id: s.id, kind: "lesson", title: s.title, createdAt: 0, stories: [s] }); continue; }
    const m = /^(.+)-\d+$/.exec(s.id), key = m ? m[1] : "short";
    const t = /^(?:ספר|סיפור): (.+?), פרק/.exec(s.theme || "");
    (books[key] = books[key] || { id: "builtin-" + key, kind: "book", title: t ? t[1] : "סיפורים קצרים", createdAt: 0, stories: [] }).stories.push(s);
  }
  return { lessons, books: Object.values(books) };
}

// Data shared between the parent's phone and the kid's tablet (claude.ai artifact storage).
const remote = { why: undefined, db: null, sample: null, items: [], drafts: [], runs: [], kids: [], loaded: false, slow: false };
const chapterCache = {};
let refresh = null;  // re-renders the current list screen when shared data changes
function remoteItems(kidId, kind) {
  return remote.items.filter(i => i.kid === kidId && i.kind === kind).sort((a, b) => b.createdAt - a.createdAt);
}
function library(kidId) {
  const b = builtinFor(kidId);
  return {
    lessons: [...remoteItems(kidId, "lesson"), ...b.lessons],   // newest first, built-in homework last
    books: [...remoteItems(kidId, "book"), ...b.books],
  };
}
function chapterStub(item, n) { return { id: item.id + "~" + n, title: item.chapters[n].title, remote: true, item, n }; }
function storiesOf(item) { return item.stories || item.chapters.map((_, n) => chapterStub(item, n)); }
async function loadStory(st) {
  if (!st.remote) return st;
  const key = st.item.id + "@" + st.item.version;
  if (!chapterCache[key]) {
    const snap = await remote.db.collection(`items/${st.item.id}/chapters`).get();
    chapterCache[key] = {};
    snap.docs.forEach(d => chapterCache[key][d.data().n] = d.data().steps);
  }
  const steps = chapterCache[key][st.n];
  if (!steps) throw new Error("missing chapter");
